name: One-time left headings no dart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/left-heading-no-dart.yml'

permissions:
  contents: write

jobs:
  update-headings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Left align listed headings and remove section dart icons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          marker='/* Final left-aligned headings without dart icons */'
          if marker in t:
              s=t.index(marker)
              e=t.index('</style>',s)
              t=t[:s]+t[e:]
          css=r'''
/* Final left-aligned headings without dart icons */
.section-title .section-kicker-icon,
.section-title .section-kicker-icon[data-section]{display:none!important}
#company .section-title,
#points .section-title,
.founder-copy .section-title,
#experience .section-title,
#capabilities .section-title,
#network .section-title{
  grid-template-columns:1fr!important;
  justify-items:start!important;
  align-items:start!important;
  text-align:left!important;
  gap:8px!important;
}
#company .section-title>div,
#points .section-title>div,
.founder-copy .section-title>div,
#experience .section-title>div,
#capabilities .section-title>div,
#network .section-title>div{
  width:100%!important;
  justify-content:flex-start!important;
  text-align:left!important;
  gap:0!important;
}
#company .section-title p,
#points .section-title p,
.founder-copy .section-title p,
#experience .section-title p,
#capabilities .section-title p,
#network .section-title p,
#company .section-title h2,
#points .section-title h2,
.founder-copy .section-title h2,
#experience .section-title h2,
#capabilities .section-title h2,
#network .section-title h2{
  margin-left:0!important;
  margin-right:0!important;
  text-align:left!important;
  justify-self:start!important;
}
@media(max-width:760px){
  #company .section-title,
  #points .section-title,
  .founder-copy .section-title,
  #experience .section-title,
  #capabilities .section-title,
  #network .section-title{
    justify-items:start!important;
    text-align:left!important;
  }
}
'''
          t=t.replace('</style>',css+'\n</style>',1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Commit website update and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/left-heading-no-dart.yml
          git add index.html
          git commit -m "Left align section headings and remove dart icons"
          git push
