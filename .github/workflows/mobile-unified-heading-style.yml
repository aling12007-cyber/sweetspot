name: One-time mobile unified heading style

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-unified-heading-style.yml'

permissions:
  contents: write

jobs:
  update-mobile-headings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify mobile heading alignment and typography
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          marker = '/* Mobile unified heading hierarchy */'
          if marker in t:
              s = t.index(marker)
              e = t.index('</style>', s)
              t = t[:s] + t[e:]

          css = dedent(r'''
          /* Mobile unified heading hierarchy */
          @media(max-width:760px){
            #company .section-title,
            #points .section-title,
            .founder-copy .section-title,
            #experience .section-title,
            #network .section-title,
            #capabilities .section-title{
              display:block!important;
              width:100%!important;
              margin-left:0!important;
              margin-right:0!important;
              text-align:left!important;
              justify-items:start!important;
              align-items:start!important;
            }

            #company .section-title>div,
            #points .section-title>div,
            .founder-copy .section-title>div,
            #experience .section-title>div,
            #network .section-title>div,
            #capabilities .section-title>div{
              display:flex!important;
              width:100%!important;
              justify-content:flex-start!important;
              align-items:flex-start!important;
              text-align:left!important;
              gap:0!important;
            }

            #company .section-title p,
            #points .section-title p,
            .founder-copy .section-title p,
            #experience .section-title p,
            #network .section-title p,
            #capabilities .section-title p{
              width:100%!important;
              margin:0!important;
              padding:0!important;
              text-align:left!important;
              justify-self:start!important;
              font-family:Arial,Helvetica,sans-serif!important;
              font-weight:800!important;
              line-height:1.08!important;
              letter-spacing:-.03em!important;
              text-transform:none!important;
              white-space:normal!important;
            }

            /* Large titles */
            #company .section-title p,
            #network .section-title p{
              color:#fff!important;
              font-size:32px!important;
              margin-bottom:17px!important;
            }

            /* Medium titles */
            #points .section-title p,
            .founder-copy .section-title p,
            #capabilities .section-title p{
              color:#f2f4f7!important;
              font-size:25px!important;
              margin-bottom:15px!important;
            }

            /* Small title */
            #experience .section-title p{
              color:#d7dde5!important;
              font-size:20px!important;
              margin-bottom:13px!important;
            }

            /* Supporting text under headings uses one consistent secondary style. */
            #company .section-title h2,
            #points .section-title h2,
            #experience .section-title h2,
            #network .section-title h2,
            #capabilities .section-title h2{
              width:100%!important;
              margin:0!important;
              padding:0!important;
              color:#9da7b4!important;
              font-family:Arial,Helvetica,sans-serif!important;
              font-size:13px!important;
              font-weight:700!important;
              line-height:1.4!important;
              letter-spacing:.02em!important;
              text-align:left!important;
              justify-self:start!important;
              white-space:normal!important;
            }
          }
          ''')

          t = t.replace('</style>', css + '\n</style>', 1)
          p.write_text(t, encoding='utf-8')
          PY
      - name: Commit website update and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mobile-unified-heading-style.yml
          git add index.html
          git commit -m "Unify mobile heading hierarchy"
          git push
