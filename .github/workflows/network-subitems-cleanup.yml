name: One-time Broad Influence subitem cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/network-subitems-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup-network-subitems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate Broad Influence subitem styling
        run: echo '' | base64 -d | python
      - name: Commit website update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/network-subitems-cleanup.yml
          git add index.html
          git commit -m "Refine Broad Influence subitem lists"
          git push
