name: One-time reference network redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/network-reference-redesign.yml'

permissions:
  contents: write

jobs:
  redesign-network-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match Broad Influence reference
        run: python .github/network_reference_patch.py
      - name: Commit website update and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/network-reference-redesign.yml .github/network_reference_patch.py
          git add index.html
          git commit -m "Match Broad Influence reference design"
          git push
