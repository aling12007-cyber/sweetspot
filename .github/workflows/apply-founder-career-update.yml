name: Apply founder career layout update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update layout and numbering
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'index.html';
          let s = fs.readFileSync(path, 'utf8');
          const needle = '#points .section-title,#experience .section-title,#network .section-title,#capabilities .section-title,#offers .section-title{grid-template-columns:1fr;gap:11px;justify-items:center;text-align:center;margin-bottom:28px}';
          const css = needle + '\n.founder-section{padding-bottom:42px}\n#experience{padding-top:34px;border-top:0}\n#experience .section-title>div:first-child>span:empty{display:none}';
          if (!s.includes('.founder-section{padding-bottom:42px}')) {
            if (!s.includes(needle)) throw new Error('CSS insertion point not found');
            s = s.replace(needle, css);
          }
          const replacements = [
            ['number:"03",kicker:{en:"Career Playbook"', 'number:"",kicker:{en:"Career Playbook"'],
            ['number:"04",kicker:{en:"Network & Influence"', 'number:"03",kicker:{en:"Network & Influence"'],
            ['number:"05",kicker:{en:"Demonstrated Capabilities"', 'number:"04",kicker:{en:"Demonstrated Capabilities"'],
            ['number:"06",kicker:{en:"Customized Solutions"', 'number:"05",kicker:{en:"Customized Solutions"']
          ];
          for (const [from, to] of replacements) {
            if (!s.includes(to)) {
              if (!s.includes(from)) throw new Error('Replacement target not found: ' + from);
              s = s.replace(from, to);
            }
          }
          fs.writeFileSync(path, s);
          NODE
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-founder-career-update.yml
          git add index.html
          git commit -m "Merge career playbook into founder section"
          git push
