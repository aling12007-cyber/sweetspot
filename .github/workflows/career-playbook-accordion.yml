name: One-time Career Playbook accordion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career-playbook-accordion.yml'

permissions:
  contents: write

jobs:
  update-career-accordion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add collapsible Career Playbook rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')

          css_start = '/* Career Playbook accordion START */'
          css_end = '/* Career Playbook accordion END */'
          js_start = '<!-- Career Playbook accordion JS START -->'
          js_end = '<!-- Career Playbook accordion JS END -->'

          t = re.sub(
              re.escape(css_start) + r'.*?' + re.escape(css_end),
              '', t, flags=re.S
          )
          t = re.sub(
              re.escape(js_start) + r'.*?' + re.escape(js_end),
              '', t, flags=re.S
          )

          css = dedent(r'''
          /* Career Playbook accordion START */
          #experience .timeline article{
            cursor:pointer!important;
            position:relative!important;
            align-items:center!important;
            transition:padding .25s ease,background .25s ease,border-color .25s ease,box-shadow .25s ease!important;
          }
          #experience .timeline article:hover,
          #experience .timeline article:focus-visible{
            background:rgba(215,169,54,.045)!important;
          }
          #experience .timeline article:focus-visible{
            outline:1px solid rgba(215,169,54,.72)!important;
            outline-offset:-1px!important;
          }
          #experience .timeline article[aria-expanded="true"]{
            background:linear-gradient(90deg,rgba(215,169,54,.065),rgba(255,255,255,.018))!important;
            box-shadow:inset 2px 0 0 rgba(215,169,54,.78)!important;
          }
          #experience .timeline-role{
            display:block!important;
            opacity:1!important;
            visibility:visible!important;
            max-height:none!important;
          }
          #experience .timeline-body{
            display:block!important;
            max-height:0!important;
            margin-top:0!important;
            overflow:hidden!important;
            opacity:0!important;
            visibility:hidden!important;
            transform:translateY(-5px)!important;
            transition:max-height .32s ease,opacity .24s ease,margin-top .32s ease,transform .32s ease,visibility 0s linear .32s!important;
            pointer-events:none!important;
          }
          #experience .timeline article[aria-expanded="true"] .timeline-body{
            max-height:360px!important;
            margin-top:10px!important;
            opacity:1!important;
            visibility:visible!important;
            transform:translateY(0)!important;
            transition:max-height .38s ease,opacity .28s ease,margin-top .38s ease,transform .38s ease,visibility 0s!important;
            pointer-events:auto!important;
          }
          #experience .timeline-arrow{
            display:inline-flex!important;
            align-items:center!important;
            justify-content:center!important;
            transform:rotate(45deg)!important;
            transform-origin:center!important;
            transition:transform .28s ease,color .28s ease!important;
          }
          #experience .timeline article[aria-expanded="true"] .timeline-arrow{
            color:var(--gold-pale)!important;
            transform:rotate(135deg)!important;
          }
          @media(max-width:760px){
            #experience .timeline article{
              cursor:pointer!important;
            }
            #experience .timeline article[aria-expanded="true"] .timeline-body{
              max-height:460px!important;
            }
          }
          /* Career Playbook accordion END */
          ''')
          t = t.replace('</style>', css + '\n</style>', 1)

          js = dedent(r'''
          <!-- Career Playbook accordion JS START -->
          <script>
          (function(){
            function setCareerRowState(row, open){
              var body = row.querySelector('.timeline-body');
              row.setAttribute('aria-expanded', open ? 'true' : 'false');
              row.classList.toggle('career-expanded', open);
              if(body) body.setAttribute('aria-hidden', open ? 'false' : 'true');
            }

            function enhanceCareerRows(){
              var rows = document.querySelectorAll('#experience .timeline article');
              rows.forEach(function(row, index){
                var body = row.querySelector('.timeline-body');
                if(body && !body.id) body.id = 'career-playbook-detail-' + (index + 1);
                row.setAttribute('role','button');
                row.setAttribute('tabindex','0');
                if(body) row.setAttribute('aria-controls', body.id);

                if(!row.hasAttribute('aria-expanded')) setCareerRowState(row, false);
                else if(body) body.setAttribute('aria-hidden', row.getAttribute('aria-expanded') === 'true' ? 'false' : 'true');

                if(row.dataset.careerAccordionReady === 'true') return;
                row.dataset.careerAccordionReady = 'true';

                function toggle(){
                  setCareerRowState(row, row.getAttribute('aria-expanded') !== 'true');
                }

                row.addEventListener('click', function(event){
                  if(event.target.closest('a,button')) return;
                  toggle();
                });

                row.addEventListener('keydown', function(event){
                  if(event.key === 'Enter' || event.key === ' '){
                    event.preventDefault();
                    toggle();
                  }
                });
              });
            }

            function startCareerAccordion(){
              enhanceCareerRows();
              var experience = document.getElementById('experience');
              if(!experience) return;
              var observer = new MutationObserver(function(){ enhanceCareerRows(); });
              observer.observe(experience, {childList:true, subtree:true});
            }

            if(document.readyState === 'loading'){
              document.addEventListener('DOMContentLoaded', startCareerAccordion, {once:true});
            } else {
              startCareerAccordion();
            }
          })();
          </script>
          <!-- Career Playbook accordion JS END -->
          ''')
          t = t.replace('</body>', js + '\n</body>', 1)
          p.write_text(t, encoding='utf-8')
          PY
      - name: Commit website update and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/career-playbook-accordion.yml
          git add index.html
          git commit -m "Make Career Playbook rows expandable"
          git push
