name: Fix exact Case Study colon
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-case-study-colon.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use requested full-width colon
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old='"Case Study Apple":"Case Study: Apple"'
          new='"Case Study Apple":"Case Study：Apple"'
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one English Case Study override, found {count}')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-case-study-colon.yml
          git add index.html
          git commit -m 'Use requested Case Study：Apple title'
          git push
