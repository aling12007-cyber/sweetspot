name: Company intro content update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-intro-update.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage and add company introduction
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # 1) Remove the two homepage description lines while preserving their existing layout nodes.
          text, n1 = re.subn(
              r'\(0,f\.jsx\)\("p",\{className:"hero-lede",children:z\(l,\{.*?\}\)\}\)',
              '(0,f.jsx)("p",{className:"hero-lede",children:""})',
              text,
              count=1,
          )
          text, n2 = re.subn(
              r'\(0,f\.jsx\)\("p",\{className:"hero-note",children:z\(l,\{.*?\}\)\}\)',
              '(0,f.jsx)("p",{className:"hero-note",children:""})',
              text,
              count=1,
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Hero copy replacement failed: lede={n1}, note={n2}')

          # 2) Change the hero button to enter the company introduction section.
          text, n3 = re.subn(
              r'href:"#founder",children:\[z\(l,\{en:"Introducing the Founder",ja:".*?",zh:".*?"\}\)',
              'href:"#company",children:[z(l,{en:"Company Introduction",ja:"会社紹介",zh:"公司介紹"})',
              text,
              count=1,
          )
          if n3 != 1:
              raise SystemExit(f'Hero button replacement failed: {n3}')

          # 3) Remove the colon after Points of Difference.
          if 'en:"Points of Difference:"' not in text:
              raise SystemExit('Points of Difference label not found')
          text = text.replace('en:"Points of Difference:"', 'en:"Points of Difference"', 1)

          # 4) Add the company introduction section immediately below the homepage hero.
          if 'id:"company",className:"content-section section-shell"' in text:
              raise SystemExit('Company introduction section already exists')

          marker = '(0,f.jsxs)("section",{id:"points"'
          pos = text.find(marker)
          if pos == -1:
              raise SystemExit('Points section marker not found')

          company = '''(0,f.jsxs)("section",{id:"company",className:"content-section section-shell",children:[(0,f.jsx)("div",{className:"section-title compact",children:(0,f.jsx)("h2",{children:z(l,{en:"Company Introduction",ja:"会社紹介",zh:"公司介紹"})})}),(0,f.jsxs)("div",{className:"founder-copy",children:[(0,f.jsx)("p",{children:z(l,{en:"Created to facilitate innovation and growth opportunities within Japan’s sports & entertainment industry.",ja:"日本のスポーツ・エンターテインメント業界におけるイノベーションと成長機会の創出を促進するために設立されました。",zh:"致力於促進日本運動與娛樂產業的創新與成長機會。"})}),(0,f.jsx)("p",{children:z(l,{en:"Focused on raising the level of sports business connectivity and capability.",ja:"スポーツビジネスにおけるつながりと能力の水準向上に注力しています。",zh:"專注於提升運動商業的連結程度與專業能力。"})}),(0,f.jsx)("p",{children:z(l,{en:"Powered by a network of sports and entertainment professionals with a strong commitment and long-term connection to Japan.",ja:"日本との強いコミットメントと長期的なつながりを持つ、スポーツおよびエンターテインメントのプロフェッショナルネットワークによって支えられています。",zh:"由一群對日本具有高度投入並與日本保持長期連結的運動與娛樂專業人士所組成的網絡提供支持。"})})]})]})'''

          text = text[:pos] + company + ',' + text[pos:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/company-intro-update.yml
          git add index.html
          git commit -m "Update homepage copy and add company introduction"
          git push
