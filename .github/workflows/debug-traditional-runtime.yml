name: Debug Traditional Chinese runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-traditional-runtime.yml'
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCC
        run: python -m pip install --disable-pip-version-check -q opencc-python-reimplemented
      - name: Trace v4 localization patch behavior
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('m','.github/scripts/fix_traditional_chinese_v4.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m);m.patch_index()
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          hook=r'''<script>
          window.addEventListener('load',function(){setTimeout(function(){
            var out=[];function state(tag){var box=document.querySelector('.lang-switch');var bs=box?[].slice.call(box.children).filter(function(x){return x.tagName==='BUTTON'}):[];var sel=document.querySelector('.lang-dropdown-select');out.push(tag+' MODE='+(document.documentElement.getAttribute('data-ss-lang-mode')||'')+' LANG='+(document.documentElement.getAttribute('lang')||'')+' BUTTONS='+bs.map(function(b,i){return i+':'+(b.textContent||'').trim()+':'+b.className}).join(' || ')+' OPTIONS='+(sel?[].slice.call(sel.options).map(function(o,i){return i+':'+o.text}).join(' || '):'none')+' HERO='+((document.querySelector('.hero-copy h2')||{}).textContent||'')+' STAT='+((document.querySelector('.stats span')||{}).textContent||'')+' BODYTRAD='+String((document.body.innerText||'').indexOf('源自對體育運動的真摯熱愛與尊重')>=0)+' BODYSIMP='+String((document.body.innerText||'').indexOf('源自对体育运动的真挚热爱与尊重')>=0));}
            state('START');var sel=document.querySelector('.lang-dropdown-select');sel.value='3';sel.dispatchEvent(new Event('change',{bubbles:true}));setTimeout(function(){state('T50')},50);setTimeout(function(){state('T300')},300);setTimeout(function(){state('T1000');document.body.innerHTML='<pre id="audit-output"></pre>';document.getElementById('audit-output').textContent=out.join('\n');},1000);
          },900)});
          </script>'''
          Path('debug.html').write_text(s.replace('</body>',hook+'\n</body>',1),encoding='utf-8')
          PY
          python -m http.server 8000 >/tmp/http.log 2>&1 &
          P=$!;trap 'kill $P || true' EXIT
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom http://127.0.0.1:8000/debug.html >/tmp/dom.html
          python - <<'PY'
          import re,html
          s=open('/tmp/dom.html',encoding='utf-8',errors='replace').read();m=re.search(r'<pre id="audit-output">(.*?)</pre>',s,re.S);print(html.unescape(re.sub(r'<[^>]+>','',m.group(1) if m else 'NO OUTPUT')))
          PY
