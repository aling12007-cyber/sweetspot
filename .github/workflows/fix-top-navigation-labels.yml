name: Fix top navigation labels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-top-navigation-labels.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Shorten only homepage top navigation labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          start = '<!-- Top navigation short labels START -->'
          end = '<!-- Top navigation short labels END -->'
          if start in text:
              a = text.index(start)
              b = text.index(end, a) + len(end)
              text = text[:a] + text[b:]

          payload = ''
          script = base64.b64decode(payload).decode('ascii')
          if '</body>' not in text:
              raise SystemExit('Could not find </body>')
          text = text.replace('</body>', script + '\n</body>', 1)

          if text.count('id="top-navigation-short-labels"') != 1:
              raise SystemExit('Expected exactly one top navigation controller')
          p.write_text(text, encoding='utf-8')
          PY

          git diff -- index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-top-navigation-labels.yml
          git add index.html
          git commit -m 'Fix top navigation short labels'
          git push
