name: One-time shorten header navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shorten-header-nav.yml'

permissions:
  contents: write

jobs:
  patch-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shorten navigation labels only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(r'let e=\[\["company".*?\]\];return', re.S)
          replacement = '''let e=[["company",{en:"Company",ja:"会社",zh:"公司"}],["points",{en:"Difference",ja:"強み",zh:"優勢"}],["founder",{en:"Founder",ja:"創業者",zh:"創辦人"}],["network",{en:"Network",ja:"ネットワーク",zh:"資源網絡"}],["capabilities",{en:"Apple",ja:"Apple",zh:"Apple"}],["insights",{en:"Insights",ja:"洞察",zh:"洞察"}]];return'''

          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Navigation replacement count was {count}, expected 1')

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Shorten header navigation labels"
          git push