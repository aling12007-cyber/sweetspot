name: One-time Broad Influence detail labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/network-detail-list.yml'

permissions:
  contents: write

jobs:
  style-network-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert Broad Influence details to framed labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css_marker = '/* Broad Influence detail labels */'
          if css_marker not in text:
              css = r'''
/* Broad Influence detail labels */
#network .network-grid p.network-detail-list{
  display:flex!important;
  flex-wrap:wrap!important;
  align-items:flex-start!important;
  gap:8px 7px!important;
  max-width:62%!important;
  line-height:1!important;
}
#network .network-grid .network-detail-item{
  display:inline-flex;
  align-items:center;
  min-height:30px;
  padding:7px 10px 6px;
  border:1px solid rgba(215,169,54,.38);
  border-radius:3px;
  background:linear-gradient(135deg,rgba(215,169,54,.085),rgba(255,255,255,.018));
  color:#d7dde5;
  font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;
  font-size:12px;
  font-weight:700;
  line-height:1.15;
  letter-spacing:.045em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}
#network .network-grid .network-detail-item:first-child{
  border-color:rgba(226,181,62,.55);
  color:#f1e1a1;
  background:linear-gradient(135deg,rgba(215,169,54,.14),rgba(215,169,54,.035));
}
@media(max-width:760px){
  #network .network-grid p.network-detail-list{max-width:62%!important;gap:7px 6px!important}
  #network .network-grid .network-detail-item{min-height:28px;padding:6px 9px 5px;font-size:11.5px;letter-spacing:.035em}
}
'''
              text = text.replace('</style>', css + '\n</style>', 1)

          script_marker = 'Broad Influence detail label enhancer'
          if script_marker not in text:
              script = r'''
<script>
/* Broad Influence detail label enhancer */
(function(){
  function enhanceNetworkDetails(){
    document.querySelectorAll('#network .network-grid article p').forEach(function(p){
      if(p.querySelector('.network-detail-item')) return;
      var raw=(p.textContent||'').trim();
      if(!raw) return;
      var clean=raw.replace(/[。．.]\s*$/,'');
      var parts=clean.split(/\s*[,，、]\s*/).map(function(s){return s.trim();}).filter(Boolean);
      if(!parts.length) return;
      p.textContent='';
      p.classList.add('network-detail-list');
      parts.forEach(function(part){
        var span=document.createElement('span');
        span.className='network-detail-item';
        span.textContent=part;
        p.appendChild(span);
      });
    });
  }
  function scheduleEnhance(){
    requestAnimationFrame(function(){requestAnimationFrame(enhanceNetworkDetails);});
    setTimeout(enhanceNetworkDetails,120);
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',scheduleEnhance,{once:true});
  }else{
    scheduleEnhance();
  }
  document.addEventListener('click',function(e){
    if(e.target.closest('.lang-switch button')){
      setTimeout(scheduleEnhance,0);
      setTimeout(scheduleEnhance,80);
    }
  });
  var attempts=0;
  var timer=setInterval(function(){
    enhanceNetworkDetails();
    attempts++;
    if(attempts>12 || document.querySelector('#network .network-detail-item')) clearInterval(timer);
  },100);
})();
</script>
'''
              text = text.replace('</body>', script + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit website update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/network-detail-list.yml
          git add index.html
          git commit -m "Style Broad Influence details as framed labels"
          git push
