name: Apply Rights Holders and title fix

on:
  push:
    branches:
      - fix/rights-holders-overlap-title-20260903
    paths:
      - .github/workflows/apply-rights-title-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Apply exact patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old_title = '<title>Sweet Spot</title>'
          new_title = '<title>Sweet Spot | Japan Sports & Entertainment Strategy</title>'
          if html.count(old_title) != 1:
              raise SystemExit(f'Expected exactly one old title, found {html.count(old_title)}')
          if new_title in html:
              raise SystemExit('New title already exists unexpectedly')
          index.write_text(html.replace(old_title, new_title, 1), encoding='utf-8')

          css = Path('assets/case-study-split.css')
          css_text = css.read_text(encoding='utf-8')
          marker = '/* Rights Holders overlap safeguard */'
          if marker in css_text:
              raise SystemExit('Rights Holders safeguard already exists unexpectedly')

          addition = r'''/* Rights Holders overlap safeguard */
          @media(min-width:761px){
            #network .network-grid article:nth-child(2) p.network-subitem-list{
              max-width:50%!important;
            }
          }

          @media(max-width:760px){
            #network .network-grid article:nth-child(2) p.network-subitem-list{
              max-width:56%!important;
            }

            #network .network-grid article:nth-child(2)::before{
              right:0!important;
              width:40%!important;
            }
          }'''
          css.write_text(css_text.rstrip() + '\n\n' + addition + '\n', encoding='utf-8')

          patched = index.read_text(encoding='utf-8')
          if patched.count(new_title) != 1 or old_title in patched:
              raise SystemExit('Title replacement verification failed')
          patched_css = css.read_text(encoding='utf-8')
          if patched_css.count(marker) != 1:
              raise SystemExit('Rights Holders safeguard verification failed')
          PY
          git diff --check
          git diff -- index.html assets/case-study-split.css
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/case-study-split.css
          git commit -m "fix: separate Rights Holders labels and update title"
          git push
