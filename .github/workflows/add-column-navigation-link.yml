name: Add column navigation link
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Column after Solution
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),p='index.html'; let s=fs.readFileSync(p,'utf8');
          const oldEnd=String.raw`["offers",{en:"Solution",ja:"\u30BD\u30EA\u30E5\u30FC\u30B7\u30E7\u30F3",zh:"\u89E3\u51B3\u65B9\u6848"}]]`;
          const newEnd=String.raw`["offers",{en:"Solution",ja:"\u30BD\u30EA\u30E5\u30FC\u30B7\u30E7\u30F3",zh:"\u89E3\u51B3\u65B9\u6848"}],["insights",{en:"Column",ja:"\u30B3\u30E9\u30E0",zh:"\u4E13\u680F"}]]`;
          if(!s.includes(newEnd)){
            if(!s.includes(oldEnd)) throw new Error('Navigation list endpoint not found');
            s=s.replace(oldEnd,newEnd);
          }
          fs.writeFileSync(p,s);
          NODE
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-column-navigation-link.yml
          git add index.html
          git commit -m "Add Column to main navigation"
          git push
