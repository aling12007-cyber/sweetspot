name: Shorten LinkedIn label
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change LinkedIn button text
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),p='index.html'; let s=fs.readFileSync(p,'utf8');
          const oldLabel='z(l,{en:"LinkedIn Profile",ja:"LinkedIn \\u30D7\\u30ED\\u30D5\\u30A3\\u30FC\\u30EB",zh:"LinkedIn \\u4E2A\\u4EBA\\u6863\\u6848"})';
          const newLabel='z(l,{en:"LinkedIn",ja:"LinkedIn",zh:"LinkedIn"})';
          if(!s.includes(newLabel)){
            if(!s.includes(oldLabel)) throw new Error('LinkedIn label not found');
            s=s.replace(oldLabel,newLabel);
          }
          fs.writeFileSync(p,s);
          NODE
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/shorten-linkedin-label.yml
          git add index.html
          git commit -m "Shorten LinkedIn button label"
          git push
