name: Temporary simplify Contact
on:
  push:
    branches:
      - fix/simplify-contact-20260908
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/simplify-contact-20260908
      - name: Apply Contact patch
        run: python .github/scripts/temp_simplify_contact.py
      - name: Validate JavaScript
        run: node --check assets/site-enhancements.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/site-enhancements.js assets/case-study-split.css index.html
          git commit -m "fix: simplify Contact conversion copy"
          git push
