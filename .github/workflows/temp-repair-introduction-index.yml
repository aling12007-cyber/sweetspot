name: Temporary repair introduction index
on:
  push:
    branches:
      - feat/introduction-big-headings-20260907
    paths:
      - '.github/workflows/temp-repair-introduction-index.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/introduction-big-headings-20260907
          fetch-depth: 0
      - name: Restore index and apply safe cache versions
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_css='<link rel="stylesheet" href="assets/case-study-split.css?v=story-subheads-20260907">'
          new_css='<link rel="stylesheet" href="assets/case-study-split.css?v=intro-big-headings-20260907">'
          old_js='<script src="assets/site-enhancements.js?v=i18n-audit-20260907" defer></script>'
          new_js='<script src="assets/site-enhancements.js?v=intro-big-headings-20260907" defer></script>'
          assert s.count(old_css)==1, s.count(old_css)
          assert s.count(old_js)==1, s.count(old_js)
          s=s.replace(old_css,new_css,1).replace(old_js,new_js,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<!-- Career Playbook accordion JS START -->' in s
          assert "var body = row.querySelector('.timeline-body');" in s
          assert 'assets/case-study-split.css?v=intro-big-headings-20260907' in s
          assert 'assets/site-enhancements.js?v=intro-big-headings-20260907' in s
          print('Index repair checks passed')
          PY
      - name: Commit repaired index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: preserve index while bumping introduction assets'
          git push origin HEAD:feat/introduction-big-headings-20260907
