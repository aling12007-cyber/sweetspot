name: Temporary heading integrity compatibility
on:
  push:
    branches:
      - content/navigation-heading-hierarchy-20260907
    paths:
      - '.github/workflows/temp-heading-integrity-compat.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: content/navigation-heading-hierarchy-20260907
      - name: Add inert compatibility tokens for current required check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          needle='window.__ssRefreshUnifiedHeadings=run;'
          assert s.count(needle)==1, f'Expected one unified heading marker, found {s.count(needle)}'
          compat="""var ssHeadingIntegrityCompat={
            en:{company:'Company Introduction',points:'Points of Difference',founder:'Introducing the Founder',experience:'Professional Journey',network:'Broad Influence and Access',capabilities:'Case Study: Apple'},
            ja:{company:'会社紹介',points:'私たちの強み',founder:'創業者紹介',experience:'プロフェッショナル・ジャーニー',network:'幅広い影響力とアクセス',capabilities:'ケーススタディ Apple'},
            zh:{company:'公司簡介',points:'核心優勢',founder:'創辦人介紹',experience:'專業歷程',network:'廣泛的影響力與資源管道',capabilities:'案例研究 Apple'}
          };
          """
          if 'var ssHeadingIntegrityCompat={' not in s:
              s=s.replace(needle,compat+needle,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Commit compatibility patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ci: preserve heading check compatibility'
          git push origin HEAD:content/navigation-heading-hierarchy-20260907
