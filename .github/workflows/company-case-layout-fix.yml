name: Align company and case study formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch website
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          original = s

          # Company Introduction: use the same centered section-heading layout as Points of Difference.
          replacements = {
              '#points .section-title,#experience .section-title,#network .section-title,#capabilities .section-title,#offers .section-title':
              '#company .section-title,#points .section-title,#experience .section-title,#network .section-title,#capabilities .section-title,#offers .section-title',
              '#points .section-title>div,#experience .section-title>div,#network .section-title>div,#capabilities .section-title>div,#offers .section-title>div':
              '#company .section-title>div,#points .section-title>div,#experience .section-title>div,#network .section-title>div,#capabilities .section-title>div,#offers .section-title>div',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Case Study title: remove punctuation in all languages.
          s = s.replace('Case Study: Apple', 'Case Study Apple')
          s = s.replace('ケーススタディ：Apple', 'ケーススタディ Apple')
          s = s.replace('案例研究：Apple', '案例研究 Apple')

          # Align all numbered Case Study cards to the top of their cells.
          old_align = 'align-content:center;align-items:start'
          if old_align not in s:
              raise SystemExit('Expected capability card alignment rule not found')
          s = s.replace(old_align, 'align-content:start;align-items:start', 1)

          if s == original:
              raise SystemExit('No changes made')
          path.write_text(s, encoding='utf-8')
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/company-case-layout-fix.yml
          git add index.html
          git commit -m "Match company and case study formatting"
          git push origin main
