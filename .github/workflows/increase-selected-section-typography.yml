name: Increase selected section typography
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase typography by twenty percent
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),p='index.html'; let s=fs.readFileSync(p,'utf8');
          const needle='.work-step p{margin:0!important;color:#909ba9!important;font-size:13px!important;line-height:1.55!important}';
          const rules=needle+'\n/* 20% typography increase: career, capabilities and offering */\n.timeline time{font-size:12px}\n.timeline h3{font-size:22.8px}\n.timeline p{font-size:15.6px}\n.capability-grid h3{font-size:20.4px}\n.capability-grid p{font-size:14.4px}\n.capability-grid article>span{font-size:12px}\n.solutions-grid h3{font-size:26.4px}\n.solutions-grid li{font-size:16.8px}\n.work-step>b{font-size:12px}\n.work-step h4{font-size:16.8px}\n.work-step p{font-size:15.6px!important}';
          if(!s.includes('/* 20% typography increase: career, capabilities and offering */')){
            if(!s.includes(needle)) throw new Error('Typography insertion point not found');
            s=s.replace(needle,rules);
          }
          fs.writeFileSync(p,s);
          NODE
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/increase-selected-section-typography.yml
          git add index.html
          git commit -m "Increase selected section typography by 20 percent"
          git push
