name: One-time Broad Influence subitem cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/network-subitems-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup-network-subitems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate Broad Influence subitem styling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Remove the older duplicate label CSS block.
          old_css_marker = '/* Broad Influence detail labels */'
          framed_css_marker = '/* Broad Influence framed subitems */'
          if old_css_marker in text and framed_css_marker in text:
              start = text.index(old_css_marker)
              end = text.index(framed_css_marker, start)
              text = text[:start] + text[end:]

          # Remove the older duplicate JS enhancer.
          old_js_marker = '<script>\n/* Broad Influence detail label enhancer */'
          if old_js_marker in text:
              start = text.index(old_js_marker)
              end = text.index('</script>', start) + len('</script>')
              text = text[:start] + text[end:]

          # Upgrade the active framed-subitem typography to a compact editorial tag style.
          text = text.replace(
              'font-family:"Arial Narrow","Avenir Next Condensed","DIN Condensed",Arial,sans-serif;\n  font-size:12px;\n  font-weight:700;\n  line-height:1.18;\n  letter-spacing:.025em;',
              'font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;\n  font-size:11.5px;\n  font-weight:700;\n  line-height:1.2;\n  letter-spacing:.035em;',
              1
          )
          text = text.replace(
              '#network .network-subitem{min-height:27px;padding:5px 8px 4px;font-size:11.5px;line-height:1.2}',
              '#network .network-subitem{min-height:27px;padding:5px 8px 4px;font-size:11px;line-height:1.22}',
              1
          )

          # Split each description into discrete framed items. Preserve phrases such as
          # "Formula One" and "Tech & Wearables" while separating Active / Retired.
          old = "var items=raw.split(/[,，、]/).map(capFirst).filter(Boolean);"
          new = """var article=p.closest('article');
      var cards=article&&article.parentElement?Array.prototype.slice.call(article.parentElement.children):[];
      var cardIndex=cards.indexOf(article);
      var parts=raw.replace(/[.。]+$/,'').split(/[,，、]/).map(function(s){return s.trim();}).filter(Boolean);
      if(cardIndex===3 && parts.length===1){
        parts=raw.replace(/[.。]+$/,'').split(/\\s+and\\s+|および|及び|與|与|及/).map(function(s){return s.trim();}).filter(Boolean);
      }
      var items=parts.map(capFirst).filter(Boolean);"""
          if old not in text:
              raise SystemExit('active framed subitem splitter not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit website update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/network-subitems-cleanup.yml
          git add index.html
          git commit -m "Refine Broad Influence subitem lists"
          git push
