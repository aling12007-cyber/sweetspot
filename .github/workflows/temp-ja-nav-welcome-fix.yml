name: Temporary Japanese nav and welcome fix
on:
  push:
    branches:
      - fix/ja-nav-cache-welcome-effect-20260908
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/ja-nav-cache-welcome-effect-20260908
      - name: Apply Japanese nav and welcome update
        run: python .github/scripts/temp_ja_nav_welcome_fix.py
      - name: Check enhancement JavaScript
        run: node --check assets/site-enhancements.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html assets/site-enhancements.js assets/case-study-split.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: refresh localized nav and add welcome accent"
          git push
