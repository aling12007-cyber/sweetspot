name: One-time Company Introduction redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-intro-vertical-highlight.yml'

permissions:
  contents: write

jobs:
  redesign-company-intro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Redesign Company Introduction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old = base64.b64decode("").decode("utf-8")
          new = base64.b64decode("").decode("utf-8")
          css = base64.b64decode("").decode("utf-8")

          if old not in text:
              raise SystemExit("Expected Company Introduction grid not found")
          text = text.replace(old, new, 1)

          note = "/* Company Introduction vertical editorial layout */"
          if note not in text:
              if "</style>" not in text:
                  raise SystemExit("Style closing tag not found")
              text = text.replace("</style>", css + "\n</style>", 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit website update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/company-intro-vertical-highlight.yml
          git add index.html
          git commit -m "Redesign Company Introduction vertical highlight"
          git push
