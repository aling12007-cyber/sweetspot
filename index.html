<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Connecting Japan with the global sports business through strategy, partnerships and market development.">
  <meta name="theme-color" content="#07090d">
  <title>Sweet Spot | Sports Business Strategy</title>
  <style>:root{--ink:#07090d;--panel:#0e131b;--paper:#f7f5ef;--muted:#aeb7c3;--gold:#d7a936;--gold-pale:#fff2a7;--blue:#0a66c2;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:82px}body{margin:0;background:var(--ink);color:var(--paper);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}a{color:inherit;text-decoration:none}button{font:inherit}.section-shell{width:min(1180px,calc(100% - 48px));margin-inline:auto}

.site-header{position:fixed;inset:0 0 auto;height:76px;padding:0 max(24px,calc((100vw - 1320px)/2));display:flex;align-items:center;justify-content:space-between;z-index:50;border-bottom:1px solid transparent;transition:.3s ease}.site-header.is-scrolled{height:66px;background:rgba(7,9,13,.88);backdrop-filter:blur(18px);border-color:var(--line)}.brand{display:inline-flex;gap:10px;align-items:center;font-weight:900;font-size:14px;letter-spacing:.08em;white-space:nowrap}.brand b{color:var(--gold)}.brand-ball{display:grid;place-items:center;width:31px;height:31px;border:1px solid rgba(215,169,54,.6);border-radius:50%;font-size:12px;color:var(--gold-pale);box-shadow:0 0 20px rgba(215,169,54,.14)}.site-header nav{display:flex;align-items:center;gap:27px}.site-header nav a{color:#c6ccd4;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;transition:color .2s}.site-header nav a:hover{color:var(--gold-pale)}.header-actions{display:flex;align-items:center;gap:14px}.lang-switch{display:flex;border:1px solid var(--line);border-radius:20px;padding:3px;background:rgba(255,255,255,.03)}.lang-switch button{border:0;color:#87919e;background:transparent;font-size:10px;font-weight:800;width:30px;height:24px;border-radius:14px;cursor:pointer}.lang-switch button.active{color:#0a0c10;background:var(--gold)}.contact-mini{border:1px solid rgba(215,169,54,.55);padding:10px 15px;color:var(--gold-pale);font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}

.hero{min-height:820px;display:grid;grid-template-columns:1.04fr .96fr;align-items:center;gap:68px;padding-top:80px;position:relative}.hero:before{content:"";position:absolute;width:70vw;height:70vw;top:-45vw;left:-20vw;background:radial-gradient(circle,rgba(10,102,194,.11),transparent 65%);pointer-events:none}.hero-copy{position:relative;z-index:2;padding-top:12px}.eyebrow{margin:0 0 18px;display:flex;align-items:center;gap:10px;color:#c8b56e;font-size:11px;line-height:1.5;font-weight:900;letter-spacing:.17em}.eyebrow>span{display:inline-block;width:28px;height:1px;background:var(--gold)}.hero h1{margin:0;font-size:clamp(68px,8vw,118px);line-height:.82;letter-spacing:-.075em;font-weight:950}.hero h1>span{display:block;color:#fff}.hero h1 strong{display:inline-block;font-weight:950;color:transparent;background:linear-gradient(100deg,#9a6914 0%,#f7d46c 22%,#fff8c5 42%,#bd7e10 58%,#ffe991 78%,#9d6812 100%);background-size:250% 100%;background-clip:text;-webkit-background-clip:text;animation:gold-flow 4s linear infinite;filter:drop-shadow(0 0 14px rgba(255,214,87,.22))}@keyframes gold-flow{to{background-position:250% center}}.hero h2{max-width:690px;margin:30px 0 17px;font-size:clamp(27px,3vw,45px);line-height:1.08;letter-spacing:-.04em}.hero-lede{max-width:650px;margin:0;color:#c2c9d3;font-size:16px;line-height:1.72}.hero-cta{display:flex;align-items:center;gap:30px;margin-top:30px}.button{display:inline-flex;align-items:center;justify-content:center;gap:13px;min-height:52px;padding:0 22px;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;transition:transform .2s,box-shadow .2s,background .2s}.button:hover{transform:translateY(-3px)}.gold-button{color:#0b0d10;background:linear-gradient(120deg,#b77a12,#f3d777 48%,#c89526);box-shadow:0 12px 32px rgba(215,169,54,.18)}.gold-button>span:last-child{font-size:17px}.text-link{font-size:12px;font-weight:800;color:#d8dee7;border-bottom:1px solid #707987;padding:12px 0 8px}.text-link span{color:var(--gold);margin-left:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);max-width:650px;margin-top:33px;border-top:1px solid var(--line)}.stats div{padding:19px 18px 0 0;border-right:1px solid var(--line)}.stats div+div{padding-left:20px}.stats div:last-child{border-right:0}.stats b{display:block;color:#fff;font-size:22px;letter-spacing:-.04em}.stats span{display:block;color:#8993a0;font-size:9px;letter-spacing:.13em;text-transform:uppercase;margin-top:4px}
.hero-visual{position:relative;height:620px;align-self:center;transform:translateY(-12px)}.photo-card{position:absolute;inset:24px 20px 58px 0;background:linear-gradient(180deg,rgba(8,10,14,.02),rgba(7,9,13,.5)),url("https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?auto=format&fit=crop&w=1400&q=88") center 35%/cover;border:1px solid rgba(255,255,255,.2);box-shadow:0 40px 100px rgba(0,0,0,.45);clip-path:polygon(0 0,92% 0,100% 8%,100% 100%,0 100%)}.photo-card:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 65% 18%,rgba(255,220,113,.18),transparent 34%)}.photo-label{position:absolute;left:-14px;top:34px;z-index:2;background:var(--gold);color:#111;padding:9px 13px;font-size:9px;font-weight:900;letter-spacing:.15em}.strategy-ribbon{position:absolute;left:-23px;right:0;bottom:21px;z-index:4;color:#111;background:linear-gradient(90deg,#ba801c,#f0d272,#c48a1c);padding:16px 20px;font-size:11px;font-weight:950;letter-spacing:.16em;transform:rotate(-2deg);box-shadow:0 12px 30px rgba(0,0,0,.35)}.strategy-ribbon i{padding-inline:8px;font-style:normal}.score-card{position:absolute;right:-24px;bottom:85px;z-index:5;display:flex;align-items:center;gap:11px;color:#fff;background:rgba(13,18,25,.9);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.17);padding:13px 16px;font-size:9px;font-weight:900;letter-spacing:.12em}.score-card b{color:var(--gold);font-size:17px}.hero-orbit{position:absolute;border:1px solid rgba(255,255,255,.08);border-radius:50%;pointer-events:none;animation:orbit 16s linear infinite}.orbit-one{width:260px;height:260px;right:-120px;top:170px}.orbit-two{width:100px;height:100px;right:-38px;top:250px;border-color:rgba(215,169,54,.25);animation-direction:reverse}@keyframes orbit{to{transform:rotate(360deg)}}

.content-section{padding-block:88px;border-top:1px solid var(--line);position:relative}.section-title{display:grid;grid-template-columns:.75fr 1.55fr;align-items:end;gap:40px;margin-bottom:42px}.section-title.compact{grid-template-columns:1fr;gap:18px;margin-bottom:26px}.section-title>div{display:flex;align-items:center;gap:13px}.section-title>div>span{color:var(--gold);font:900 11px/1 monospace}.section-title p{margin:0;color:#9da7b4;font-size:10px;font-weight:900;letter-spacing:.15em}.section-title h2{margin:0;color:#fff;font-size:clamp(36px,5vw,64px);line-height:.98;letter-spacing:-.05em}.section-title.compact h2{font-size:clamp(34px,4vw,54px)}
.difference-grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line)}.feature-card{min-height:310px;padding:28px;background:linear-gradient(145deg,rgba(255,255,255,.035),transparent);border-right:1px solid var(--line);position:relative;overflow:hidden;transition:.3s ease}.feature-card:last-child{border-right:0}.feature-card:before{content:"";position:absolute;width:130px;height:130px;right:-60px;bottom:-60px;border:1px solid rgba(215,169,54,.2);border-radius:50%;transition:.4s}.feature-card:hover{background:rgba(215,169,54,.055);transform:translateY(-5px)}.feature-card:hover:before{transform:scale(1.3)}.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:56px}.card-top span{color:#727d8b;font:900 10px monospace}.card-top i{display:grid;place-items:center;width:47px;height:47px;color:var(--gold-pale);border:1px solid rgba(215,169,54,.35);border-radius:50%;font-style:normal;font-size:20px}.feature-card h3{margin:0 0 14px;max-width:290px;font-size:22px;line-height:1.2}.feature-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}.card-line{width:35px;height:2px;margin-top:24px;background:var(--gold)}

.founder-section{background:#0b1017}.founder-grid{display:grid;grid-template-columns:.85fr 1.15fr;align-items:center;gap:80px}.founder-visual{min-height:500px;position:relative;background:linear-gradient(160deg,#1b2634,#080b10);border:1px solid var(--line);overflow:hidden}.founder-visual:before,.founder-visual:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(215,169,54,.18)}.founder-visual:before{width:420px;height:420px;left:-130px;top:-100px}.founder-visual:after{width:250px;height:250px;right:-80px;bottom:-80px}.portrait-monogram{position:absolute;inset:42px 42px 110px;display:grid;place-items:center;background:radial-gradient(circle at 55% 30%,#2b425b,#111924 55%,#090d13);clip-path:polygon(0 0,86% 0,100% 14%,100% 100%,0 100%)}.portrait-monogram span{font-size:110px;font-weight:950;letter-spacing:-.12em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.23)}.founder-caption{position:absolute;left:35px;bottom:28px;display:grid;gap:3px}.founder-caption span{color:var(--gold);font-size:9px;font-weight:900;letter-spacing:.2em}.founder-caption b{font-size:22px}.founder-caption small{color:#818c99}.founder-copy>p{color:#c1c9d4;font-size:16px;line-height:1.72}.language-note{display:inline-flex;gap:13px;align-items:center;margin-top:16px;padding:13px 17px;background:rgba(215,169,54,.08);border-left:2px solid var(--gold)}.language-note>span{color:var(--gold-pale);font-size:22px;font-weight:900}.language-note div{display:grid}.language-note b{font-size:12px}.language-note small{color:#929eac;margin-top:2px}

.experience-section:after{content:"PLAYBOOK";position:absolute;right:-20px;top:88px;color:rgba(255,255,255,.018);font-size:160px;font-weight:950;letter-spacing:-.08em;pointer-events:none}.timeline{border-top:1px solid var(--line);position:relative;z-index:2}.timeline article{display:grid;grid-template-columns:64px 150px 1fr 30px;align-items:center;gap:20px;min-height:92px;border-bottom:1px solid var(--line);transition:padding .25s,background .25s}.timeline article:hover{padding-inline:12px;background:rgba(255,255,255,.025)}.timeline-dot{display:grid;place-items:center;width:34px;height:34px;color:#1a1e24;background:#d8aa36;border-radius:50%;font:900 10px monospace}.timeline time{color:#9aa5b2;font:800 10px monospace;letter-spacing:.08em}.timeline h3{margin:0 0 5px;font-size:19px}.timeline p{margin:0;color:#8e99a7;font-size:13px}.timeline-arrow{color:var(--gold);font-size:17px}
.network-section{background:radial-gradient(circle at 85% 30%,rgba(10,102,194,.13),transparent 32%),#0c121a}.network-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.network-grid article{min-height:270px;padding:30px;background:rgba(5,8,12,.6);border:1px solid var(--line);position:relative;transition:.3s}.network-grid article:hover{border-color:rgba(215,169,54,.5);transform:translateY(-4px)}.network-icon{display:grid;place-items:center;width:62px;height:62px;margin-bottom:38px;border:1px solid rgba(215,169,54,.4);border-radius:50%;color:var(--gold-pale);font-size:11px;font-weight:950}.network-grid article>span{position:absolute;right:26px;top:26px;color:#667180;font:800 9px monospace}.network-grid h3{max-width:440px;margin:0 0 11px;font-size:23px}.network-grid p{color:#9da8b6;margin:0}.brand-marquee{margin-top:38px;overflow:hidden;border-block:1px solid var(--line);padding:17px 0;color:#7f8a97;white-space:nowrap;font-size:10px;font-weight:900;letter-spacing:.16em}.brand-marquee div{min-width:max-content;animation:ticker 22s linear infinite}.brand-marquee i{color:var(--gold);padding-inline:22px;font-style:normal}@keyframes ticker{to{transform:translateX(-30%)}}

.capability-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}.capability-grid article{min-height:200px;padding:25px;border-right:1px solid var(--line);position:relative}.capability-grid article:last-child{border-right:0}.capability-grid i{display:grid;place-items:center;width:48px;height:48px;margin-bottom:42px;color:var(--gold-pale);background:rgba(215,169,54,.09);border-radius:50%;font-size:21px;font-style:normal}.capability-grid h3{margin:0;font-size:17px}.capability-grid article>span{position:absolute;top:25px;right:23px;color:#505966;font:900 10px monospace}
.offers-section{background:#0b1017}.solutions-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.solutions-grid article{min-height:300px;padding:28px;border:1px solid var(--line);background:linear-gradient(145deg,#121a25,#0a0e14);position:relative;overflow:hidden;transition:.3s}.solutions-grid article:hover{transform:translateY(-5px);border-color:rgba(10,102,194,.6)}.solutions-grid article>span{position:absolute;right:24px;top:22px;color:#596474;font:900 10px monospace}.solution-icon{display:grid;place-items:center;width:68px;height:68px;margin-bottom:60px;border:1px solid rgba(10,102,194,.5);border-radius:50%;color:#66b2ff;font-size:28px;box-shadow:0 0 35px rgba(10,102,194,.12)}.solutions-grid h3{font-size:22px;margin:0 0 13px}.solutions-grid p{margin:0;color:#9ba6b4;font-size:14px;line-height:1.65}
.insights-section{padding-block:70px}.insight-card{display:grid;grid-template-columns:100px 1fr 70px;gap:26px;align-items:center;padding:42px;border:1px solid var(--line);background:linear-gradient(115deg,rgba(215,169,54,.09),rgba(255,255,255,.02))}.insight-mark{color:var(--gold);font:900 100px/1 Georgia,serif;height:70px}.insight-card h2{max-width:750px;margin:0 0 13px;font-size:clamp(25px,3.2vw,42px);line-height:1.08;letter-spacing:-.04em}.insight-card>div>p:last-child{color:#9da7b4;margin:0}.insight-card>a{display:grid;place-items:center;width:62px;height:62px;color:#121417;background:var(--gold);border-radius:50%;font-size:23px;transition:transform .25s}.insight-card>a:hover{transform:rotate(45deg)}

.contact-section{min-height:520px;display:grid;place-items:center;position:relative;overflow:hidden;border-top:1px solid var(--line);background:linear-gradient(140deg,#080a0e,#101a26)}.contact-glow{position:absolute;width:700px;height:700px;right:-200px;top:-260px;border:1px solid rgba(215,169,54,.16);border-radius:50%;box-shadow:0 0 100px rgba(10,102,194,.11) inset;animation:pulse 5s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.06);opacity:.6}}.contact-inner{position:relative;text-align:center;padding-block:80px}.contact-inner .eyebrow{justify-content:center}.contact-inner h2{margin:0 auto 18px;font-size:clamp(47px,7vw,88px);line-height:.95;letter-spacing:-.065em}.contact-inner>p:not(.eyebrow){color:#b1bbc7;font-size:17px}.contact-buttons{display:flex;justify-content:center;gap:14px;margin-top:32px}.mail-icon{font-size:16px!important}.linkedin-button{color:#fff;background:var(--blue);box-shadow:0 12px 34px rgba(10,102,194,.28)}.linkedin-button:hover{background:#08549e;box-shadow:0 16px 40px rgba(10,102,194,.36)}.linkedin-logo{display:grid;place-items:center;width:23px;height:23px;color:var(--blue);background:#fff;border-radius:3px;font:900 15px/1 Arial;letter-spacing:-.05em;text-transform:none}
footer{min-height:92px;padding:20px max(24px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:25px;border-top:1px solid var(--line);background:#05070a}footer p,footer>a:last-child{color:#727d89;font-size:9px;font-weight:800;letter-spacing:.12em}

@media(max-width:1050px){.site-header nav{display:none}.hero{grid-template-columns:1fr .86fr;gap:38px}.hero h1{font-size:clamp(62px,9vw,90px)}.photo-card{inset:55px 0 70px}.section-title{grid-template-columns:.58fr 1.42fr}}
@media(max-width:760px){.section-shell{width:min(100% - 30px,620px)}.site-header{height:64px;padding-inline:15px;background:rgba(7,9,13,.9);backdrop-filter:blur(14px)}.site-header .contact-mini{display:none}.brand{font-size:12px}.hero{min-height:auto;grid-template-columns:1fr;gap:8px;padding-top:105px;padding-bottom:46px}.hero-copy{padding-top:0}.hero h1{font-size:clamp(63px,21vw,95px)}.hero h2{margin-top:22px;font-size:31px}.hero-lede{font-size:15px}.hero-cta{flex-wrap:wrap;margin-top:25px}.stats{margin-top:27px}.stats b{font-size:17px}.stats div,.stats div+div{padding-inline:8px}.hero-visual{height:410px;margin-top:8px;transform:none}.photo-card{inset:10px 8px 50px;background-position:center}.strategy-ribbon{left:-5px;right:2px;bottom:14px;font-size:9px}.score-card{right:-5px;bottom:67px}.content-section{padding-block:62px}.section-title,.section-title.compact{grid-template-columns:1fr;gap:15px;margin-bottom:30px}.section-title h2{font-size:42px}.difference-grid,.network-grid,.capability-grid,.solutions-grid{grid-template-columns:1fr}.feature-card,.capability-grid article{border-right:0;border-bottom:1px solid var(--line)}.feature-card:last-child,.capability-grid article:last-child{border-bottom:0}.feature-card{min-height:260px}.founder-grid{grid-template-columns:1fr;gap:42px}.founder-visual{min-height:430px}.timeline article{grid-template-columns:48px 1fr 23px;gap:13px;padding-block:18px}.timeline time{grid-column:2;grid-row:1}.timeline article>div{grid-column:2}.timeline-dot{grid-row:1/3}.timeline-arrow{grid-column:3;grid-row:1/3}.capability-grid article{min-height:170px}.insight-card{grid-template-columns:1fr;padding:28px}.insight-mark{display:none}.insight-card>a{width:52px;height:52px}.contact-inner h2{font-size:52px}.contact-buttons{flex-direction:column;align-items:stretch}footer{flex-direction:column;justify-content:center;text-align:center;padding-block:30px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* Full-content layout refinements */
.hero-note{max-width:650px;margin:12px 0 0;color:#8f9aa8;font-size:13px;line-height:1.6;border-left:2px solid rgba(215,169,54,.55);padding-left:14px}
.hero-note+.hero-cta{margin-top:26px}
.timeline article{align-items:start;min-height:130px;padding-block:25px}
.timeline-role{color:#c2a959!important;font-weight:800;letter-spacing:.025em}
.timeline-body{max-width:730px;margin-top:9px!important;line-height:1.58}
.timeline-arrow{padding-top:5px}
.network-grid article{min-height:370px}
.network-grid h4{max-width:450px;margin:0 0 14px;color:#d4b75e;font-size:12px;line-height:1.5;letter-spacing:.045em}
.network-grid p{line-height:1.62;font-size:14px}
.partners-heading{margin:58px 0 22px;font-size:28px;letter-spacing:-.03em}
.partner-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.partner-grid article{padding:25px;min-height:330px;border:1px solid var(--line);background:rgba(5,8,12,.48)}
.partner-icon{display:grid;place-items:center;width:54px;height:54px;margin-bottom:32px;border:1px solid rgba(10,102,194,.52);border-radius:50%;color:#68b4ff;font-size:9px;font-weight:900}
.partner-grid h3{margin:0 0 12px;font-size:19px}
.partner-grid h4{margin:22px 0 10px;color:#d2b75d;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.partner-grid p,.partner-grid li{color:#9da8b6;font-size:13px;line-height:1.58}
.partner-grid ul,.solutions-grid ul{margin:0;padding:0;list-style:none}
.partner-grid li,.solutions-grid li{position:relative;padding-left:18px;margin-top:9px}
.partner-grid li:before,.solutions-grid li:before{content:"✦";position:absolute;left:0;top:1px;color:var(--gold);font-size:8px}
.capability-grid{grid-template-columns:repeat(5,1fr)}
.capability-grid article{min-height:255px}
.capability-grid p{margin:13px 0 0;color:#8f9aa8;font-size:12px;line-height:1.58}
.solutions-grid.solutions-full{grid-template-columns:1fr 1fr}
.solutions-full article{min-height:520px}
.solutions-grid li{color:#aeb7c3;font-size:14px;line-height:1.58;margin-top:14px}
.work-step{display:grid;grid-template-columns:38px 1fr;gap:14px;padding:17px 0;border-top:1px solid var(--line)}
.work-step>b{color:var(--gold);font:900 10px monospace}
.work-step h4{margin:0 0 7px;color:#fff;font-size:14px;line-height:1.4}
.work-step p{margin:0!important;color:#909ba9!important;font-size:13px!important;line-height:1.55!important}
.insight-intro{max-width:760px;margin-bottom:30px}
.insight-intro h2{margin:0 0 14px;font-size:clamp(34px,4vw,54px);letter-spacing:-.04em}
.insight-intro>p:last-child{color:#9da7b4;line-height:1.65}
.insight-card{grid-template-columns:100px 1fr}
.insight-card>div>p{color:#9da7b4;line-height:1.68}
.insight-link{display:inline-block;margin-top:18px;color:#d7bc62!important;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid rgba(215,188,98,.5);padding-bottom:7px}
footer>span{color:#727d89;font-size:9px;font-weight:800;letter-spacing:.12em}

@media(max-width:1050px){
  .capability-grid{grid-template-columns:repeat(3,1fr)}
  .capability-grid article{border-bottom:1px solid var(--line)}
}
@media(max-width:760px){
  .hero-note{font-size:12px}
  .timeline article{min-height:0}
  .timeline-body{margin-top:8px!important}
  .partner-grid,.capability-grid,.solutions-grid.solutions-full{grid-template-columns:1fr}
  .network-grid article,.partner-grid article,.solutions-full article{min-height:0}
  .insight-card{grid-template-columns:1fr}
}

/* Requested motion, centered section titles, and tighter rhythm */
.hero{min-height:740px;padding-top:70px}
.hero-visual{height:555px;animation:hero-float 6s ease-in-out infinite}
.photo-card{background:#0b1017;overflow:hidden;isolation:isolate}
.photo-card:before{content:"";position:absolute;inset:-5%;z-index:0;background:linear-gradient(180deg,rgba(8,10,14,.02),rgba(7,9,13,.5)),url("https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?auto=format&fit=crop&w=1400&q=88") center 35%/cover;animation:hero-image-pan 12s ease-in-out infinite alternate;will-change:transform}
.photo-card:after{z-index:1;background:linear-gradient(110deg,transparent 20%,rgba(255,235,165,.18) 42%,transparent 62%),radial-gradient(circle at 65% 18%,rgba(255,220,113,.2),transparent 34%);background-size:220% 100%,auto;animation:hero-light-sweep 5.5s ease-in-out infinite}
@keyframes hero-float{0%,100%{transform:translateY(-16px)}50%{transform:translateY(-5px)}}
@keyframes hero-image-pan{0%{transform:scale(1.04) translate3d(-1.5%,-1%,0)}100%{transform:scale(1.13) translate3d(2%,1.5%,0)}}
@keyframes hero-light-sweep{0%,18%{background-position:180% 0,center;opacity:.5}58%,100%{background-position:-70% 0,center;opacity:1}}

#points .section-title,#experience .section-title,#network .section-title,#capabilities .section-title,#offers .section-title{grid-template-columns:1fr;gap:11px;justify-items:center;text-align:center;margin-bottom:28px}
#points .section-title>div,#experience .section-title>div,#network .section-title>div,#capabilities .section-title>div,#offers .section-title>div{justify-content:center}
#points .section-title h2,#experience .section-title h2,#network .section-title h2,#capabilities .section-title h2,#offers .section-title h2{max-width:1000px}

.content-section{padding-block:60px}
.section-title{margin-bottom:32px}
.difference-grid .feature-card{min-height:280px}
.card-top{margin-bottom:42px}
.founder-grid{gap:56px}
.founder-visual{min-height:450px}
.timeline article{min-height:0;padding-block:19px}
.network-grid article{min-height:330px}
.network-icon{margin-bottom:28px}
.partners-heading{margin-top:42px}
.partner-grid article{min-height:290px;padding:23px}
.partner-icon{margin-bottom:24px}
.brand-marquee{margin-top:28px}
.capability-grid article{min-height:225px}
.capability-grid i{margin-bottom:28px}
.solutions-full article{min-height:0}
.solution-icon{margin-bottom:38px}
.insights-section{padding-block:54px}
.insight-intro{margin-bottom:24px}
.insight-card{padding:36px}
.contact-section{min-height:440px}
.contact-inner{padding-block:60px}
.contact-buttons{margin-top:26px}
footer{min-height:76px}

@media(max-width:760px){
  .hero{padding-top:94px;padding-bottom:32px}
  .hero-visual{height:385px;animation:none;transform:none}
  .content-section{padding-block:48px}
  #points .section-title,#experience .section-title,#network .section-title,#capabilities .section-title,#offers .section-title{margin-bottom:24px}
  .founder-grid{gap:32px}
  .founder-visual{min-height:390px}
  .contact-section{min-height:400px}
  .contact-inner{padding-block:48px}
}

/* Keep the hero image still; animate only its two location badges */
.hero-visual{animation:none;transform:translateY(-12px)}
.photo-card:before{inset:0;animation:none;transform:none;will-change:auto}
.photo-card:after{animation:none;opacity:1;background:radial-gradient(circle at 65% 18%,rgba(255,220,113,.2),transparent 34%)}
.photo-label{background:linear-gradient(100deg,#a66e0d,#ffe787,#fff8c8,#c68a18,#f9d96e);background-size:260% 100%;animation:tokyo-label-shine 3.2s linear infinite;color:#111;text-shadow:0 1px rgba(255,255,255,.35)}
.score-card{overflow:hidden;isolation:isolate;border-color:rgba(215,169,54,.42);animation:global-label-glow 2.8s ease-in-out infinite}
.score-card:before{content:"";position:absolute;inset:-1px;z-index:0;background:linear-gradient(110deg,transparent 24%,rgba(255,232,148,.34) 48%,transparent 70%);transform:translateX(-140%);animation:global-label-sweep 3.4s ease-in-out infinite}
.score-card span{position:relative;z-index:1;color:#fff5cc;text-shadow:0 0 12px rgba(255,218,105,.28)}
@keyframes tokyo-label-shine{0%{background-position:0 center;box-shadow:0 0 10px rgba(215,169,54,.22)}50%{box-shadow:0 0 25px rgba(255,220,112,.62)}100%{background-position:260% center;box-shadow:0 0 10px rgba(215,169,54,.22)}}
@keyframes global-label-glow{0%,100%{border-color:rgba(215,169,54,.36);box-shadow:0 0 0 rgba(215,169,54,0)}50%{border-color:rgba(255,225,130,.9);box-shadow:0 0 24px rgba(215,169,54,.34)}}
@keyframes global-label-sweep{0%,20%{transform:translateX(-140%)}68%,100%{transform:translateX(140%)}}

@media(max-width:760px){
  .hero-visual{transform:none}
}

/* Keep the Tokyo label fully visible with a restrained static treatment */
.photo-label{left:16px;top:24px;animation:none;background:linear-gradient(115deg,#b77a12,#f4d777 52%,#c68a18);background-size:100% 100%;border:1px solid rgba(255,239,181,.55);box-shadow:0 8px 20px rgba(0,0,0,.28),0 0 12px rgba(215,169,54,.16);text-shadow:0 1px rgba(255,255,255,.32);transition:transform .22s ease,box-shadow .22s ease}
.photo-label:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,0,0,.32),0 0 16px rgba(215,169,54,.24)}

@media(max-width:760px){
  .photo-label{left:12px;top:18px}
}

.portrait-monogram img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center;filter:saturate(.9) contrast(1.04);transition:filter .3s ease}
.founder-visual:hover .portrait-monogram img{filter:saturate(1) contrast(1.02)}

/* Show the complete square portrait without cropping */
.founder-visual{min-height:0;aspect-ratio:4/5}
.portrait-monogram{inset:28px 28px auto;aspect-ratio:1/1;clip-path:none;background:#d9ccb8}
.portrait-monogram img{object-fit:contain;object-position:center}

/* Restrained sports-inspired background details */
#points,#experience,#offers{overflow:hidden}
#points>* ,#experience>* ,#offers>.section-shell{position:relative;z-index:1}
#points:before{content:"";position:absolute;z-index:0;width:210px;height:210px;right:-72px;top:42px;border:1px dashed rgba(215,169,54,.23);border-radius:50%;box-shadow:0 0 0 30px rgba(255,255,255,.018),0 0 0 62px rgba(10,102,194,.035);animation:sport-orbit-detail 26s linear infinite}
#experience:before{content:"";position:absolute;z-index:0;inset:0;background:repeating-linear-gradient(90deg,transparent 0 94px,rgba(255,255,255,.035) 94px 95px),linear-gradient(180deg,transparent 49.8%,rgba(215,169,54,.09) 50%,transparent 50.2%);mask-image:linear-gradient(90deg,transparent,black 18%,black 82%,transparent);pointer-events:none}
#offers:before{content:"";position:absolute;z-index:0;width:420px;height:260px;right:-80px;bottom:-70px;background:repeating-linear-gradient(135deg,transparent 0 22px,rgba(10,102,194,.09) 22px 23px);transform:skewX(-10deg);mask-image:linear-gradient(120deg,transparent 5%,black,transparent 82%);pointer-events:none}
.feature-card:after{content:"";position:absolute;right:22px;top:89px;width:34px;height:12px;border-top:1px solid rgba(215,169,54,.38);border-right:1px solid rgba(215,169,54,.38);transform:skewX(-28deg);opacity:.65}
.solutions-grid article:after{content:"";position:absolute;right:-26px;bottom:-26px;width:78px;height:78px;border:1px solid rgba(10,102,194,.18);border-radius:50%;box-shadow:0 0 0 14px rgba(10,102,194,.035)}
@keyframes sport-orbit-detail{to{transform:rotate(360deg)}}

@media(max-width:760px){
  .founder-visual{min-height:0;aspect-ratio:4/5}
  .portrait-monogram{inset:20px 20px auto}
  #points:before{width:150px;height:150px;right:-80px;top:76px}
  #experience:before{background:linear-gradient(180deg,transparent 49.8%,rgba(215,169,54,.07) 50%,transparent 50.2%)}
}

/* Refined sports visual system */
.sport-icon{display:block;width:30px;height:30px}
.section-heading-row{display:flex;align-items:center;gap:14px;min-width:0}
.section-heading-row h2{margin:0}
.section-sport-icon{display:grid;place-items:center;flex:0 0 42px;width:42px;height:42px;border:1px solid rgba(215,169,54,.34);border-radius:50%;color:var(--gold-pale);background:rgba(215,169,54,.055);box-shadow:inset 0 0 18px rgba(215,169,54,.04)}
.section-sport-icon .sport-icon{width:23px;height:23px}
#points .section-heading-row,#experience .section-heading-row,#network .section-heading-row,#capabilities .section-heading-row,#offers .section-heading-row{justify-content:center}
.card-top i,.capability-grid article>i{display:grid;place-items:center;color:var(--gold-pale)}
.card-top i .sport-icon{width:31px;height:31px}
.capability-grid article>i .sport-icon{width:34px;height:34px}
.solution-icon .sport-icon{width:31px;height:31px}

/* Keep the complete founder portrait, scaled to the copy beside it */
.founder-grid{grid-template-columns:minmax(280px,.7fr) minmax(0,1.3fr);gap:48px}
.founder-visual{width:100%;max-width:360px;justify-self:center;aspect-ratio:4/5}
.portrait-monogram{inset:20px 20px auto}

/* A quiet stadium texture behind the career playbook */
#experience{background-image:linear-gradient(rgba(7,9,13,.93),rgba(7,9,13,.975)),url("https://images.unsplash.com/photo-1574629810360-7efbb92f582c?auto=format&fit=crop&w=1800&q=72");background-position:center;background-size:cover;background-repeat:no-repeat}
#network{position:relative;overflow:hidden}

  .section-heading-row{gap:10px;justify-content:center}

  .founder-grid{grid-template-columns:1fr;gap:32px}

}

  .contact-inner{padding-block:40px}
}

/* Brand logo placements */
.brand-logo{display:block;width:34px;height:34px;flex:0 0 34px;object-fit:cover;border:1px solid rgba(255,235,137,.38);border-radius:7px;box-shadow:0 5px 16px rgba(0,0,0,.3)}
footer .brand-logo{width:46px;height:41px;flex-basis:46px;border-radius:5px}
.contact-logo-bg{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:.17;filter:saturate(.72) contrast(1.08);mix-blend-mode:screen;pointer-events:none}
.contact-section:after{content:"";position:absolute;z-index:0;inset:0;background:linear-gradient(90deg,rgba(7,9,13,.92),rgba(7,9,13,.68) 50%,rgba(7,9,13,.9));pointer-events:none}
.contact-glow{z-index:1}
