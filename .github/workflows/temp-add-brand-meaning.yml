name: Temp add brand meaning summary
on:
  push:
    branches:
      - content/add-brand-meaning-summary-20260908
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: content/add-brand-meaning-summary-20260908
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply exact copy patch
        run: python .github/scripts/temp_add_brand_meaning.py
      - name: Commit patched site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-enhancements.js index.html
          git diff --cached --check
          git commit -m "content: add brand meaning partnership summary"
          git push
