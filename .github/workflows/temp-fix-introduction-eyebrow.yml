name: Temporary fix Introduction eyebrow
on:
  push:
    branches: [fix/introduction-eyebrow-20260907]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/introduction-eyebrow-20260907
      - name: Patch exact eyebrow label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "company:['Company','Company Introduction',''],"
          new = "company:['Introduction','Company Introduction',''],"
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 target, found {count}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: label company introduction eyebrow correctly'
          git push
