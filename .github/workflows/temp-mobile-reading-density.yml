name: Temporary mobile reading density
on:
  push:
    branches:
      - fix/mobile-reading-density-20260908
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/mobile-reading-density-20260908
      - name: Apply mobile reading-density refinement
        run: python .github/scripts/temp_mobile_reading_density.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/case-study-split.css index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: improve mobile reading density"
          git push
