name: Fix headings to actual Insights reference
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-headings-to-actual-insights.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build normalized heading DOM
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/fix_headings_to_actual_insights.py')
          s=p.read_text(encoding='utf-8')
          old="text=text.replace('</style>',css+'\\n</style>',1)"
          new="before,sep,after=text.rpartition('</style>'); text=before+css+'\\n</style>'+after"
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python .github/scripts/fix_headings_to_actual_insights.py || true
      - name: Force exact Insights computed styles and verify
        run: python .github/scripts/final_heading_specificity.py
      - name: Commit exact reference match
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm --ignore-unmatch \
            .github/workflows/fix-headings-to-actual-insights.yml \
            .github/scripts/fix_headings_to_actual_insights.py \
            .github/scripts/final_heading_specificity.py \
            .github/workflows/audit-insights-reference.yml \
            .github/scripts/audit_insights_reference.py
          git commit -m 'Match all six headings to actual Insights style'
          git push
