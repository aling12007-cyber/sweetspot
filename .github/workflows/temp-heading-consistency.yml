name: Temporary normalize heading hierarchy
on:
  push:
    branches: [fix/heading-consistency-i18n-20260907]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/heading-consistency-i18n-20260907
      - name: Normalize headings and localized navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count=text.count(old)
              assert count==1, f'{label}: expected 1 match, found {count}'
              return text.replace(old,new,1)

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ("company:['Introduction','Company Introduction',''],", "company:['INTRODUCTION','Company Introduction',''],", 'EN Introduction kicker'),
            ("company:['会社','会社紹介',''],", "company:['会社紹介','Sweet Spotについて',''],", 'JA Introduction hierarchy'),
            ("company:['公司','公司簡介',''],", "company:['公司簡介','關於 Sweet Spot',''],", 'ZH Introduction hierarchy'),
            ("points:['Difference','Points of Difference',''],", "points:['DIFFERENCE','Points of Difference',''],", 'EN Difference kicker'),
            ("founder:['Founder','Sam L. Pearson',''],", "founder:['FOUNDER','Sam L. Pearson',''],", 'EN Founder kicker'),
            ("experience:['Career','Professional Journey','Built across APAC'],", "experience:['CAREER','Professional Journey','Built across APAC'],", 'EN Career kicker'),
            ("network:['Network','Broad Influence and Access','Services rendered to:'],", "network:['NETWORK','Broad Influence and Access','Services rendered to:'],", 'EN Network kicker'),
            ("capabilities:['Case','Case Study: Apple','Demonstrated high-level facilitation capability']", "capabilities:['CASE STUDY','Case Study: Apple','Demonstrated high-level facilitation capability'],\n      insights:['INSIGHTS','Insights & Perspectives','']", 'EN Case/Insights headings'),
            ("capabilities:['ケース','ケーススタディ Apple','高水準のファシリテーション能力を実証']", "capabilities:['ケーススタディ','ケーススタディ Apple','高水準のファシリテーション能力を実証'],\n      insights:['インサイト','インサイトと視点','']", 'JA Case/Insights headings'),
            ("capabilities:['案例','案例研究：Apple','展現高水準的協調促成能力']", "capabilities:['案例研究','案例研究：Apple','展現高水準的協調促成能力'],\n      insights:['洞察','洞察與觀點','']", 'ZH Case/Insights headings'),
            ("var f={company:'Company',points:'Difference',founder:'Founder',experience:'Career',network:'Network',capabilities:'Case',insights:'Insights & Perspectives'};", "var f={company:'INTRODUCTION',points:'DIFFERENCE',founder:'FOUNDER',experience:'CAREER',network:'NETWORK',capabilities:'CASE STUDY',insights:'INSIGHTS'};", 'heading fallback labels'),
            ('assets/site-enhancements.js?v=intro-big-headings-20260907', 'assets/site-enhancements.js?v=heading-consistency-i18n-20260907', 'JS cache version'),
          ]
          for old,new,label in replacements:
              s=replace_once(s,old,new,label)
          p.write_text(s,encoding='utf-8')

          p=Path('assets/site-enhancements.js')
          j=p.read_text(encoding='utf-8')
          j=replace_once(j, "version='20260907-heading-hierarchy-i18n-v3-'+lang", "version='20260907-heading-hierarchy-i18n-v4-'+lang", 'nav version')
          nav_replacements=[
            ("en:{home:'HOME',introduction:'INTRODUCTION',foundation:'FOUNDATION / PURPOSE',nameLogo:'NAME / LOGO',standFor:'WHAT WE STAND FOR',difference:'DIFFERENCE',founder:'FOUNDER',career:'CAREER',network:'NETWORK',caseStudy:'CASE',insights:'INSIGHTS',contact:'CONTACT',submenu:' subsections'},", "en:{home:'HOME',introduction:'INTRODUCTION',foundation:'FOUNDATION / PURPOSE',nameLogo:'NAME / LOGO',standFor:'WHAT WE STAND FOR',difference:'DIFFERENCE',founder:'FOUNDER',career:'CAREER',network:'NETWORK',caseStudy:'CASE STUDY',insights:'INSIGHTS',contact:'CONTACT',submenu:' subsections'},", 'EN nav'),
            ("ja:{home:'ホーム',introduction:'会社紹介',foundation:'創立 / 理念',nameLogo:'名称 / ロゴ',standFor:'私たちの理念',difference:'私たちの強み',founder:'創業者',career:'経歴',network:'ネットワーク',caseStudy:'事例',insights:'インサイト',contact:'お問い合わせ',submenu:'のサブメニュー'},", "ja:{home:'ホーム',introduction:'会社紹介',foundation:'創立 / 理念',nameLogo:'名称 / ロゴ',standFor:'私たちの理念',difference:'私たちの強み',founder:'創業者',career:'経歴',network:'ネットワーク',caseStudy:'ケーススタディ',insights:'インサイト',contact:'お問い合わせ',submenu:'のサブメニュー'},", 'JA nav'),
            ("zhtw:{home:'首頁',introduction:'公司簡介',foundation:'創立 / 理念',nameLogo:'名稱 / LOGO',standFor:'核心理念',difference:'差異化優勢',founder:'創辦人',career:'職涯',network:'產業網絡',caseStudy:'案例',insights:'洞察',contact:'聯絡我們',submenu:'子選單'},", "zhtw:{home:'首頁',introduction:'公司簡介',foundation:'創立 / 理念',nameLogo:'名稱 / LOGO',standFor:'核心理念',difference:'差異化優勢',founder:'創辦人',career:'職涯',network:'產業網絡',caseStudy:'案例研究',insights:'洞察',contact:'聯絡我們',submenu:'子選單'},", 'ZHTW nav'),
            ("zhcn:{home:'首页',introduction:'公司简介',foundation:'创立 / 理念',nameLogo:'名称 / LOGO',standFor:'核心理念',difference:'差异化优势',founder:'创办人',career:'职业经历',network:'行业网络',caseStudy:'案例',insights:'洞察',contact:'联系我们',submenu:'子菜单'}", "zhcn:{home:'首页',introduction:'公司简介',foundation:'创立 / 理念',nameLogo:'名称 / LOGO',standFor:'核心理念',difference:'差异化优势',founder:'创办人',career:'职业经历',network:'行业网络',caseStudy:'案例研究',insights:'洞察',contact:'联系我们',submenu:'子菜单'}", 'ZHCN nav'),
            ("en:'Introduction',\n    ja:'会社紹介',\n    zhtw:'公司簡介',\n    zhcn:'公司简介'", "en:'INTRODUCTION',\n    ja:'会社紹介',\n    zhtw:'公司簡介',\n    zhcn:'公司简介'", 'Introduction fallback labels'),
          ]
          for old,new,label in nav_replacements:
              j=replace_once(j,old,new,label)
          p.write_text(j,encoding='utf-8')
          PY
      - name: Validate patched JavaScript syntax
        run: |
          node --check assets/site-enhancements.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="ss-single-heading-script">(.*?)</script>',s,re.S)
          assert m
          Path('.heading-check.js').write_text(m.group(1),encoding='utf-8')
          subprocess.run(['node','--check','.heading-check.js'],check=True)
          Path('.heading-check.js').unlink()
          PY
      - name: Commit patched site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/site-enhancements.js
          git diff --cached --check
          git commit -m "fix: normalize heading hierarchy and translations"
          git push origin HEAD:fix/heading-consistency-i18n-20260907
