name: Audit Insights heading reference
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-insights-reference.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit rendered heading styles
        run: python .github/scripts/audit_insights_reference.py
