name: Fix Traditional Chinese localization
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-traditional-chinese.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install localization verifier
        run: python -m pip install --disable-pip-version-check -q opencc-python-reimplemented
      - name: Patch and verify Traditional Chinese
        run: python .github/scripts/fix_traditional_chinese_v2.py
      - name: Commit localization fix only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && { echo 'No index changes to commit'; exit 1; }
          git commit -m 'Fix Traditional Chinese localization'
          git push origin main
