name: Simplify partner section
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze marquee and compact partner cards
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),p='index.html'; let s=fs.readFileSync(p,'utf8');
          const needle='.partner-grid li:before{font-size:9.6px}';
          const rules=needle+'\n/* Static brand line and minimal partner cards */\n.brand-marquee{overflow:visible;white-space:normal;padding-block:12px}\n.brand-marquee div{min-width:0;animation:none;transform:none;text-align:center}\n.partner-icon{display:none}\n.partner-grid article{min-height:0;padding:20px 22px}\n.partner-grid h3{margin-top:0}\n.partner-grid h4{margin-top:16px}\n.partner-grid li{margin-top:7px}';
          if(!s.includes('/* Static brand line and minimal partner cards */')){
            if(!s.includes(needle)) throw new Error('Partner style insertion point not found');
            s=s.replace(needle,rules);
          }
          fs.writeFileSync(p,s);
          NODE
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/simplify-partner-section.yml
          git add index.html
          git commit -m "Freeze brand line and compact partner cards"
          git push
