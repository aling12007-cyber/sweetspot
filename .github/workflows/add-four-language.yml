name: Add four-language Chinese switch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-four-language.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ICU transliterator
        shell: bash
        run: |
          if ! command -v uconv >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y icu-devtools
          fi
      - name: Patch four-language switch
        run: python .github/scripts/add_four_language.py
      - name: Commit language update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Traditional Chinese language option'
          git push
