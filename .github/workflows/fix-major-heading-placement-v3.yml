name: Fix major heading placement v3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-major-heading-placement-v3.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Company and Network headings
        shell: bash
        run: echo '' | base64 -d | gzip -d | python
      - name: Verify actual rendered headings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('index.html').read_text(encoding='utf-8')
          verifier='''<script>setTimeout(function(){var ok=true;["company","network"].forEach(function(id){var s=document.getElementById(id);var c=s&&s.querySelector(".major-insights-title[data-major-id='"+id+"']");var h=c&&c.querySelector("h2");var line=c&&c.querySelector(".major-kicker-line");var old=s&&s.querySelector(".section-title");ok=ok&&!!c&&!!h&&!!line&&!!old&&getComputedStyle(h).textAlign==="left"&&line.offsetWidth>20&&line.offsetHeight>0&&getComputedStyle(old).display==="none";});var p=document.createElement("pre");p.id="major-heading-verification";p.textContent=ok?"PASS":"FAIL";document.body.appendChild(p);},3000);</script>'''
          Path('verify-headings.html').write_text(src.replace('</body>',verifier+'</body>',1),encoding='utf-8')
          PY
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=7000 --dump-dom "file://$PWD/verify-headings.html" > /tmp/rendered.html
          grep -F '<pre id="major-heading-verification">PASS</pre>' /tmp/rendered.html
          rm verify-headings.html
      - name: Commit verified website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-major-heading-placement-v3.yml
          git rm -f .github/workflows/fix-major-heading-placement.yml
          git rm -f .github/workflows/verify-major-heading-dom.yml
          git rm -f .github/rendered-heading-report.txt
          git add index.html
          git commit -m "Fix and verify top-level Insights headings"
          git push
