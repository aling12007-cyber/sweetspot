name: Redesign section title icons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace line icons with solid geometric badges
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),p='index.html';let s=fs.readFileSync(p,'utf8');
          const oldIcon='(0,f.jsx)("span",{className:"section-kicker-icon",children:(0,f.jsx)(ge,{type:n[l]||"compass"})})';
          const newIcon='(0,f.jsx)("span",{className:"section-kicker-icon","data-section":l||"career",children:(0,f.jsx)("i",{})})';
          if(!s.includes(newIcon)){
            if(!s.includes(oldIcon)) throw new Error('Current section icon not found');
            s=s.replace(oldIcon,newIcon);
          }
          if(!s.includes('/* Solid geometric section badges */')){
            const css='\n/* Solid geometric section badges */\n.section-title .section-kicker-icon{border:0;border-radius:10px;background:linear-gradient(145deg,#16263a,#0a111c);box-shadow:inset 0 0 0 1px rgba(83,151,225,.34),0 8px 22px rgba(0,0,0,.25)}\n.section-title .section-kicker-icon i{display:block;position:relative;width:18px;height:18px}\n.section-kicker-icon[data-section="01"] i{width:14px;height:14px;border-radius:3px;background:linear-gradient(135deg,#f2d36f 0 50%,#3f8de3 50%);transform:rotate(45deg)}\n.section-kicker-icon[data-section="01"] i:after{content:"";position:absolute;inset:4px;border-radius:50%;background:#0d1622}\n.section-kicker-icon[data-section="02"] i{background:linear-gradient(90deg,#438fe4 0 34%,transparent 34% 42%,#e5bd4e 42% 100%);clip-path:polygon(10% 0,90% 0,100% 70%,50% 100%,0 70%)}\n.section-kicker-icon[data-section="02"] i:after{content:"";position:absolute;left:5px;right:5px;top:5px;height:3px;background:#0d1622;border-radius:2px}\n.section-kicker-icon[data-section="career"] i{border-radius:2px;background:linear-gradient(90deg,#e2ba4c 0 45%,#0d1622 45% 55%,#438fe4 55% 100%)}\n.section-kicker-icon[data-section="career"] i:after{content:"";position:absolute;left:50%;top:2px;bottom:2px;width:2px;background:#dce7f3;transform:translateX(-50%)}\n.section-kicker-icon[data-section="03"] i{background:radial-gradient(circle at 20% 25%,#e5bd4e 0 3px,transparent 3.5px),radial-gradient(circle at 80% 25%,#438fe4 0 3px,transparent 3.5px),radial-gradient(circle at 50% 80%,#e5bd4e 0 3px,transparent 3.5px),conic-gradient(from 30deg at 50% 52%,transparent 0 12%,#6fa9e6 12% 17%,transparent 17% 45%,#d2aa3f 45% 50%,transparent 50% 78%,#6fa9e6 78% 83%,transparent 83%)}\n.section-kicker-icon[data-section="04"] i{border-radius:3px;background:conic-gradient(from 90deg,#438fe4 0 25%,#e5bd4e 0 50%,#438fe4 0 75%,#e5bd4e 0);box-shadow:inset 0 0 0 3px #0d1622}\n.section-kicker-icon[data-section="05"] i{border-radius:50%;background:conic-gradient(#e5bd4e 0 34%,#438fe4 34% 72%,#263c57 72%)}\n.section-kicker-icon[data-section="05"] i:after{content:"";position:absolute;inset:5px;border-radius:50%;background:#0d1622}\n';
            s=s.replace('</style>',css+'</style>');
          }
          fs.writeFileSync(p,s);
          NODE
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/redesign-section-title-icons.yml
          git add index.html
          git commit -m "Redesign section icons as solid geometric badges"
          git push
