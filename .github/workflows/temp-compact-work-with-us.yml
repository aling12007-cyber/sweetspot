name: Temporary compact Work With Us patch
on:
  push:
    branches: [fix/compact-work-with-us-20260908]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/compact-work-with-us-20260908
      - name: Compact Work With Us layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path=Path('assets/case-study-split.css')
          html_path=Path('index.html')
          css=css_path.read_text(encoding='utf-8')

          old='''.work-with-us-section{\n  overflow:hidden;\n  background:\n    radial-gradient(circle at 84% 18%,rgba(215,169,54,.085),transparent 30%),\n    linear-gradient(180deg,#0a0f16 0%,#080c12 100%);\n}\n.work-with-us-shell{\n  position:relative;\n  z-index:1;\n}\n.work-with-us-heading{\n  max-width:860px;\n  margin-bottom:clamp(30px,4vw,46px);\n}\n.work-with-us-eyebrow{\n  margin-bottom:18px;\n}\n.work-with-us-heading h2{\n  margin:0;\n  color:#fff;\n  font-size:clamp(36px,5vw,64px);\n  font-weight:950;\n  line-height:.98;\n  letter-spacing:-.05em;\n}\n.work-with-us-intro{\n  max-width:720px;\n  margin:22px 0 0;\n  color:#aeb7c3;\n  font-size:clamp(15px,1.2vw,17px);\n  line-height:1.7;\n}\n.work-with-us-list{\n  display:grid;\n  grid-template-columns:repeat(2,minmax(0,1fr));\n  gap:1px;\n  margin:0;\n  padding:1px;\n  list-style:none;\n  background:rgba(255,255,255,.12);\n}\n.work-with-us-item{\n  position:relative;\n  display:flex;\n  align-items:flex-start;\n  gap:18px;\n  min-height:112px;\n  padding:26px 28px;\n  background:linear-gradient(145deg,rgba(255,255,255,.038),rgba(255,255,255,.015));\n}\n.work-with-us-marker{\n  display:block;\n  width:24px;\n  height:1px;\n  flex:0 0 24px;\n  margin-top:.72em;\n  background:var(--gold);\n  box-shadow:8px 0 18px rgba(215,169,54,.18);\n}\n.work-with-us-item-text{\n  color:#f1f3f6;\n  font-size:clamp(15px,1.25vw,18px);\n  font-weight:720;\n  line-height:1.5;\n}\n@media(max-width:760px){\n  .work-with-us-heading{\n    margin-bottom:26px;\n  }\n  .work-with-us-eyebrow{\n    margin-bottom:14px;\n  }\n  .work-with-us-heading h2{\n    font-size:clamp(34px,10.5vw,46px);\n    line-height:1.02;\n  }\n  .work-with-us-intro{\n    margin-top:18px;\n    font-size:15px;\n    line-height:1.65;\n  }\n  .work-with-us-list{\n    grid-template-columns:1fr;\n  }\n  .work-with-us-item{\n    min-height:0;\n    gap:14px;\n    padding:21px 18px;\n  }\n  .work-with-us-marker{\n    width:20px;\n    flex-basis:20px;\n  }\n  .work-with-us-item-text{\n    font-size:15px;\n    line-height:1.55;\n  }\n}'''

          new='''.work-with-us-section{\n  overflow:hidden;\n  background:transparent;\n}\n.work-with-us-shell{\n  position:relative;\n  z-index:1;\n  width:min(900px,calc(100% - 48px));\n  margin-inline:auto;\n}\n.work-with-us-heading{\n  max-width:760px;\n  margin-bottom:clamp(22px,3vw,32px);\n}\n.work-with-us-eyebrow{\n  margin-bottom:14px;\n}\n.work-with-us-heading h2{\n  margin:0;\n  color:#fff;\n  font-size:clamp(36px,5vw,64px);\n  font-weight:950;\n  line-height:.98;\n  letter-spacing:-.05em;\n}\n.work-with-us-intro{\n  max-width:680px;\n  margin:16px 0 0;\n  color:#aeb7c3;\n  font-size:clamp(15px,1.2vw,17px);\n  line-height:1.65;\n}\n.work-with-us-list{\n  display:grid;\n  grid-template-columns:repeat(2,minmax(0,1fr));\n  gap:0 34px;\n  margin:0;\n  padding:0;\n  list-style:none;\n  background:transparent;\n  border-top:1px solid var(--line);\n  border-bottom:1px solid var(--line);\n}\n.work-with-us-item{\n  position:relative;\n  display:flex;\n  align-items:flex-start;\n  gap:14px;\n  min-height:0;\n  padding:18px 0;\n  background:transparent;\n  border-bottom:1px solid rgba(255,255,255,.08);\n}\n.work-with-us-item:nth-last-child(-n+2){\n  border-bottom:0;\n}\n.work-with-us-marker{\n  display:block;\n  width:22px;\n  height:1px;\n  flex:0 0 22px;\n  margin-top:.72em;\n  background:var(--gold);\n  box-shadow:none;\n}\n.work-with-us-item-text{\n  color:#f1f3f6;\n  font-size:clamp(15px,1.2vw,17px);\n  font-weight:720;\n  line-height:1.45;\n}\n@media(max-width:760px){\n  .work-with-us-shell{\n    width:min(680px,calc(100% - 64px));\n  }\n  .work-with-us-heading{\n    margin-bottom:20px;\n  }\n  .work-with-us-eyebrow{\n    margin-bottom:12px;\n  }\n  .work-with-us-heading h2{\n    font-size:clamp(34px,10.5vw,46px);\n    line-height:1.02;\n  }\n  .work-with-us-intro{\n    margin-top:14px;\n    font-size:15px;\n    line-height:1.6;\n  }\n  .work-with-us-list{\n    grid-template-columns:1fr;\n    gap:0;\n  }\n  .work-with-us-item{\n    gap:12px;\n    padding:14px 0;\n  }\n  .work-with-us-item:nth-last-child(-n+2){\n    border-bottom:1px solid rgba(255,255,255,.08);\n  }\n  .work-with-us-item:last-child{\n    border-bottom:0;\n  }\n  .work-with-us-marker{\n    width:18px;\n    flex-basis:18px;\n  }\n  .work-with-us-item-text{\n    font-size:15px;\n    line-height:1.5;\n  }\n}'''

          assert css.count(old)==1, f'Expected Work With Us CSS block once, found {css.count(old)}'
          css=css.replace(old,new,1)
          css_path.write_text(css,encoding='utf-8')

          html=html_path.read_text(encoding='utf-8')
          old_link='assets/case-study-split.css?v=work-with-us-20260907'
          new_link='assets/case-study-split.css?v=work-with-us-compact-20260908'
          assert html.count(old_link)==1, f'Expected stylesheet cache token once, found {html.count(old_link)}'
          html=html.replace(old_link,new_link,1)
          html_path.write_text(html,encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          grep -F "width:min(900px,calc(100% - 48px));" assets/case-study-split.css
          grep -F "background:transparent;" assets/case-study-split.css
          grep -F "padding:14px 0;" assets/case-study-split.css
          grep -F "case-study-split.css?v=work-with-us-compact-20260908" index.html
          git diff --check
      - name: Commit site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/case-study-split.css index.html
          git commit -m "fix: compact Work With Us layout"
          git push origin HEAD:fix/compact-work-with-us-20260908
