name: One-time heading hierarchy cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/heading-hierarchy-cleanup.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hierarchy heading cleanup
        shell: bash
        run: echo '' | base64 -d | python
      - name: Commit website update and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/heading-hierarchy-cleanup.yml
          git add index.html
          git commit -m "Refine heading hierarchy and labels"
          git push
