name: Temporary unify heading typography
on:
  push:
    branches:
      - fix/unify-heading-typography-20260908
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/unify-heading-typography-20260908
      - name: Apply heading typography hierarchy
        run: python .github/scripts/temp_unify_heading_typography.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/case-study-split.css index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: unify heading typography hierarchy"
          git push
