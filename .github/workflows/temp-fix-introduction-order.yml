name: Temporary Introduction ordering fix

on:
  push:
    branches:
      - content/introduction-founder-career-20260907

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Keep merged Difference cards before Welcome without observer churn
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/site-enhancements.js')
          s=p.read_text(encoding='utf-8')
          old="    welcome.textContent=copy.closing;\n    list.insertAdjacentElement('afterend',welcome);"
          new="    welcome.textContent=copy.closing;\n    var mergedDifference=company.querySelector('.difference-grid[data-ss-merged-introduction=\"1\"]');\n    if(mergedDifference)mergedDifference.insertAdjacentElement('afterend',welcome);\n    else list.insertAdjacentElement('afterend',welcome);"
          if new not in s:
              if s.count(old)!=1:
                  raise SystemExit(f'Expected one welcome ordering block, found {s.count(old)}')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
          node --check assets/site-enhancements.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site-enhancements.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: stabilize introduction content order'
          git push
