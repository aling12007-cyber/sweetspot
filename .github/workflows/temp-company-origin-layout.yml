name: Temporary Company origin layout

on:
  push:
    branches:
      - content/company-origin-layout-20260907

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Refine Company story order and layout
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Expected {label} block not found')
              return text.replace(old, new, 1)

          js_path = Path('assets/site-enhancements.js')
          js = js_path.read_text(encoding='utf-8')
          start = js.index('  function patchFoundationStory(){')
          end = js.index('\n\n  function patchEmptySemantics(){', start)
          old = js[start:end]
          updated = old

          updated = replace_once(
              updated,
              "    var story=company.querySelector('.company-foundation-story');\n    if(!story){\n      var list=company.querySelector('.company-intro-list');\n      if(!list)return;\n\n      story=document.createElement('div');",
              "    var list=company.querySelector('.company-intro-list');\n    if(!list)return;\n\n    var story=company.querySelector('.company-foundation-story');\n    if(!story){\n      story=document.createElement('div');",
              'story/list setup'
          )
          updated = replace_once(
              updated,
              "    story.hidden=false;\n    if(story.getAttribute('data-ss-story-lang')===lang)return;\n\n    story.setAttribute('data-ss-story-lang',lang);\n    story.setAttribute('lang',copy.htmlLang);\n    story.textContent='';",
              "    story.hidden=false;\n    var needsRebuild=story.getAttribute('data-ss-story-lang')!==lang;\n    story.setAttribute('lang',copy.htmlLang);\n\n    if(needsRebuild){\n      story.setAttribute('data-ss-story-lang',lang);\n      story.textContent='';",
              'language rebuild guard'
          )
          updated = replace_once(
              updated,
              "    originHeading.textContent=copy.originHeading;\n    origin.appendChild(originHeading);\n\n    var logoStage=document.createElement('div');",
              "    originHeading.textContent=copy.originHeading;\n    origin.appendChild(originHeading);\n\n    var originLayout=document.createElement('div');\n    originLayout.className='company-story-origin-layout';\n\n    var logoStage=document.createElement('div');",
              'origin layout setup'
          )
          updated = replace_once(
              updated,
              "    logoStage.appendChild(logo);\n    origin.appendChild(logoStage);",
              "    logoStage.appendChild(logo);\n    originLayout.appendChild(logoStage);",
              'logo placement'
          )
          updated = replace_once(
              updated,
              "    nameParagraph.appendChild(document.createTextNode(copy.nameSuffix));\n    origin.appendChild(nameParagraph);\n\n    var closing=appendStoryParagraph(origin,copy.closing);\n    closing.className='company-story-closing';\n    story.appendChild(origin);\n  }",
              "    nameParagraph.appendChild(document.createTextNode(copy.nameSuffix));\n    originLayout.appendChild(nameParagraph);\n    origin.appendChild(originLayout);\n    story.appendChild(origin);\n    }\n\n    // Requested reading order: Foundation, logo origin, company statements, welcome.\n    story.insertAdjacentElement('afterend',list);\n\n    var welcome=company.querySelector('.company-story-welcome');\n    if(!welcome){\n      welcome=document.createElement('p');\n      welcome.className='company-story-welcome';\n    }\n    welcome.setAttribute('lang',copy.htmlLang);\n    welcome.textContent=copy.closing;\n    list.insertAdjacentElement('afterend',welcome);\n  }",
              'origin closing and section order'
          )

          for token in (
              "originLayout.className='company-story-origin-layout'",
              "story.insertAdjacentElement('afterend',list)",
              "welcome.className='company-story-welcome'",
          ):
              if token not in updated:
                  raise SystemExit(f'Missing expected JS token: {token}')
          js_path.write_text(js[:start] + updated + js[end:], encoding='utf-8')

          css_path = Path('assets/case-study-split.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Company Foundation Story — origin side-by-side refinement */'
          if marker not in css:
              css_block = dedent(r'''
              
              /* Company Foundation Story — origin side-by-side refinement */
              #company .company-story-origin-layout{
                position:relative;
                z-index:1;
                display:grid;
                grid-template-columns:minmax(220px,.72fr) minmax(0,1.45fr);
                gap:clamp(30px,4.8vw,66px);
                align-items:center;
                padding-top:4px;
              }
              #company .company-story-origin-layout .company-story-logo-stage{
                min-height:220px;
                margin:0;
                border:0;
                background:radial-gradient(circle at center,rgba(215,169,54,.12),transparent 60%);
              }
              #company .company-story-origin-layout .company-story-logo{
                width:clamp(150px,16vw,205px);
              }
              #company .company-story-origin-layout .company-story-origin-copy{
                margin:0;
                max-width:none;
                text-align:left;
                color:#cbd2db;
                font-size:clamp(16px,1.2vw,18px);
                line-height:1.82;
              }
              #company .company-foundation-story + .company-intro-list{
                width:min(100%,1040px);
                margin-top:clamp(22px,3vw,34px);
              }
              #company .company-story-welcome{
                position:relative;
                z-index:2;
                width:min(100%,1040px);
                margin:clamp(34px,4.5vw,52px) auto 0;
                padding-top:clamp(24px,3vw,34px);
                border-top:1px solid rgba(215,169,54,.24);
                color:var(--gold-pale);
                text-align:center;
                font-family:Georgia,"Times New Roman",serif;
                font-size:clamp(32px,4.4vw,54px);
                font-weight:700;
                line-height:1.08;
                letter-spacing:-.035em;
              }
              @media(max-width:760px){
                #company .company-story-origin-layout{
                  grid-template-columns:1fr;
                  gap:18px;
                }
                #company .company-story-origin-layout .company-story-logo-stage{
                  min-height:174px;
                  margin:0 0 2px;
                }
                #company .company-story-origin-layout .company-story-logo{
                  width:min(50vw,174px);
                }
                #company .company-story-origin-layout .company-story-origin-copy{
                  font-size:15px;
                  line-height:1.72;
                }
                #company .company-foundation-story + .company-intro-list{
                  margin-top:18px;
                }
                #company .company-story-welcome{
                  margin-top:28px;
                  padding-top:24px;
                  font-size:clamp(30px,9vw,40px);
                  line-height:1.12;
                }
              }
              ''')
              css_path.write_text(css + css_block, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_src = 'assets/site-enhancements.js?v=20260907-2'
          new_src = 'assets/site-enhancements.js?v=20260907-3'
          if new_src not in index:
              if old_src not in index:
                  raise SystemExit('Expected enhancement script cache key not found')
              index = index.replace(old_src, new_src, 1)
              index_path.write_text(index, encoding='utf-8')
          PY

          node --check assets/site-enhancements.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site-enhancements.js assets/case-study-split.css index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'content: refine company story layout and order'
          git push
