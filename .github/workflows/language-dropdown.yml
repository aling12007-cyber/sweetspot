name: Convert language switch to dropdown
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/language-dropdown.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace language buttons with dropdown UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re, subprocess
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start='<!-- Language dropdown selector START -->'
          end='<!-- Language dropdown selector END -->'
          if start in s:
              a=s.index(start)
              b=s.index(end,a)+len(end)
              s=s[:a]+s[b:]
          block=base64.b64decode('').decode('utf-8')
          if '</body>' not in s:
              raise SystemExit('Could not find </body>')
          s=s.replace('</body>',block+'\n</body>',1)
          if s.count('id="language-dropdown-selector"') != 1:
              raise SystemExit('Language dropdown controller must exist exactly once')
          m=re.search(r'<script id="language-dropdown-selector">(.*?)</script>',s,re.S)
          if not m:
              raise SystemExit('Language dropdown script missing')
          t=Path('.language-dropdown-check.js')
          t.write_text(m.group(1),encoding='utf-8')
          subprocess.run(['node','--check',str(t)],check=True)
          t.unlink()
          p.write_text(s,encoding='utf-8')
          print('Language dropdown patch validated')
          PY
          git diff -- index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/language-dropdown.yml
          git add index.html
          git commit -m 'Convert language selector to dropdown'
          git push
