name: Correct navigation section labels
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct navigation labels
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='index.html';
          let s=fs.readFileSync(path,'utf8');
          const newNav=String.raw`let e=[["points",{en:"Points of Difference",ja:"\u79C1\u305F\u3061\u306E\u5F37\u307F",zh:"\u6838\u5FC3\u4F18\u52BF"}],["founder",{en:"Introducing the Founder",ja:"\u5275\u8A2D\u8005",zh:"\u521B\u529E\u4EBA\u4ECB\u7ECD"}],["experience",{en:"Career Playbook",ja:"\u4E3B\u8981\u306A\u8077\u6B74\u3068\u5B9F\u7E3E",zh:"\u804C\u4E1A\u751F\u6DAF\u6838\u5FC3\u7ECF\u5386"}],["network",{en:"Network & Influence",ja:"\u30D1\u30FC\u30C8\u30CA\u30FC\u30B7\u30C3\u30D7\u3068\u696D\u754C\u3078\u306E\u5F71\u97FF\u529B",zh:"\u5408\u4F5C\u4F19\u4F34\u4E0E\u4EA7\u4E1A\u5F71\u54CD\u529B"}],["offers",{en:"Customized Solutions",ja:"\u30AB\u30B9\u30BF\u30DE\u30A4\u30BA\u3055\u308C\u305F\u30BD\u30EA\u30E5\u30FC\u30B7\u30E7\u30F3",zh:"\u5BA2\u5236\u5316\u89E3\u51B3\u65B9\u6848"}]]`;
          if(!s.includes(newNav)){
            const pattern=/let e=\[\["points",\{en:"What Sets Us Apart"[\s\S]*?\]\];return/;
            if(!pattern.test(s)) throw new Error('Current navigation data not found');
            s=s.replace(pattern,newNav+';return');
          }
          fs.writeFileSync(path,s);
          NODE
      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/correct-navigation-section-labels.yml
          git add index.html
          git commit -m "Use section kickers in navigation"
          git push
