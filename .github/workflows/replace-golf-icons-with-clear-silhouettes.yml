name: Replace golf icons with clear silhouettes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add recognizable golf silhouettes
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),p='index.html';let s=fs.readFileSync(p,'utf8');
          if(!s.includes('/* Clear golf silhouette icons */')){
            const css='\n/* Clear golf silhouette icons */\n.section-title .section-kicker-icon{width:42px;height:42px;flex-basis:42px;border-radius:11px;background:#101b29;box-shadow:inset 0 0 0 1px rgba(111,169,230,.26)}\n.section-title .section-kicker-icon i{width:25px;height:25px;border-radius:0;clip-path:none;transform:none;box-shadow:none;background:#f0cf67;-webkit-mask-position:center;-webkit-mask-repeat:no-repeat;-webkit-mask-size:contain;mask-position:center;mask-repeat:no-repeat;mask-size:contain}\n.section-title .section-kicker-icon i:before,.section-title .section-kicker-icon i:after{content:none}\n.section-kicker-icon[data-section="01"] i{-webkit-mask-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Ccircle cx=%2712%27 cy=%277%27 r=%276%27/%3E%3Cpath d=%27M10 13h4l-1 6h4v2H7v-2h4z%27/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Ccircle cx=%2712%27 cy=%277%27 r=%276%27/%3E%3Cpath d=%27M10 13h4l-1 6h4v2H7v-2h4z%27/%3E%3C/svg%3E")}\n.section-kicker-icon[data-section="02"] i{background:#65a9ef;-webkit-mask-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Ccircle cx=%278%27 cy=%274%27 r=%272%27/%3E%3Cpath d=%27M7 7l5 2 4-2 2 2-6 3-3-2-2 6H4L7 7zm4 4 4 8h-3l-3-7zM18 8h2v14h-2z%27/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Ccircle cx=%278%27 cy=%274%27 r=%272%27/%3E%3Cpath d=%27M7 7l5 2 4-2 2 2-6 3-3-2-2 6H4L7 7zm4 4 4 8h-3l-3-7zM18 8h2v14h-2z%27/%3E%3C/svg%3E")}\n.section-kicker-icon[data-section="career"] i{-webkit-mask-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M5 2h3v18h8v2H3v-2h2V2zm3 1h12l-4 5 4 5H8V3z%27/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M5 2h3v18h8v2H3v-2h2V2zm3 1h12l-4 5 4 5H8V3z%27/%3E%3C/svg%3E")}\n.section-kicker-icon[data-section="03"] i{background:#65a9ef;-webkit-mask-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M5 2h3l3 15-5 4H2v-3h4L5 2zm11 0h3l-1 16h4v3h-4l-5-4 3-15z%27/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M5 2h3l3 15-5 4H2v-3h4L5 2zm11 0h3l-1 16h4v3h-4l-5-4 3-15z%27/%3E%3C/svg%3E")}\n.section-kicker-icon[data-section="04"] i{-webkit-mask-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M5 6h12l3 7h2v5h-2a3 3 0 01-6 0H9a3 3 0 01-6 0H1v-5h2l2-7zm2 2-1 5h11l-2-5H7z%27/%3E%3Ccircle cx=%276%27 cy=%2718%27 r=%272%27/%3E%3Ccircle cx=%2717%27 cy=%2718%27 r=%272%27/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M5 6h12l3 7h2v5h-2a3 3 0 01-6 0H9a3 3 0 01-6 0H1v-5h2l2-7zm2 2-1 5h11l-2-5H7z%27/%3E%3Ccircle cx=%276%27 cy=%2718%27 r=%272%27/%3E%3Ccircle cx=%2717%27 cy=%2718%27 r=%272%27/%3E%3C/svg%3E")}\n.section-kicker-icon[data-section="05"] i{background:#65a9ef;-webkit-mask-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M5 2h14v5c0 5-2 8-5 9v3h4v3H6v-3h4v-3C7 15 5 12 5 7V2zm-3 2h3v3c0 3 1 5 3 7-4-1-6-4-6-8V4zm17 0h3v2c0 4-2 7-6 8 2-2 3-4 3-7V4z%27/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M5 2h14v5c0 5-2 8-5 9v3h4v3H6v-3h4v-3C7 15 5 12 5 7V2zm-3 2h3v3c0 3 1 5 3 7-4-1-6-4-6-8V4zm17 0h3v2c0 4-2 7-6 8 2-2 3-4 3-7V4z%27/%3E%3C/svg%3E")}\n';
            s=s.replace('</style>',css+'</style>');
          }
          fs.writeFileSync(p,s);
          NODE
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/replace-golf-icons-with-clear-silhouettes.yml
          git add index.html
          git commit -m "Replace section icons with clear golf silhouettes"
          git push
