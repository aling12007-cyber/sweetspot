name: Apply maintenance cleanup

on:
  push:
    branches:
      - maintenance/remove-redundant-preload-20260901
    paths:
      - '.github/workflows/apply-maintenance-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/remove-redundant-preload-20260901
          fetch-depth: 0

      - name: Remove redundant preload helper and refresh maintenance docs
        shell: python
        run: |
          from pathlib import Path

          js_path = Path('assets/site-enhancements.js')
          js = js_path.read_text(encoding='utf-8')
          start_marker = "  var heroImageHref='assets/images/site-5fa8ee41a447.webp';\n"
          end_marker = "  prepareHeroImage();\n\n"
          start = js.find(start_marker)
          if start < 0:
              raise SystemExit('Dynamic preload helper start marker not found')
          end = js.find(end_marker, start)
          if end < 0:
              raise SystemExit('Dynamic preload helper end marker not found')
          end += len(end_marker)
          js = js[:start] + js[end:]
          if 'prepareHeroImage' in js or 'heroImageHref' in js:
              raise SystemExit('Dynamic preload helper was not fully removed')
          if "cityImage.setAttribute('fetchpriority','high')" not in js:
              raise SystemExit('Rendered Tokyo Tower image fetch priority safeguard is missing')
          js_path.write_text(js, encoding='utf-8')

          doc_path = Path('.github/SITE-MAINTENANCE.md')
          doc = doc_path.read_text(encoding='utf-8')
          old_hero = "- The retired Unsplash hero stadium image must never be allowed to render behind the Tokyo Tower image.\n- `assets/case-study-split.css` neutralizes the legacy `.photo-card::before` background while the bundled source still contains the old declaration.\n- `assets/site-enhancements.js` gives the Tokyo Tower image high fetch priority and removes the stale outer accessibility label so the existing Tokyo Tower image alternative text is used.\n"
          new_hero = "- The retired Unsplash Hero stadium URL has been removed from `index.html` and must not be restored.\n- `assets/case-study-split.css` continues to suppress the legacy `.photo-card::before` layer while preserving the current Tokyo Tower composition.\n- `index.html` statically preloads the Tokyo Tower image with high fetch priority.\n- `assets/site-enhancements.js` keeps the rendered Tokyo Tower image at high fetch priority and removes the stale outer accessibility label so the existing Tokyo Tower image alternative text is used.\n"
          if old_hero not in doc:
              raise SystemExit('Expected Hero maintenance text not found')
          doc = doc.replace(old_hero, new_hero, 1)
          old_run = '- Run the site-integrity workflow for changes to `index.html`, `assets/**`, or the integrity workflow itself.'
          new_run = '- Run the site-integrity workflow for changes to `index.html`, `assets/**`, `favicon.svg`, `robots.txt`, `sitemap.xml`, or the integrity workflow itself.'
          if old_run not in doc:
              raise SystemExit('Expected workflow maintenance text not found')
          doc = doc.replace(old_run, new_run, 1)
          doc_path.write_text(doc, encoding='utf-8')

      - name: Validate zero visible-output change
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/site-enhancements.js
          git diff --exit-code origin/main -- index.html assets/case-study-split.css favicon.svg robots.txt sitemap.xml .github/workflows/validate-site-integrity.yml
          grep -Fq '<link rel="preload" as="image" href="assets/images/site-5fa8ee41a447.webp" fetchpriority="high">' index.html
          grep -Fq "cityImage.setAttribute('fetchpriority','high')" assets/site-enhancements.js
          ! grep -Fq 'prepareHeroImage' assets/site-enhancements.js
          ! grep -Fq 'heroImageHref' assets/site-enhancements.js
          git diff --check

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-maintenance-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove redundant preload helper'
          git push origin HEAD:maintenance/remove-redundant-preload-20260901
