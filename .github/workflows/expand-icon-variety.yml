name: Expand icon variety
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add new professional icon set
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),p='index.html'; let s=fs.readFileSync(p,'utf8');
          const oldTypes='["rugby","baseball","tennis","golf","basketball","cycling","swimming","boxing","trophy"][i]';
          const newTypes='["compass","handshake","megaphone","globe","lightbulb","target","briefcase","medal","rocket"][i]';
          if(!s.includes(newTypes)){
            if(!s.includes(oldTypes)) throw new Error('Timeline icon list not found');
            s=s.replace(oldTypes,newTypes);
          }
          const needle='l==="trophy"&&(0,f.jsxs)(f.Fragment,{children:[';
          const extra='l==="compass"&&(0,f.jsxs)(f.Fragment,{children:[(0,f.jsx)("circle",{cx:"24",cy:"24",r:"16"}),(0,f.jsx)("path",{d:"m29 19-3 7-7 3 3-7 7-3Zm-5-11v4m0 24v4M8 24h4m24 0h4"})]}),l==="handshake"&&(0,f.jsxs)(f.Fragment,{children:[(0,f.jsx)("path",{d:"m7 18 8-7 7 4 4-2 15 12-5 6-5-1-4 4-5-2-4 3-11-9Z"}),(0,f.jsx)("path",{d:"m15 11 8 8 5-3m-9 12 5 4m0-8 7 6m-7-2 3 2M7 18l-3 4 9 9"})]}),l==="megaphone"&&(0,f.jsxs)(f.Fragment,{children:[(0,f.jsx)("path",{d:"M8 27v-9h8l19-8v25l-19-8H8Zm8-9v9"}),(0,f.jsx)("path",{d:"m13 27 3 11h7l-3-9m19-11 4-3m-4 12 4 3"})]}),l==="globe"&&(0,f.jsxs)(f.Fragment,{children:[(0,f.jsx)("circle",{cx:"24",cy:"24",r:"17"}),(0,f.jsx)("path",{d:"M7 24h34M24 7c6 5 9 11 9 17s-3 12-9 17c-6-5-9-11-9-17s3-12 9-17Z"})]}),l==="lightbulb"&&(0,f.jsxs)(f.Fragment,{children:[(0,f.jsx)("path",{d:"M15 27c-3-3-5-6-5-10a14 14 0 0 1 28 0c0 4-2 7-5 10-2 2-3 4-3 7H18c0-3-1-5-3-7Z"}),(0,f.jsx)("path",{d:"M18 38h12m-10 4h8M24 3v4M7 9l4 3m30-3-4 3"})]}),l==="target"&&(0,f.jsxs)(f.Fragment,{children:[(0,f.jsx)("circle",{cx:"22",cy:"26",r:"15"}),(0,f.jsx)("circle",{cx:"22",cy:"26",r:"8"}),(0,f.jsx)("path",{d:"m22 26 17-17m-7 0h7v7"})]}),l==="briefcase"&&(0,f.jsxs)(f.Fragment,{children:[(0,f.jsx)("rect",{x:"7",y:"15",width:"34",height:"25",rx:"3"}),(0,f.jsx)("path",{d:"M17 15v-5h14v5M7 25h34M20 25v4h8v-4"})]}),l==="medal"&&(0,f.jsxs)(f.Fragment,{children:[(0,f.jsx)("circle",{cx:"24",cy:"29",r:"11"}),(0,f.jsx)("path",{d:"m17 20-6-12h9l4 9 4-9h9l-6 12m-7 3 2 4 4 1-3 3 1 5-4-2-4 2 1-5-3-3 4-1 2-4Z"})]}),l==="rocket"&&(0,f.jsxs)(f.Fragment,{children:[(0,f.jsx)("path",{d:"M18 31c-5-1-8 0-11 3 0-5 2-9 7-12 3-8 10-13 25-14-1 15-6 22-14 25-3 5-7 7-12 7 3-3 4-6 3-11"}),(0,f.jsx)("circle",{cx:"29",cy:"18",r:"4"}),(0,f.jsx)("path",{d:"m16 33-6 6m4-2-3 3"})]}),';
          if(!s.includes('l==="compass"&&')){
            if(!s.includes(needle)) throw new Error('Icon component insertion point not found');
            s=s.replace(needle,extra+needle);
          }
          fs.writeFileSync(p,s);
          NODE
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/expand-icon-variety.yml
          git add index.html
          git commit -m "Add varied professional timeline icons"
          git push
