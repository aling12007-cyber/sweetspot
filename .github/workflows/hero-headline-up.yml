name: One-time hero headline alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-headline-up.yml'

permissions:
  contents: write

jobs:
  patch-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move hero headline upward only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css = '''\n/* Keep CTA in place while aligning only the Welcome to / SWEET SPOT headline upward. */\n@media(min-width:761px){\n  #home .hero-copy>h2,\n  #home .hero-copy>h1{transform:translateY(-95px)}\n}\n@media(max-width:760px){\n  #home .hero-copy>h2,\n  #home .hero-copy>h1{transform:translateY(-28px)}\n}\n'''

          marker = '</style>'
          note = '/* Keep CTA in place while aligning only the Welcome to / SWEET SPOT headline upward. */'
          if note not in text:
              if marker not in text:
                  raise SystemExit('style closing tag not found')
              text = text.replace(marker, css + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move hero headline upward"
          git push