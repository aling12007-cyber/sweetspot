name: One-time heading alignment and founder title update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-heading-alignment-founder.yml']
permissions:
  contents: write
jobs:
  update-headings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply heading fixes
        run: echo '' | base64 -d | python
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-heading-alignment-founder.yml
          git add index.html
          git commit -m 'Align headings and promote Founder title'
          git push
