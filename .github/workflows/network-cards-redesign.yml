name: One-time network card redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/network-cards-redesign.yml'

permissions:
  contents: write

jobs:
  redesign-network-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Redesign Broad Influence cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'en:"Rights holders"': 'en:"Rights Holders"',
              'en:"Elite athletes"': 'en:"Elite Athletes"',
              'en:"baseball, cricket, golf, football, Formula One, rugby, and tennis."': 'en:"Baseball, cricket, golf, football, Formula One, rugby, and tennis."',
              'en:"finance, payment services, sportswear, tech & wearables."': 'en:"Finance, payment services, sportswear, tech & wearables."',
              'en:"active and retired."': 'en:"Active and retired."',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          marker = '/* Broad Influence cards — distinct premium treatments */'
          if marker in text:
              start = text.index(marker)
              end = text.index('</style>', start)
              text = text[:start] + text[end:]

          css = r'''
/* Broad Influence cards — distinct premium treatments */
#network .network-grid{
  gap:18px;
  border:0;
  background:none;
}
#network .network-grid article{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  min-height:210px!important;
  padding:30px!important;
  border:1px solid rgba(255,255,255,.14)!important;
  background:#0d141e;
  box-shadow:0 16px 34px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.025);
  transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease!important;
}
#network .network-grid article>*{
  position:relative;
  z-index:2;
}
#network .network-grid .network-icon{
  position:relative;
  z-index:2;
}
#network .network-grid h3{
  margin:20px 0 10px!important;
  color:#fff;
  font-size:clamp(24px,2.15vw,31px)!important;
  font-weight:800;
  line-height:1.12!important;
  letter-spacing:-.025em;
}
#network .network-grid p{
  margin:0!important;
  max-width:92%;
  color:#b9c2cf;
  font-size:15px!important;
  line-height:1.6!important;
}
#network .network-grid article:hover{
  transform:translateY(-3px)!important;
  box-shadow:0 20px 44px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.035);
}

/* 01 Government — formal framed arc */
#network .network-grid article:nth-child(1){
  border-color:rgba(215,169,54,.34)!important;
  border-radius:20px 20px 3px 3px;
  background:
    radial-gradient(circle at 88% 36%,rgba(215,169,54,.095),transparent 30%),
    linear-gradient(135deg,#111b28,#0b1119 68%);
}
#network .network-grid article:nth-child(1):before{
  content:"";
  position:absolute;
  z-index:0;
  left:0;
  top:24px;
  bottom:24px;
  width:3px;
  background:linear-gradient(180deg,transparent,var(--gold),transparent);
}
#network .network-grid article:nth-child(1):after{
  content:"";
  position:absolute;
  z-index:0;
  right:-84px;
  bottom:-102px;
  width:240px;
  height:240px;
  border:1px solid rgba(215,169,54,.34);
  border-radius:50%;
  box-shadow:0 0 0 24px rgba(215,169,54,.018);
}

/* 02 Rights Holders — angled sports-energy panel */
#network .network-grid article:nth-child(2){
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));
  background:
    linear-gradient(135deg,rgba(215,169,54,.045),transparent 32%),
    linear-gradient(145deg,#0f1823,#0a1119 74%);
}
#network .network-grid article:nth-child(2):before{
  content:"";
  position:absolute;
  z-index:0;
  left:0;
  top:18px;
  bottom:18px;
  width:3px;
  background:var(--gold);
}
#network .network-grid article:nth-child(2):after{
  content:"";
  position:absolute;
  z-index:0;
  right:-18px;
  top:-18px;
  width:46%;
  height:125%;
  opacity:.42;
  background:repeating-linear-gradient(135deg,rgba(215,169,54,.12) 0 1px,transparent 1px 15px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);
  mask-image:linear-gradient(90deg,transparent,#000 45%);
}

/* 03 Brands — illuminated dotted globe */
#network .network-grid article:nth-child(3){
  border-color:rgba(215,169,54,.48)!important;
  border-radius:4px 18px 4px 18px;
  background:
    radial-gradient(circle at 92% 12%,rgba(215,169,54,.1),transparent 34%),
    linear-gradient(145deg,#101720,#0b1017 72%);
}
#network .network-grid article:nth-child(3):before{
  content:"";
  position:absolute;
  z-index:0;
  right:-60px;
  bottom:-78px;
  width:250px;
  height:250px;
  border-radius:50%;
  background-image:radial-gradient(circle,rgba(240,207,103,.52) 0 1px,transparent 1.4px);
  background-size:12px 12px;
  opacity:.34;
  box-shadow:inset 20px 12px 50px rgba(215,169,54,.05);
}
#network .network-grid article:nth-child(3):after{
  content:"";
  position:absolute;
  z-index:0;
  right:18px;
  bottom:18px;
  width:76px;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--gold));
}

/* 04 Elite Athletes — speed-line finish */
#network .network-grid article:nth-child(4){
  border-left:4px solid var(--gold)!important;
  border-radius:22px 4px 22px 4px;
  background:
    radial-gradient(circle at 82% 46%,rgba(215,169,54,.07),transparent 31%),
    linear-gradient(145deg,#0c121a,#0a0f15 76%);
}
#network .network-grid article:nth-child(4):before{
  content:"";
  position:absolute;
  z-index:0;
  right:-8%;
  top:32%;
  width:58%;
  height:40%;
  opacity:.3;
  background:repeating-linear-gradient(0deg,transparent 0 8px,rgba(215,169,54,.24) 8px 9px);
  transform:skewX(-18deg);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 42%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent,#000 42%,transparent 100%);
}
#network .network-grid article:nth-child(4):after{
  content:"";
  position:absolute;
  z-index:0;
  right:28px;
  top:28px;
  width:54px;
  height:54px;
  border-top:1px solid rgba(215,169,54,.48);
  border-right:1px solid rgba(215,169,54,.48);
}

@media(max-width:760px){
  #network .network-grid{gap:16px!important}
  #network .network-grid article{
    min-height:244px!important;
    padding:24px 22px!important;
  }
  #network .network-grid .network-icon{
    width:58px!important;
    height:58px!important;
    margin:0!important;
  }
  #network .network-grid h3{
    margin:28px 0 12px!important;
    font-size:clamp(26px,7.2vw,31px)!important;
    line-height:1.12!important;
  }
  #network .network-grid p{
    max-width:100%;
    font-size:17px!important;
    line-height:1.55!important;
  }
  #network .network-grid article:nth-child(1):after{
    right:-116px;
    bottom:-122px;
    width:230px;
    height:230px;
  }
  #network .network-grid article:nth-child(2):after{width:58%;opacity:.32}
  #network .network-grid article:nth-child(3):before{
    right:-104px;
    bottom:-88px;
    width:235px;
    height:235px;
    opacity:.27;
  }
  #network .network-grid article:nth-child(4):before{
    right:-18%;
    width:70%;
    opacity:.24;
  }
}
'''
          text = text.replace('</style>', css + '\n</style>', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit website update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/network-cards-redesign.yml
          git add index.html
          git commit -m "Redesign Broad Influence cards"
          git push
