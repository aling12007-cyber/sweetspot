name: Inspect rendered heading DOM
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-rendered-heading-dom.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and inspect
        shell: bash
        run: |
          set +e
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME=$CHROME" > .github/rendered-heading-report.txt
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=8000 --dump-dom "file://$PWD/index.html" > /tmp/rendered.html 2>/tmp/chrome.err
            echo "CHROME_EXIT=$?" >> .github/rendered-heading-report.txt
            echo "MAJOR_COUNT=$(grep -o 'major-insights-title' /tmp/rendered.html | wc -l)" >> .github/rendered-heading-report.txt
            echo "HIERARCHY_COUNT=$(grep -o 'hierarchy-applied' /tmp/rendered.html | wc -l)" >> .github/rendered-heading-report.txt
            echo "SOURCE_HIDDEN_COUNT=$(grep -o 'major-source-title-hidden' /tmp/rendered.html | wc -l)" >> .github/rendered-heading-report.txt
            echo "COMPANY_H2_COUNT=$(grep -o '>Company Features</h2>' /tmp/rendered.html | wc -l)" >> .github/rendered-heading-report.txt
            echo "NETWORK_H2_COUNT=$(grep -o '>Broad Influence and Access</h2>' /tmp/rendered.html | wc -l)" >> .github/rendered-heading-report.txt
            python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/rendered.html')
          out=Path('.github/rendered-heading-report.txt')
          if p.exists():
              t=p.read_text(encoding='utf-8',errors='replace')
              with out.open('a',encoding='utf-8') as f:
                  for needle in ['id="company"','major-insights-title','id="network"','hierarchy-applied']:
                      i=t.find(needle)
                      f.write('\n===== '+needle+' =====\n')
                      if i<0:
                          f.write('NOT FOUND\n')
                      else:
                          f.write(t[max(0,i-350):i+1200].replace('><','>\n<'))
                          f.write('\n')
          PY
            echo "===== CHROME STDERR =====" >> .github/rendered-heading-report.txt
            tail -80 /tmp/chrome.err >> .github/rendered-heading-report.txt
          fi
      - name: Commit report and remove inspector
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-rendered-heading-dom.yml
          git add .github/rendered-heading-report.txt
          git commit -m "Inspect rendered heading DOM"
          git push
