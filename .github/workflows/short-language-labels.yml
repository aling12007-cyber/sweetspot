name: Shorten language menu labels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/short-language-labels.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Shorten language labels
        run: echo '' | base64 -d | python
