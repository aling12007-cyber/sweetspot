name: Temporary fix mobile logo square
on:
  push:
    branches:
      - fix/mobile-logo-square-20260908
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/mobile-logo-square-20260908
      - name: Apply mobile logo safeguard
        run: python .github/scripts/temp_fix_mobile_logo_square.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/case-study-split.css index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: keep Name Logo image square on mobile"
          git push
