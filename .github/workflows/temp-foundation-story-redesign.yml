name: Temporary Foundation Story redesign

on:
  push:
    branches:
      - content/foundation-story-redesign-20260907

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Redesign Foundation Story block
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('assets/site-enhancements.js')
          js = js_path.read_text(encoding='utf-8')
          start = js.index('  function patchFoundationStory(){')
          end = js.index('\n\n  function patchEmptySemantics(){', start)
          new_function = r'''  function patchFoundationStory(){
    var company=document.querySelector('#company');
    if(!company)return;

    var lang=currentLanguage();
    var copies={
      en:{
        htmlLang:'en',
        foundationHeading:'Foundation Story and Purpose',
        intro:'Founder Sam L. Pearson has built more than 15 years of experience across rights holders, agencies and brands in the APAC sports and entertainment industry.',
        first:'Sam’s experience across rights holders (WTA, FIFA), agencies (Octagon, CSM) and brands (AIG) has provided a comprehensive appreciation of the sports ecosystem and objectives and challenges across the various parties. In particular, the 8 years leading AIG’s sports marketing function ensured a focus on maximizing sponsorship benefits to achieve tangible business results.',
        second:'Sweet Spot was founded to share this solution-focused experience and offer high level facilitation to multiple clients.',
        originHeading:'The Origin of the “Sweet Spot” Name and Logo',
        logoAlt:'Sweet Spot logo',
        namePrefix:'The name represents the sweet feeling when perfectly hitting a ball with the middle part of the bat, racquet or club. The logo brings together an ancient quartz crystal in the center of a traditional Mexican ',
        nameTerm:'serape',
        nameSuffix:'.',
        closing:'Welcome to the Sweet Spot!'
      },
      ja:{
        htmlLang:'ja',
        foundationHeading:'創立ストーリーと理念',
        intro:'創業者 Sam L. Pearson は、APAC のスポーツ・エンターテインメント業界で、権利保有者、エージェンシー、ブランドの各立場を通じて15年以上の経験を積んできました。',
        first:'Samは、権利保有者（WTA、FIFA）、エージェンシー（Octagon、CSM）、ブランド（AIG）それぞれの立場で経験を積み、スポーツ業界全体のエコシステムと、各関係者が抱える目標や課題を幅広く理解してきました。特に、AIGで8年間スポーツマーケティング部門を率いた経験を通じ、スポンサーシップの価値を最大化し、具体的なビジネス成果につなげることに注力してきました。',
        second:'Sweet Spotは、この課題解決を重視した経験を共有し、さまざまなクライアントに高度な調整・支援を提供するために設立されました。',
        originHeading:'「Sweet Spot」の名前とロゴの由来',
        logoAlt:'Sweet Spot ロゴ',
        namePrefix:'「Sweet Spot」という名前は、バット、ラケット、クラブの芯でボールを完璧に捉えたときに感じる心地よさを表しています。ロゴは、メキシコの伝統的な ',
        nameTerm:'serape',
        nameSuffix:'（サラペ）の中央に古代の水晶を配したデザインです。',
        closing:'Sweet Spotへようこそ！'
      },
      zhtw:{
        htmlLang:'zh-Hant',
        foundationHeading:'創立故事與理念',
        intro:'創辦人 Sam L. Pearson 在亞太地區的運動與娛樂產業累積超過 15 年經驗，歷練橫跨權利持有方、代理商與品牌端。',
        first:'Sam 曾在權利持有方（WTA、FIFA）、代理商（Octagon、CSM）以及品牌（AIG）累積經驗，使他得以全面理解體育產業生態，以及不同參與者各自的目標與面臨的挑戰。尤其是在 AIG 領導體育行銷業務的八年間，他始終專注於最大化贊助合作的效益，並將其轉化為具體的商業成果。',
        second:'Sweet Spot 的成立，是為了分享這些以解決問題為核心的經驗，並為不同客戶提供高層次的協調與支援。',
        originHeading:'「Sweet Spot」的名稱和 LOGO 的由來',
        logoAlt:'Sweet Spot 品牌 LOGO',
        namePrefix:'「Sweet Spot」這個名稱，代表使用球棒、球拍或球桿的中心部位完美擊中球時，那種令人愉悅的感受。品牌標誌則將一顆古老的石英水晶置於墨西哥傳統 ',
        nameTerm:'serape',
        nameSuffix:' 織毯的中央。',
        closing:'歡迎來到 Sweet Spot！'
      },
      zhcn:{
        htmlLang:'zh-Hans',
        foundationHeading:'创立故事与理念',
        intro:'创办人 Sam L. Pearson 在亚太地区的体育与娱乐产业积累超过 15 年经验，历练横跨权利持有方、代理机构与品牌端。',
        first:'Sam 曾在权利持有方（WTA、FIFA）、代理机构（Octagon、CSM）以及品牌（AIG）积累经验，使他得以全面理解体育产业生态，以及不同参与方各自的目标与面临的挑战。尤其是在 AIG 领导体育营销业务的八年间，他始终专注于最大化赞助合作的效益，并将其转化为具体的商业成果。',
        second:'Sweet Spot 的成立，是为了分享这些以解决问题为核心的经验，并为不同客户提供高层次的协调与支持。',
        originHeading:'“Sweet Spot”的名称和 LOGO 的由来',
        logoAlt:'Sweet Spot 品牌 LOGO',
        namePrefix:'“Sweet Spot”这个名称，代表使用球棒、球拍或球杆的中心部位完美击中球时，那种令人愉悦的感受。品牌标志则将一颗古老的石英水晶置于墨西哥传统 ',
        nameTerm:'serape',
        nameSuffix:' 织毯的中央。',
        closing:'欢迎来到 Sweet Spot！'
      }
    };
    var copy=copies[lang]||copies.en;

    var story=company.querySelector('.company-foundation-story');
    if(!story){
      var list=company.querySelector('.company-intro-list');
      if(!list)return;

      story=document.createElement('div');
      story.className='company-foundation-story';
      story.setAttribute('aria-labelledby','company-foundation-story-title');
      list.insertAdjacentElement('afterend',story);
    }

    story.hidden=false;
    if(story.getAttribute('data-ss-story-lang')===lang)return;

    story.setAttribute('data-ss-story-lang',lang);
    story.setAttribute('lang',copy.htmlLang);
    story.textContent='';

    var foundation=document.createElement('section');
    foundation.className='company-story-panel company-story-foundation';

    var foundationEyebrow=document.createElement('div');
    foundationEyebrow.className='company-story-eyebrow';
    var foundationIndex=document.createElement('span');
    foundationIndex.className='company-story-index';
    foundationIndex.textContent='01';
    var foundationKicker=document.createElement('span');
    foundationKicker.className='company-story-kicker';
    foundationKicker.textContent='FOUNDATION / PURPOSE';
    foundationEyebrow.appendChild(foundationIndex);
    foundationEyebrow.appendChild(foundationKicker);
    foundation.appendChild(foundationEyebrow);

    var heading=document.createElement('h3');
    heading.id='company-foundation-story-title';
    heading.textContent=copy.foundationHeading;
    foundation.appendChild(heading);

    var intro=appendStoryParagraph(foundation,copy.intro);
    intro.className='company-story-intro';
    appendStoryParagraph(foundation,copy.first);
    appendStoryParagraph(foundation,copy.second);
    story.appendChild(foundation);

    var origin=document.createElement('section');
    origin.className='company-story-panel company-story-origin';

    var originEyebrow=document.createElement('div');
    originEyebrow.className='company-story-eyebrow';
    var originIndex=document.createElement('span');
    originIndex.className='company-story-index';
    originIndex.textContent='02';
    var originKicker=document.createElement('span');
    originKicker.className='company-story-kicker';
    originKicker.textContent='NAME / LOGO';
    originEyebrow.appendChild(originIndex);
    originEyebrow.appendChild(originKicker);
    origin.appendChild(originEyebrow);

    var originHeading=document.createElement('h3');
    originHeading.className='company-story-origin-title';
    originHeading.textContent=copy.originHeading;
    origin.appendChild(originHeading);

    var logoStage=document.createElement('div');
    logoStage.className='company-story-logo-stage';
    var logo=document.createElement('img');
    logo.className='company-story-logo';
    logo.src='assets/images/site-e8a84d6c8ba9.webp';
    logo.alt=copy.logoAlt;
    logo.loading='lazy';
    logo.decoding='async';
    logoStage.appendChild(logo);
    origin.appendChild(logoStage);

    var nameParagraph=document.createElement('p');
    nameParagraph.className='company-story-origin-copy';
    nameParagraph.appendChild(document.createTextNode(copy.namePrefix));
    var serape=document.createElement('em');
    serape.textContent=copy.nameTerm;
    nameParagraph.appendChild(serape);
    nameParagraph.appendChild(document.createTextNode(copy.nameSuffix));
    origin.appendChild(nameParagraph);

    var closing=appendStoryParagraph(origin,copy.closing);
    closing.className='company-story-closing';
    story.appendChild(origin);
  }'''
          js = js[:start] + new_function + js[end:]
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('assets/case-study-split.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Company Foundation Story — full-text editorial block */'
          if marker not in css:
              raise SystemExit('Foundation Story CSS marker not found')
          css = css.split(marker, 1)[0].rstrip() + '\n\n' + r'''/* Company Foundation Story — two-part editorial identity block */
#company .company-foundation-story[hidden]{
  display:none!important;
}

#company .company-foundation-story{
  position:relative;
  z-index:2;
  display:grid;
  gap:22px;
  width:min(100%,1040px);
  margin:42px auto 0;
}

#company .company-story-panel{
  position:relative;
  overflow:hidden;
  padding:clamp(30px,4vw,46px);
  border:1px solid rgba(255,255,255,.12);
  background:
    radial-gradient(circle at 92% 10%,rgba(215,169,54,.12),transparent 30%),
    linear-gradient(135deg,rgba(255,255,255,.035),rgba(10,102,194,.025) 58%,rgba(215,169,54,.035));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 20px 55px rgba(0,0,0,.16);
}

#company .company-story-foundation::before,
#company .company-story-origin::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:linear-gradient(180deg,var(--gold),rgba(215,169,54,.08));
}

#company .company-story-panel::after{
  position:absolute;
  right:24px;
  top:14px;
  color:rgba(255,255,255,.025);
  font-size:clamp(74px,10vw,118px);
  font-weight:950;
  line-height:1;
  letter-spacing:-.08em;
  pointer-events:none;
}

#company .company-story-foundation::after{content:"01"}
#company .company-story-origin::after{content:"02"}

#company .company-story-eyebrow{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:16px;
  position:relative;
  z-index:1;
}

#company .company-story-index{
  color:var(--gold);
  font:900 10px/1 monospace;
}

#company .company-story-kicker{
  color:#9da7b4;
  font-size:9px;
  font-weight:900;
  letter-spacing:.16em;
}

#company .company-foundation-story h3{
  position:relative;
  z-index:1;
  max-width:820px;
  margin:0 0 20px;
  color:#fff;
  font-size:clamp(27px,3vw,38px);
  font-weight:850;
  line-height:1.14;
  letter-spacing:-.035em;
}

#company .company-foundation-story p{
  position:relative;
  z-index:1;
  margin:0;
  max-width:900px;
  color:#cbd2db;
  font-size:clamp(15px,1.12vw,17px);
  font-weight:400;
  line-height:1.82;
}

#company .company-foundation-story p+p{
  margin-top:18px;
}

#company .company-story-intro{
  max-width:860px!important;
  margin-bottom:20px!important;
  color:#fff!important;
  font-size:clamp(17px,1.45vw,20px)!important;
  font-weight:650!important;
  line-height:1.62!important;
}

#company .company-story-origin{
  background:
    radial-gradient(circle at 50% 40%,rgba(215,169,54,.10),transparent 31%),
    linear-gradient(135deg,rgba(12,18,27,.96),rgba(8,12,18,.98));
}

#company .company-story-logo-stage{
  position:relative;
  z-index:1;
  display:grid;
  place-items:center;
  min-height:220px;
  margin:8px 0 26px;
  border-top:1px solid rgba(255,255,255,.08);
  border-bottom:1px solid rgba(255,255,255,.08);
  background:radial-gradient(circle at center,rgba(215,169,54,.10),transparent 58%);
}

#company .company-story-logo{
  display:block;
  width:clamp(150px,18vw,220px);
  aspect-ratio:1;
  object-fit:cover;
  border:1px solid rgba(255,235,137,.38);
  border-radius:18px;
  box-shadow:0 26px 70px rgba(0,0,0,.38),0 0 44px rgba(215,169,54,.10);
}

#company .company-foundation-story em{
  color:#fff;
  font-style:italic;
}

#company .company-story-closing{
  margin-top:24px!important;
  color:var(--gold-pale)!important;
  font-size:clamp(16px,1.3vw,19px)!important;
  font-weight:850!important;
  letter-spacing:.01em;
}

@media(max-width:760px){
  #company .company-foundation-story{
    gap:16px;
    margin-top:30px;
  }

  #company .company-story-panel{
    padding:24px 18px 26px;
  }

  #company .company-story-panel::after{
    right:14px;
    top:12px;
    font-size:70px;
  }

  #company .company-story-eyebrow{
    margin-bottom:13px;
  }

  #company .company-foundation-story h3{
    max-width:88%;
    margin-bottom:17px;
    font-size:24px;
    line-height:1.2;
  }

  #company .company-foundation-story p{
    font-size:15px;
    line-height:1.72;
  }

  #company .company-story-intro{
    font-size:17px!important;
    line-height:1.58!important;
    margin-bottom:17px!important;
  }

  #company .company-story-logo-stage{
    min-height:180px;
    margin:4px 0 21px;
  }

  #company .company-story-logo{
    width:min(52vw,180px);
    border-radius:14px;
  }
}
''' + '\n'
          css_path.write_text(css, encoding='utf-8')

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          old = 'assets/site-enhancements.js?v=foundation-i18n-20260907'
          new = 'assets/site-enhancements.js?v=foundation-story-design-20260907'
          if old not in html:
              raise SystemExit('Expected site enhancements version URL not found')
          if html.count(old) != 1:
              raise SystemExit('Expected exactly one site enhancements version URL')
          html_path.write_text(html.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate staged changes
        run: |
          node --check assets/site-enhancements.js
          grep -Fq "foundationHeading:'Foundation Story and Purpose'" assets/site-enhancements.js
          grep -Fq "originHeading:'The Origin of the “Sweet Spot” Name and Logo'" assets/site-enhancements.js
          grep -Fq "logo.src='assets/images/site-e8a84d6c8ba9.webp'" assets/site-enhancements.js
          grep -Fq "company-story-logo-stage" assets/case-study-split.css
          grep -Fq "foundation-story-design-20260907" index.html
          ! grep -Fq "heading:'Sweet Spot’s Foundation Story and Purpose'" assets/site-enhancements.js

      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-enhancements.js assets/case-study-split.css index.html
          git commit -m "content: redesign Foundation Story section"
          git push
