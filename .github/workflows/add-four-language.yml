name: Add four-language Chinese switch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-four-language.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Traditional and Simplified Chinese language modes
        shell: bash
        run: echo ' ...REDACTED_FOR_DISPLAY...JykKc3VicHJvY2Vzcy5ydW4oWydub2RlJywnLS1jaGVjaycsc3RyKHRtcCldLGNoZWNrPVRydWUpCnRtcC51bmxpbmsoKQoKcHJpbnQoJ0ZvdXItbGFuZ3VhZ2Ugc3dpdGNoIGFuZCBUcmFkaXRpb25hbCBDaGluZXNlIG1vZGUgaW5zdGFsbGVkLicpCg==' | base64 -d | python
      - name: Commit language update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f .github/workflows/add-four-language.yml
          git commit -m 'Add Traditional Chinese language option'
          git push
