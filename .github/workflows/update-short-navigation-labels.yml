name: Update short navigation labels
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update navigation
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='index.html';
          let s=fs.readFileSync(path,'utf8');
          const newNav=String.raw`let e=[["points",{en:"Difference",ja:"\u5F37\u307F",zh:"\u4F18\u52BF"}],["founder",{en:"Founder",ja:"\u5275\u8A2D\u8005",zh:"\u521B\u529E\u4EBA"}],["network",{en:"Network",ja:"\u30CD\u30C3\u30C8\u30EF\u30FC\u30AF",zh:"\u5408\u4F5C\u7F51\u7EDC"}],["capabilities",{en:"Capabilities",ja:"\u5B9F\u884C\u529B",zh:"\u6267\u884C\u80FD\u529B"}],["offers",{en:"Solution",ja:"\u30BD\u30EA\u30E5\u30FC\u30B7\u30E7\u30F3",zh:"\u89E3\u51B3\u65B9\u6848"}]]`;
          if(!s.includes(newNav)){
            const pattern=/let e=\[\["points",\{en:"Points of Difference"[\s\S]*?\]\];return/;
            if(!pattern.test(s)) throw new Error('Current navigation data not found');
            s=s.replace(pattern,newNav+';return');
          }
          fs.writeFileSync(path,s);
          NODE
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-short-navigation-labels.yml
          git add index.html
          git commit -m "Update navigation labels and links"
          git push
