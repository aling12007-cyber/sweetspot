name: Update homepage CTA and Case Study title
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-home-copy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update only requested homepage copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          start = '<!-- Requested homepage copy overrides START -->'
          end = '<!-- Requested homepage copy overrides END -->'

          if start in text:
              a = text.index(start)
              b = text.index(end, a) + len(end)
              text = text[:a] + text[b:]

          lines = [
              '<!-- Requested homepage copy overrides START -->',
              '<script id="requested-home-copy-overrides">',
              '(function(){',
              '  var ctaMap={"Company Features":"Company Introduction","会社の特徴":"会社紹介","公司特色":"公司介紹"};',
              '  var caseMap={"Case Study Apple":"Case Study: Apple","ケーススタディ Apple":"ケーススタディ：Apple","案例研究 Apple":"案例研究：Apple"};',
              '  function patchTextNodes(el,map){',
              '    var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);',
              '    var n;',
              '    while((n=w.nextNode())){',
              '      var raw=n.nodeValue||"";',
              '      var trimmed=raw.trim();',
              '      if(Object.prototype.hasOwnProperty.call(map,trimmed)){',
              '        n.nodeValue=raw.replace(trimmed,map[trimmed]);',
              '      }',
              '    }',
              '  }',
              '  function apply(){',
              '    document.querySelectorAll("a,button").forEach(function(el){patchTextNodes(el,ctaMap);});',
              '    var scope=document.querySelector("#capabilities");',
              '    if(scope){scope.querySelectorAll("h1,h2,h3,.hierarchy-heading").forEach(function(el){patchTextNodes(el,caseMap);});}',
              '  }',
              '  if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",apply,{once:true});}else{apply();}',
              '  var queued=false;',
              '  new MutationObserver(function(){',
              '    if(queued)return;',
              '    queued=true;',
              '    requestAnimationFrame(function(){queued=false;apply();});',
              '  }).observe(document.documentElement,{subtree:true,childList:true,characterData:true});',
              '})();',
              '</script>',
              '<!-- Requested homepage copy overrides END -->',
          ]
          script = '\n'.join(lines)

          if '</body>' not in text:
              raise SystemExit('Could not find </body> insertion point')
          text = text.replace('</body>', script + '\n</body>', 1)

          for expected in ['Company Introduction','Case Study: Apple','会社紹介','ケーススタディ：Apple','公司介紹','案例研究：Apple']:
              if expected not in text:
                  raise SystemExit(f'Missing expected copy: {expected}')

          p.write_text(text, encoding='utf-8')
          PY

          git diff -- index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/update-home-copy.yml
          git add index.html
          git commit -m 'Update homepage CTA and Case Study title'
          git push
