name: One-time reference major headings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reference-major-headings.yml'

permissions:
  contents: write

jobs:
  update-headings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reference major heading format
        shell: bash
        run: echo '' | base64 -d | python
      - name: Commit website update and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reference-major-headings.yml
          git add index.html
          git commit -m "Apply Insights-style heading format sitewide"
          git push
