name: Inspect heading DOM
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-heading-dom.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract heading snippets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          needles=['Company Features','Broad Influence and Access','Insights & Perspectives','section-title','section-heading-row','section-kicker-icon','hierarchy-kicker-row']
          out=[]
          for n in needles:
              out.append('\n===== '+n+' =====\n')
              pos=0
              hits=0
              while True:
                  i=t.find(n,pos)
                  if i<0 or hits>=8: break
                  a=max(0,i-700); b=min(len(t),i+1200)
                  out.append(t[a:b].replace('><','>\n<'))
                  out.append('\n---\n')
                  pos=i+len(n); hits+=1
              out.append(f'HITS={hits}\n')
          Path('.github/heading-diag.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-heading-dom.yml
          git add .github/heading-diag.txt
          git commit -m "Inspect heading markup"
          git push
