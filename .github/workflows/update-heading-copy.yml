name: Update unified heading copy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-heading-copy.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update heading hierarchy copy only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- SS SINGLE UNIFIED SECTION HEADING START -->'
          if marker not in s:
              raise SystemExit('Unified heading system not found')
          anchor='  var queued=false;'
          if anchor not in s:
              raise SystemExit('Unified heading anchor not found')
          if 'var ssHeadingCopy={' not in s:
              insert=r'''  var ssHeadingCopy={
            en:{
              points:['Difference','Points of Difference',''],
              experience:['Career','Professional Journey','Built across APAC'],
              network:['Network','Broad Influence and Access','Services rendered to:'],
              capabilities:['Case','Case Study Apple','Demonstrated high-level facilitation capability']
            },
            ja:{
              points:['差別化','私たちの強み',''],
              experience:['キャリア','プロフェッショナル・ジャーニー','APACで築いたキャリア'],
              network:['ネットワーク','幅広い影響力とアクセス','サービス提供先：'],
              capabilities:['ケース','ケーススタディ Apple','高水準のファシリテーション能力を実証']
            },
            zh:{
              points:['差異','核心優勢',''],
              experience:['職涯','專業歷程','深耕亞太地區'],
              network:['網絡','廣泛的影響力與資源管道','曾服務的對象包括：'],
              capabilities:['案例','案例研究 Apple','展現高水準的協調促成能力']
            }
          };
          function ssHeadingLang(data){
            var probe=[data.kicker||'',data.title||'',data.support||''].join(' ');
            if(/[\u3040-\u30ff]/.test(probe))return 'ja';
            if(/[\u4e00-\u9fff]/.test(probe))return 'zh';
            var hl=(document.documentElement.getAttribute('lang')||'').toLowerCase();
            if(hl.indexOf('ja')===0)return 'ja';
            if(hl.indexOf('zh')===0)return 'zh';
            return 'en';
          }
          function ssApplyHeadingCopy(d,data){
            var lang=ssHeadingLang(data);
            var row=(ssHeadingCopy[lang]&&ssHeadingCopy[lang][d.id])||(ssHeadingCopy.en&&ssHeadingCopy.en[d.id]);
            if(!row)return data;
            return {kicker:row[0],title:row[1],support:row[2]||''};
          }
          '''
              s=s.replace(anchor,insert+anchor,1)
          old='      make(section,src,d,extract(src,d));'
          new='      var data=ssApplyHeadingCopy(d,extract(src,d));\n      make(section,src,d,data);'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Unified heading render call not found')
          p.write_text(s,encoding='utf-8')
          required=[
            "points:['Difference','Points of Difference','']",
            "experience:['Career','Professional Journey','Built across APAC']",
            "network:['Network','Broad Influence and Access','Services rendered to:']",
            "capabilities:['Case','Case Study Apple','Demonstrated high-level facilitation capability']",
            "var data=ssApplyHeadingCopy(d,extract(src,d));"
          ]
          out=p.read_text(encoding='utf-8')
          missing=[x for x in required if x not in out]
          if missing: raise SystemExit('Missing expected heading copy: '+repr(missing))
          print('Heading copy map updated; unified visual system preserved.')
          PY
      - name: Commit heading copy update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f --ignore-unmatch .github/workflows/update-heading-copy.yml
          git commit -m 'Set consistent three-level heading copy'
          git push
