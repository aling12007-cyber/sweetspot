name: Tighten founder career spacing
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce vertical spacing
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='index.html';
          let s=fs.readFileSync(path,'utf8');
          const replacements=[
            ['.founder-section{padding-bottom:42px}','.founder-section{padding-bottom:14px}'],
            ['#experience{padding-top:34px;border-top:0}','#experience{padding-top:18px;border-top:0}'],
            ['#experience .section-title>div:first-child>span:empty{display:none}','#experience .section-title>div:first-child>span:empty{display:none}\n#experience .section-title{margin-bottom:14px}']
          ];
          for(const [from,to] of replacements){
            if(!s.includes(to)){
              if(!s.includes(from)) throw new Error('Spacing rule not found: '+from);
              s=s.replace(from,to);
            }
          }
          fs.writeFileSync(path,s);
          NODE
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tighten-founder-career-spacing.yml
          git add index.html
          git commit -m "Reduce spacing around career playbook"
          git push
