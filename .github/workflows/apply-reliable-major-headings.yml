name: Apply reliable major headings
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-reliable-major-headings.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply rebuilt major headings
        shell: bash
        run: echo '"Q29tcGFueSIsIGphOiLkvJrnpL4iLCB6aDoi5YWs5Y- 響力とアクセス", zh:"廣泛的影響力與資源管道"},
      support:{en:"Services rendered to:", ja:"サービス提供先：", zh:"曾服務的對象包括："}
    }
  };

  function currentLang(){
    var lang=(document.documentElement.lang||"en").toLowerCase();
    if(lang.indexOf("ja")===0) return "ja";
    if(lang.indexOf("zh")===0) return "zh";
    return "en";
  }

  function setText(el, value){
    if(el && el.textContent !== value) el.textContent = value;
  }

  function applyOne(id){
    var section=document.getElementById(id);
    if(!section) return;
    var source=section.querySelector(":scope > .section-title") || section.querySelector(".section-title");
    if(!source) return;

    source.classList.add("major-source-title-hidden");

    var custom=section.querySelector(":scope > .major-insights-title[data-major-id='"+id+"']");
    if(!custom){
      custom=document.createElement("div");
      custom.className="major-insights-title";
      custom.setAttribute("data-major-id", id);
      custom.innerHTML=
        '<div class="major-kicker-row"><span class="major-kicker-line" aria-hidden="true"></span><p class="major-kicker"></p></div>'+
        '<h2></h2>'+
        (id==="network" ? '<p class="major-support"></p>' : '');
      section.insertBefore(custom, source);
    }

    var lang=currentLang();
    setText(custom.querySelector(".major-kicker"), copy[id].kicker[lang] || copy[id].kicker.en);
    setText(custom.querySelector("h2"), copy[id].title[lang] || copy[id].title.en);
    if(copy[id].support){
      setText(custom.querySelector(".major-support"), copy[id].support[lang] || copy[id].support.en);
    }
  }

  function apply(){
    applyOne("company");
    applyOne("network");
  }

  var queued=false;
  function queue(){
    if(queued) return;
    queued=true;
    requestAnimationFrame(function(){
      queued=false;
      apply();
    });
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded", queue, {once:true});
  } else {
    queue();
  }

  new MutationObserver(queue).observe(document.body,{childList:true,subtree:true,characterData:true});
  document.addEventListener("click",function(e){
    if(e.target.closest && e.target.closest(".lang-switch")) setTimeout(queue,0);
  });
})();
</script>
<!-- Reliable major Insights headings END -->
