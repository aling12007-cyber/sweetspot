name: Increase partner card typography
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase partner typography by twenty percent
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),p='index.html'; let s=fs.readFileSync(p,'utf8');
          const needle='.partner-grid p,.partner-grid li{color:#9da8b6;font-size:13px;line-height:1.58}';
          const rules=needle+'\n/* 20% typography increase: partner cards */\n.partner-icon{font-size:10.8px}\n.partner-grid h3{font-size:22.8px}\n.partner-grid h4{font-size:14.4px}\n.partner-grid p,.partner-grid li{font-size:15.6px}\n.partner-grid li:before{font-size:9.6px}';
          if(!s.includes('/* 20% typography increase: partner cards */')){
            if(!s.includes(needle)) throw new Error('Partner typography insertion point not found');
            s=s.replace(needle,rules);
          }
          fs.writeFileSync(p,s);
          NODE
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/increase-partner-card-typography.yml
          git add index.html
          git commit -m "Increase partner card typography by 20 percent"
          git push
