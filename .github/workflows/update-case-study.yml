name: Update Case Study Apple section
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update case study and remove Customized Solutions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Keep the existing design, but make the capability grid fit the four requested items.
          s = s.replace('.capability-grid{grid-template-columns:repeat(5,1fr)}', '.capability-grid{grid-template-columns:repeat(4,1fr)}')

          # Remove the now-deleted Solutions navigation item.
          nav_item = ',["offers",{en:"Solution",ja:"ソリューション",zh:"解决方案"}]'
          s = s.replace(nav_item, '')

          cap_start_marker = '(0,f.jsxs)("section",{id:"capabilities",className:"content-section section-shell"'
          offers_marker = ',(0,f.jsx)("section",{id:"offers",className:"content-section offers-section"'
          insights_marker = ',(0,f.jsxs)("section",{id:"insights",className:"content-section section-shell insights-section"'

          cap_start = s.find(cap_start_marker)
          if cap_start < 0:
              raise SystemExit('capabilities section start not found')
          offers_start = s.find(offers_marker, cap_start)
          if offers_start < 0:
              raise SystemExit('offers section start not found')

          new_cap = '''(0,f.jsxs)("section",{id:"capabilities",className:"content-section section-shell",children:[(0,f.jsx)(vu,{number:"04",kicker:{en:"Case Study: Apple",ja:"ケーススタディ：Apple",zh:"案例研究：Apple"},title:{en:"Demonstrated high-level facilitation capability:",ja:"高水準のファシリテーション能力を実証：",zh:"展現高水準的協調促成能力："},lang:l}),(0,f.jsxs)("div",{className:"capability-grid",children:[(0,f.jsxs)("article",{children:[(0,f.jsx)("h3",{children:z(l,{en:"Receive and delivered on urgent brief within two hours.",ja:"緊急の依頼を受け、2時間以内に対応・納品。",zh:"收到緊急任務後，在兩小時內完成並交付。"})}),(0,f.jsx)("span",{children:"01"})]}),(0,f.jsxs)("article",{children:[(0,f.jsx)("h3",{children:z(l,{en:"Ensured authentic and scandal-free talent selection with Hanshin Tigers Legend.",ja:"阪神タイガースのレジェンドを起用し、真正性が高くスキャンダルのない人選を実現。",zh:"確保選用的阪神虎傳奇球星形象真實可信且無負面爭議。"})}),(0,f.jsx)("span",{children:"02"})]}),(0,f.jsxs)("article",{children:[(0,f.jsx)("h3",{children:z(l,{en:"Clear communication with all parties.",ja:"すべての関係者と明確にコミュニケーション。",zh:"與所有相關方保持清楚明確的溝通。"})}),(0,f.jsx)("span",{children:"03"})]}),(0,f.jsxs)("article",{children:[(0,f.jsx)("h3",{children:z(l,{en:"Created a viral PR moment for Global CEO Tim Cook’s visit to Osaka.",ja:"グローバルCEO Tim Cookの大阪訪問で、広く拡散されるPRモーメントを創出。",zh:"為全球 CEO Tim Cook 的大阪之行創造了引發廣泛傳播的公關話題。"})}),(0,f.jsx)("span",{children:"04"})]})]})]})'''

          s = s[:cap_start] + new_cap + s[offers_start:]

          # Remove the full Customized Solutions section and its related CTA block.
          offers_start = s.find(offers_marker, cap_start)
          insights_start = s.find(insights_marker, offers_start)
          if offers_start < 0 or insights_start < 0:
              raise SystemExit('offers/insights boundary not found')
          s = s[:offers_start] + s[insights_start:]

          p.write_text(s, encoding='utf-8')

          updated = p.read_text(encoding='utf-8')
          cap_end = updated.find(insights_marker, updated.find(cap_start_marker))
          cap_section = updated[updated.find(cap_start_marker):cap_end]
          required = [
              'Case Study: Apple',
              'Demonstrated high-level facilitation capability:',
              'Receive and delivered on urgent brief within two hours.',
              'Ensured authentic and scandal-free talent selection with Hanshin Tigers Legend.',
              'Clear communication with all parties.',
              'Created a viral PR moment for Global CEO Tim Cook’s visit to Osaka.'
          ]
          for text in required:
              if text not in cap_section:
                  raise SystemExit('Missing required text: ' + text)
          for text in ['Customized Solutions', 'Sweet Spot Offers Customized Solutions', 'href:"#offers"', 'id:"offers"']:
              if text in updated:
                  raise SystemExit('Removed Solutions content still present: ' + text)
          PY
      - name: Commit website change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/update-case-study.yml || true
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Apple case study and remove Customized Solutions"
          git push