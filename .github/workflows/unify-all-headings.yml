name: Unify all six headings
on:
  push:
    branches: [main]
    paths: ['.github/workflows/unify-all-headings.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and verify all six headings
        run: python .github/scripts/unify_all_headings.py
      - name: Commit verified website update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm --ignore-unmatch .github/workflows/unify-all-headings.yml .github/scripts/unify_all_headings.py
          git commit -m 'Unify all six section headings to Insights style'
          git push
