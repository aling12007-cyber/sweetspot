name: Move contact into navigation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move contact button
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),p='index.html'; let s=fs.readFileSync(p,'utf8');
          const oldHeader=String.raw`(0,f.jsx)("nav",{"aria-label":"Main navigation",children:e.map(([n,i])=>(0,f.jsx)("a",{href:"#"+n,children:z(l,i)},n))}),(0,f.jsxs)("div",{className:"header-actions",children:[(0,f.jsx)("div",{className:"lang-switch","aria-label":"Language",children:["en","ja","zh"].map(n=>(0,f.jsx)("button",{className:l===n?"active":"",onClick:()=>t(n),"aria-pressed":l===n,children:n==="en"?"EN":n==="ja"?"\u65E5":"\u4E2D"},n))}),(0,f.jsx)("a",{className:"contact-mini",href:"#contact",children:z(l,{en:"Contact",ja:"\u304A\u554F\u3044\u5408\u308F\u305B",zh:"\u806F\u7D61"})})]})`;
          const newHeader=String.raw`(0,f.jsxs)("nav",{"aria-label":"Main navigation",children:[e.map(([n,i])=>(0,f.jsx)("a",{href:"#"+n,children:z(l,i)},n)),(0,f.jsx)("a",{className:"contact-mini",href:"#contact",children:z(l,{en:"Contact",ja:"\u304A\u554F\u3044\u5408\u308F\u305B",zh:"\u806F\u7D61"})})]}),(0,f.jsx)("div",{className:"header-actions",children:(0,f.jsx)("div",{className:"lang-switch","aria-label":"Language",children:["en","ja","zh"].map(n=>(0,f.jsx)("button",{className:l===n?"active":"",onClick:()=>t(n),"aria-pressed":l===n,children:n==="en"?"EN":n==="ja"?"\u65E5":"\u4E2D"},n))})})`;
          if(!s.includes(newHeader)){
            if(!s.includes(oldHeader)) throw new Error('Header navigation block not found');
            s=s.replace(oldHeader,newHeader);
          }
          fs.writeFileSync(p,s);
          NODE
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/move-contact-into-navigation.yml
          git add index.html
          git commit -m "Move contact button into main navigation"
          git push
