name: Temporary i18n audit patch
on:
  push:
    branches:
      - fix/i18n-audit-20260907
    paths:
      - '.github/workflows/temp-i18n-audit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/i18n-audit-20260907
      - name: Apply translation audit fixes
        shell: bash
        run: |
          python .github/apply-i18n-audit.py
          node --check assets/site-enhancements.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('assets/site-enhancements.js').read_text(encoding='utf-8')
          required=[
            "ja:{home:'ホーム',introduction:'会社紹介'",
            "zhtw:{home:'首頁',introduction:'公司簡介'",
            "zhcn:{home:'首页',introduction:'公司简介'",
            "foundation:'FOUNDATION / PURPOSE'",
            "focusHeading.textContent=focusLabels[lang]||focusLabels.en;",
            "differenceHeading.textContent=differenceLabels[lang]||differenceLabels.en;",
            "閱讀更多創辦人的職涯",
            "創業者の経歴をもっと見る"
          ]
          for item in required:
              assert item in s, item
          assert 'FUNDATION/PURPOSE' not in s
          print('i18n audit checks passed')
          PY
      - name: Commit audited translations
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site-enhancements.js index.html
          git commit -m 'fix: localize navigation and new section copy'
          git push origin HEAD:fix/i18n-audit-20260907
