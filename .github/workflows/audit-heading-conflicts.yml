name: Audit heading conflicts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-heading-conflicts.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect heading-related injected rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          pats=[
            r'/\*[^*]{0,240}(?:heading|Heading|Insights|hierarchy|Hierarchy)[^*]{0,240}\*/',
            r'<!--[^>]{0,240}(?:heading|Heading|Insights|hierarchy|Hierarchy)[^>]{0,240}-->'
          ]
          seen=[]
          for pat in pats:
            for m in re.finditer(pat,s,re.I|re.S):
              t=' '.join(m.group(0).split())
              if t not in seen:
                seen.append(t)
          print('MARKERS')
          for t in seen: print(t)
          print('COUNTS')
          for token in ['exact-insights-heading','major-insights-title','hierarchy-applied','heading-ref-row','major-kicker-row','hierarchy-kicker-row','section-title','insight-intro']:
            print(token, s.count(token))
          PY
