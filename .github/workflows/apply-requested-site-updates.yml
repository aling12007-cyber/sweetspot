name: Apply requested Sweet Spot updates

on:
  push:
    branches:
      - chatgpt/contact-case-study-layout

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/contact-case-study-layout

      - name: Update URLs, CTA and case study layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # 1) Fix every stale GitHub Pages path reference.
          text = text.replace('/sweetspottest4/', '/sweetspot/')

          # Remove a previous copy if this workflow is ever re-run manually.
          text = re.sub(
              r'\n<!-- REQUESTED SITE UPDATE V2 START -->.*?<!-- REQUESTED SITE UPDATE V2 END -->\n',
              '\n',
              text,
              flags=re.S,
          )

          block = r'''
<!-- REQUESTED SITE UPDATE V2 START -->
<style id="requested-site-update-v2-styles">
/* Desktop Case Study: editorial split layout — copy left, image right. */
#capabilities .case-study-split{
  display:grid;
  grid-template-columns:minmax(0,.88fr) minmax(380px,1.12fr);
  gap:clamp(34px,5vw,72px);
  align-items:center;
  margin:0 0 44px;
  padding:clamp(30px,3.6vw,48px);
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.13);
  background:linear-gradient(135deg,rgba(215,169,54,.075),rgba(10,102,194,.045) 56%,rgba(255,255,255,.018));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}
#capabilities .case-study-split:before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:linear-gradient(180deg,var(--gold),rgba(215,169,54,.08));
}
#capabilities .case-study-copy{min-width:0;position:relative;z-index:1}
#capabilities .case-study-copy .section-title,
#capabilities .case-study-copy .ss-unified-heading{
  margin:0!important;
  padding:0!important;
  width:100%!important;
}
#capabilities .case-study-media{
  margin:0;
  width:100%;
  aspect-ratio:16/10;
  min-height:300px;
  max-height:420px;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(215,169,54,.38);
  background:#0d1118;
  box-shadow:0 24px 64px rgba(0,0,0,.34);
  clip-path:polygon(0 0,96% 0,100% 8%,100% 100%,0 100%);
}
#capabilities .case-study-media:after{
  content:"CASE STUDY / APPLE";
  position:absolute;
  right:14px;
  bottom:12px;
  z-index:2;
  padding:7px 9px;
  color:#0a0c10;
  background:rgba(215,169,54,.94);
  font-size:9px;
  font-weight:900;
  letter-spacing:.12em;
}
#capabilities .case-study-media img{
  display:block!important;
  width:100%!important;
  height:100%!important;
  object-fit:cover!important;
  object-position:center!important;
}
@media(max-width:900px){
  #capabilities .case-study-split{
    grid-template-columns:1fr;
    gap:24px;
    padding:24px;
    margin-bottom:30px;
  }
  #capabilities .case-study-media{
    min-height:0;
    max-height:none;
    aspect-ratio:16/10;
  }
}
@media(max-width:600px){
  #capabilities .case-study-split{padding:18px;gap:20px}
  #capabilities .case-study-media{aspect-ratio:4/3}
  #capabilities .case-study-media:after{right:10px;bottom:9px;font-size:8px}
}
</style>
<script id="requested-site-update-v2-script">
(function(){
  var applying=false;
  function language(){
    var lang=(document.documentElement.lang||'en').toLowerCase();
    return lang.indexOf('ja')===0?'ja':lang.indexOf('zh')===0?'zh':'en';
  }
  function patchHeroCTA(){
    var cta=document.querySelector('#home .hero-cta a');
    if(!cta)return;
    var labels={en:"Let's Connect",ja:"お問い合わせ",zh:"聯絡我們"};
    var label=labels[language()];
    if(cta.getAttribute('href')!=='#contact')cta.setAttribute('href','#contact');
    var textNode=null;
    for(var i=0;i<cta.childNodes.length;i++){
      if(cta.childNodes[i].nodeType===Node.TEXT_NODE){textNode=cta.childNodes[i];break;}
    }
    if(textNode){if((textNode.nodeValue||'').trim()!==label)textNode.nodeValue=label;}
    else if(!cta.textContent.includes(label)){cta.insertBefore(document.createTextNode(label),cta.firstChild);}
  }
  function patchCaseStudy(){
    var scope=document.querySelector('#capabilities');
    if(!scope)return;
    if(scope.querySelector('.case-study-split'))return;

    var heading=scope.querySelector('.ss-unified-heading[data-ss-section="capabilities"], .section-title');
    if(!heading)return;

    var image=scope.querySelector('img[data-case-study-activity="1"]');
    if(!image){
      image=document.createElement('img');
      image.src='assets/case-study-activity.webp';
      image.alt='Apple case study activity';
      image.loading='lazy';
      image.setAttribute('data-case-study-activity','1');
    } else if(!image.alt) {
      image.alt='Apple case study activity';
    }

    var split=document.createElement('div');
    split.className='case-study-split';
    var copy=document.createElement('div');
    copy.className='case-study-copy';
    var media=document.createElement('figure');
    media.className='case-study-media';

    heading.parentNode.insertBefore(split,heading);
    copy.appendChild(heading);
    media.appendChild(image);
    split.appendChild(copy);
    split.appendChild(media);
  }
  function apply(){
    if(applying)return;
    applying=true;
    try{patchHeroCTA();patchCaseStudy();}finally{applying=false;}
  }
  function queue(){setTimeout(apply,0)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply,{once:true});
  else apply();
  new MutationObserver(queue).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['lang','href','data-ss-lang-mode']});
  document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('.lang-switch'))setTimeout(apply,0)});
})();
</script>
<!-- REQUESTED SITE UPDATE V2 END -->
'''

          if '</body>' not in text:
              raise SystemExit('Could not find </body> in index.html')
          text = text.replace('</body>', block + '\n</body>', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-requested-site-updates.yml

      - name: Commit requested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Contact CTA and Case Study layout"
          git push origin HEAD:chatgpt/contact-case-study-layout
