name: Temporary Work With Us section patch
on:
  push:
    branches: [feat/work-with-us-section-20260907]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/work-with-us-section-20260907
      - name: Apply patch
        run: python .github/scripts/temp_work_with_us_patch.py
      - name: Verify patch
        run: |
          grep -F "function patchWorkWithUs(){" assets/site-enhancements.js
          grep -F "{href:'#work-with-us',label:c.workWithUs,classes:'nav-level-1'}" assets/site-enhancements.js
          grep -F "When to Talk to Sweet Spot" assets/site-enhancements.js
          grep -F "/* Work With Us conversion section */" assets/case-study-split.css
          grep -F "site-enhancements.js?v=work-with-us-20260907" index.html
          grep -F "case-study-split.css?v=work-with-us-20260907" index.html
          git diff --check
      - name: Commit site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-enhancements.js assets/case-study-split.css index.html
          git commit -m "feat: add Work With Us section"
          git push origin HEAD:feat/work-with-us-section-20260907
