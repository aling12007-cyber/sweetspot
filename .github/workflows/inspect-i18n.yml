name: Inspect i18n
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print i18n snippets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          patterns=['translations','i18n','language','lang-switch','zh','ja','日本','中文','Sports Business Strategy','Meet the Founder','Network & Influence','Demonstrated Capabilities']
          for pat in patterns:
              print('\n###',pat)
              start=0
              count=0
              while True:
                  i=s.find(pat,start)
                  if i<0 or count>=8: break
                  print(s[max(0,i-500):min(len(s),i+1200)].replace('\n','\\n'))
                  print('---')
                  start=i+len(pat); count+=1
          PY