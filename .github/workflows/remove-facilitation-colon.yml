name: One-time remove facilitation colon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-facilitation-colon.yml'

permissions:
  contents: write

jobs:
  patch-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove colon from facilitation heading only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = 'Demonstrated high-level facilitation capability:'
          new = 'Demonstrated high-level facilitation capability'

          if old not in text:
              raise SystemExit('Expected facilitation heading not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove colon from facilitation heading"
          git push
