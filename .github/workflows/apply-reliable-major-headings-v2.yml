name: Apply reliable major headings v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-reliable-major-headings-v2.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply rebuilt major headings
        shell: bash
        run: echo '' | base64 -d | gzip -d | python
      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-reliable-major-headings-v2.yml
          git rm -f .github/workflows/apply-reliable-major-headings.yml
          git rm -f .github/heading-diag.txt
          git add index.html
          git commit -m "Rebuild top-level headings to match Insights"
          git push
