name: Debug Traditional Chinese runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-traditional-runtime.yml'
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCC
        run: python -m pip install --disable-pip-version-check -q opencc-python-reimplemented
      - name: Verify patched React Chinese source at runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from opencc import OpenCC
          import re,json
          s=Path('index.html').read_text(encoding='utf-8')
          cc=OpenCC('s2tw')
          def dec(body):
              out=[];i=0;common={'n':'\n','r':'\r','t':'\t','"':'"',"'":"'",'\\':'\\','/':'/'}
              while i<len(body):
                  if body[i]!='\\':out.append(body[i]);i+=1;continue
                  if i+1>=len(body):out.append('\\');break
                  k=body[i+1]
                  if k=='u' and i+5<len(body) and re.fullmatch(r'[0-9a-fA-F]{4}',body[i+2:i+6]):out.append(chr(int(body[i+2:i+6],16)));i+=6;continue
                  if k=='x' and i+3<len(body) and re.fullmatch(r'[0-9a-fA-F]{2}',body[i+2:i+4]):out.append(chr(int(body[i+2:i+4],16)));i+=4;continue
                  out.append(common.get(k,k));i+=2
              return ''.join(out)
          pat=re.compile(r'zh:"((?:\\.|[^"\\])*)"')
          count=0
          def repl(m):
              global count
              raw=m.group(1); txt=dec(raw); new=cc.convert(txt)
              if new=='公司特色':new='公司簡介'
              enc=json.dumps(new,ensure_ascii=True)[1:-1]
              if enc!=raw: count+=1
              return 'zh:"'+enc+'"'
          s=pat.sub(repl,s)
          print('CHANGED',count)
          p=s.find('Years in APAC')
          print('PATCHED SOURCE',s[p:p+650])
          hook=r'''<script>
          window.addEventListener('load',function(){setTimeout(function(){var buttons=[].slice.call(document.querySelectorAll('.lang-switch button'));var trad=buttons.find(function(b){return !b.classList.contains('ss-lang-simplified')&&(b.textContent||'').trim()==='中'});if(trad)trad.click();setTimeout(function(){document.body.innerHTML='<pre id="audit-output"></pre>';document.getElementById('audit-output').textContent='MODE='+(document.documentElement.getAttribute('data-ss-lang-mode')||'')+'\nLANG='+(document.documentElement.getAttribute('lang')||'')+'\nWELCOME='+(document.querySelector('.hero-copy h2')||{}).textContent+'\nSTAT='+(document.querySelector('.stats span')||{}).textContent+'\nCTA='+(document.querySelector('.hero-cta .gold-button')||{}).textContent;},1200);},700);});
          </script>'''
          s=s.replace('</body>',hook+'\n</body>',1)
          Path('debug.html').write_text(s,encoding='utf-8')
          PY
          python -m http.server 8000 >/tmp/http.log 2>&1 &
          P=$!
          trap 'kill $P || true' EXIT
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom http://127.0.0.1:8000/debug.html >/tmp/dom.html
          python - <<'PY'
          import re,html
          s=open('/tmp/dom.html',encoding='utf-8',errors='replace').read();m=re.search(r'<pre id="audit-output">(.*?)</pre>',s,re.S);print(html.unescape(re.sub(r'<[^>]+>','',m.group(1) if m else 'NO OUTPUT')))
          PY
