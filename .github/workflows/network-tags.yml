name: One-time Broad Influence tag styling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/network-tags.yml'

permissions:
  contents: write

jobs:
  style-network-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tag styling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* Broad Influence number tags */'
          if marker not in text:
              css = base64.b64decode('').decode('utf-8')
              text = text.replace('</style>', css + '\n</style>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit website update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/network-tags.yml
          git add index.html
          git commit -m "Style Broad Influence numbers as tags"
          git push
