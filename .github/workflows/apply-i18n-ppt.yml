name: Apply PPT copy to all languages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update EN JA ZH text only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          T={
          "Welcome to Sweet Spot!":(
            "Sweet Spotへようこそ！",
            "歡迎來到 Sweet Spot！"),
          "Powered by a network of sports and entertainment professionals with a strong commitment and long-term connection to Japan.":(
            "日本に深いコミットメントと長期的なつながりを持つ、スポーツ・エンターテインメント業界のプロフェッショナルネットワークに支えられています。",
            "由一群對日本具有深厚承諾與長期連結的運動及娛樂產業專業人士網絡所支持。"),
          "Authentic sports passion":(
            "本物のスポーツへの情熱",
            "真誠的運動熱情"),
          "Exciting and innovative unlocks":(
            "刺激的で革新的な機会の創出",
            "令人振奮且創新的突破機會"),
          "Win-win solution focus":(
            "Win-Winの解決策を重視",
            "專注於雙贏解決方案"),
          "Created to facilitate innovation and growth opportunities within Japan’s sports & entertainment industry.":(
            "日本のスポーツ＆エンターテインメント業界におけるイノベーションと成長機会を促進するために設立されました。",
            "旨在促進日本運動與娛樂產業的創新與成長機會。"),
          "Focused on raising the level of sports business connectivity and capability.":(
            "スポーツビジネスにおけるつながりと実行力の向上に注力しています。",
            "專注於提升運動商業的連結程度與專業能力。"),
          "Introducing the Founder":(
            "創業者紹介",
            "創辦人介紹"),
          "Sam is an award-winning team leader with 15+ years of success in sports PR/ marketing, fan community building, and sponsorship activation across the APAC region.":(
            "Samは、APAC地域でスポーツPR／マーケティング、ファンコミュニティ構築、スポンサーシップ活性化に15年以上の実績を持つ、受賞歴のあるチームリーダーです。",
            "Sam 是一位屢獲殊榮的團隊領導者，在亞太地區的運動公關／行銷、粉絲社群建立及贊助活化方面擁有 15 年以上的成功經驗。"),
          "He led AIG's sports marketing and communications in Tokyo from 2018-2025. Managed partnerships with New Zealand Rugby, Major League Baseball, and LPGA golfers.":(
            "2018年から2025年まで東京でAIGのスポーツマーケティングとコミュニケーションを率い、ニュージーランドラグビー、メジャーリーグベースボール、LPGAゴルファーとのパートナーシップを管理しました。",
            "2018 至 2025 年間，他在東京領導 AIG 的運動行銷與傳播工作，並管理與紐西蘭橄欖球、美國職棒大聯盟（MLB）及 LPGA 高爾夫球選手的合作夥伴關係。"),
          "Sam is fluent in Japanese, Mandarin and (Kiwi!) English.":(
            "Samは日本語、中国語（普通話）、そして（キウイ！）英語を流暢に話します。",
            "Sam 能流利使用日語、普通話以及（紐西蘭式！）英語。"),
          "Broad Influence and Access":(
            "幅広い影響力とアクセス",
            "廣泛的影響力與資源管道"),
          "Services rendered to:":(
            "サービス提供先：",
            "曾服務的對象包括："),
          "Government":(
            "政府機関",
            "政府"),
          "Japan Sports Agency, JSPIN Advisor.":(
            "スポーツ庁、JSPINアドバイザー。",
            "日本體育廳、JSPIN 顧問。"),
          "Rights holders":(
            "権利保有者",
            "權利持有方"),
          "baseball, cricket, golf, football, Formula One, rugby, and tennis.":(
            "野球、クリケット、ゴルフ、サッカー、F1、ラグビー、テニス。",
            "棒球、板球、高爾夫、足球、一級方程式賽車、橄欖球及網球。"),
          "Brands":(
            "ブランド",
            "品牌"),
          "finance, payment services, sportswear, tech & wearables.":(
            "金融、決済サービス、スポーツウェア、テクノロジー＆ウェアラブル。",
            "金融、支付服務、運動服飾、科技與穿戴式裝置。"),
          "Elite athletes":(
            "トップアスリート",
            "頂尖運動員"),
          "active and retired.":(
            "現役および引退選手。",
            "現役及退役。"),
          "Case Study: Apple":(
            "ケーススタディ：Apple",
            "案例研究：Apple"),
          "Demonstrated high-level facilitation capability:":(
            "高水準のファシリテーション能力を実証：",
            "展現高水準的協調促成能力："),
          "Receive and delivered on urgent brief within two hours.":(
            "緊急の依頼を受け、2時間以内に対応・納品。",
            "收到緊急任務後，在兩小時內完成並交付。"),
          "Ensured authentic and scandal-free talent selection with Hanshin Tigers Legend.":(
            "阪神タイガースのレジェンドを起用し、真正性が高くスキャンダルのない人選を実現。",
            "確保選用的阪神虎傳奇球星形象真實可信且無負面爭議。"),
          "Clear communication with all parties.":(
            "すべての関係者と明確にコミュニケーション。",
            "與所有相關方保持清楚明確的溝通。"),
          "Created a viral PR moment for Global CEO Tim Cook’s visit to Osaka.":(
            "グローバルCEO Tim Cookの大阪訪問で、話題性の高いPRモーメントを創出。",
            "為全球 CEO Tim Cook 的大阪之行創造了引發廣泛傳播的公關話題。")
          }

          def jsq(x):
              return json.dumps(x, ensure_ascii=True)[1:-1]

          changed=[]
          for en,(ja,zh) in T.items():
              e=jsq(en)
              pat=re.compile(r'en:"'+re.escape(e)+r'",ja:"(?:\\.|[^"\\])*",zh:"(?:\\.|[^"\\])*"')
              repl='en:"'+e+'",ja:"'+jsq(ja)+'",zh:"'+jsq(zh)+'"'
              s2,n=pat.subn(repl,s)
              if n:
                  changed.append((en,n))
                  s=s2

          p.write_text(s,encoding='utf-8')
          print('Updated multilingual strings:',len(changed))
          for x,n in changed: print(n,x)
          if len(changed)<15:
              raise SystemExit('Too few multilingual strings matched; refusing partial update')
          PY
      - name: Commit text changes and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-i18n-ppt.yml .github/workflows/inspect-i18n.yml
          git add index.html
          git commit -m "Sync PPT content across EN JA ZH"
          git push