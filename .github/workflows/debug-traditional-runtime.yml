name: Debug Traditional Chinese runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-traditional-runtime.yml'
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instrument language conversion and render
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needle="function simplifyTree(scope){\n    if(mode!=='zhcn' || translating)return;"
          repl="function simplifyTree(scope){\n    document.documentElement.dataset.dbgSimplify=(document.documentElement.dataset.dbgSimplifyCount||'0')+'|closure='+mode+',attr='+(document.documentElement.getAttribute('data-ss-lang-mode')||'')+',lang='+(document.documentElement.getAttribute('lang')||'');document.documentElement.dataset.dbgSimplifyCount=String((parseInt(document.documentElement.dataset.dbgSimplifyCount||'0',10)||0)+1);\n    if(mode!=='zhcn' || translating)return;"
          if needle not in s: raise SystemExit('simplifyTree marker missing')
          s=s.replace(needle,repl,1)
          # Track global converter calls and final state. Identity result is not used; wrapper preserves original output.
          hook=r'''<script>
          window.addEventListener('load',function(){
            var raw=window.__ssToSimplified;
            if(typeof raw==='function'){
              var count=0;
              window.__ssToSimplified=function(v){count++;document.documentElement.dataset.dbgConverter=String(count)+'|attr='+(document.documentElement.getAttribute('data-ss-lang-mode')||'')+'|lang='+(document.documentElement.getAttribute('lang')||'');return raw(v)};
            }
          });
          </script>'''
          s=s.replace('</body>',hook+'\n</body>',1)
          audit=r'''<script>
          window.addEventListener('load',function(){
            setTimeout(function(){
              var buttons=[].slice.call(document.querySelectorAll('.lang-switch button'));
              var trad=buttons.find(function(b){return !b.classList.contains('ss-lang-simplified')&&(b.textContent||'').trim()==='中'});
              if(trad)trad.click();
              var snaps=[];var n=0;
              var timer=setInterval(function(){
                n++;
                var st=document.documentElement.dataset;
                var text=(document.querySelector('.stats span')||{}).textContent||'';
                snaps.push('t'+n+': mode='+(document.documentElement.getAttribute('data-ss-lang-mode')||'')+', lang='+(document.documentElement.getAttribute('lang')||'')+', simplifyCount='+(st.dbgSimplifyCount||'0')+', simplifyLast='+(st.dbgSimplify||'')+', converter='+(st.dbgConverter||'')+', stat='+text);
                if(n>=8){clearInterval(timer);document.body.innerHTML='<pre id="audit-output"></pre>';document.getElementById('audit-output').textContent=snaps.join('\n');}
              },300);
            },700);
          });
          </script>'''
          s=s.replace('</body>',audit+'\n</body>',1)
          Path('debug.html').write_text(s,encoding='utf-8')
          PY
          python -m http.server 8000 >/tmp/http.log 2>&1 &
          P=$!
          trap 'kill $P || true' EXIT
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8000/debug.html >/tmp/dom.html
          python - <<'PY'
          import re, html
          s=open('/tmp/dom.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'<pre id="audit-output">(.*?)</pre>',s,re.S)
          print(html.unescape(re.sub(r'<[^>]+>','',m.group(1) if m else 'NO AUDIT OUTPUT')))
          PY
