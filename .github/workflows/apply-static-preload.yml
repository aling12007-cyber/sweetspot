name: Apply static preload

on:
  push:
    branches:
      - maintenance/nonvisual-safeguards-20260901
    paths:
      - '.github/workflows/apply-static-preload.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/nonvisual-safeguards-20260901
          fetch-depth: 0

      - name: Insert static Tokyo Tower preload only
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          before = path.read_text(encoding='utf-8')
          favicon = '  <link rel="icon" type="image/svg+xml" href="favicon.svg">\n'
          preload = '  <link rel="preload" as="image" href="assets/images/site-5fa8ee41a447.webp" fetchpriority="high">\n'

          if preload in before:
              raise SystemExit('Static preload already exists')
          if before.count(favicon) != 1:
              raise SystemExit('Expected exactly one favicon marker')

          after = before.replace(favicon, favicon + preload, 1)
          if after.count(preload) != 1:
              raise SystemExit('Expected exactly one static preload after patch')
          if len(after) - len(before) != len(preload):
              raise SystemExit('Unexpected index.html byte delta')

          path.write_text(after, encoding='utf-8')

      - name: Validate no visible-content edits
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<link rel="preload" as="image" href="assets/images/site-5fa8ee41a447.webp" fetchpriority="high">' index.html
          git diff --check
          git diff --numstat -- index.html

      - name: Commit preload and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-static-preload.yml
          git add index.html
          git commit -m 'perf: preload existing Tokyo Tower hero image'
          git push origin HEAD:maintenance/nonvisual-safeguards-20260901
