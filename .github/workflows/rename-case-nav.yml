name: One-time rename case navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-case-nav.yml'

permissions:
  contents: write

jobs:
  patch-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rename Apple nav to generic cases label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '["capabilities",{en:"Apple",ja:"Apple",zh:"Apple"}]'
          new = '["capabilities",{en:"Cases",ja:"事例",zh:"案例"}]'

          if old not in text:
              raise SystemExit('Expected Apple navigation label not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rename Apple navigation to Cases"
          git push
