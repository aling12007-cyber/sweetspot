name: Apply safe improvements

on:
  push:
    branches:
      - cleanup/safe-improvements-20260901
    paths:
      - '.github/workflows/apply-safe-improvements.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/safe-improvements-20260901
          fetch-depth: 0

      - name: Apply targeted safe changes
        shell: python
        run: |
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          old_url = 'https://images.unsplash.com/photo-1540747913346-19e32dc3e97e'
          old_fragment = ',url("' + old_url + '?auto=format&fit=crop&w=1400&q=88") center 35%/cover'
          count = index.count(old_fragment)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 legacy stadium background fragments, found {count}')
          index = index.replace(old_fragment, '')

          favicon_tag = '<link rel="icon" type="image/svg+xml" href="favicon.svg">'
          if favicon_tag not in index:
              marker = '  <meta name="theme-color" content="#07090d">\n'
              if marker not in index:
                  raise SystemExit('Could not find theme-color marker for favicon insertion')
              index = index.replace(marker, marker + '  ' + favicon_tag + '\n', 1)

          if old_url in index:
              raise SystemExit('Legacy external stadium URL still remains in index.html')
          index_path.write_text(index, encoding='utf-8')

          js_path = Path('assets/site-enhancements.js')
          js = js_path.read_text(encoding='utf-8')
          if 'function patchEmptySemantics()' not in js:
              insert_before = '  function closeMobileMenu(){\n'
              if insert_before not in js:
                  raise SystemExit('Could not find safe insertion point in site-enhancements.js')
              block = '''  function patchEmptySemantics(){
            document.querySelectorAll('.hero-lede,.hero-note,.section-title h2').forEach(function(element){
              if((element.textContent||'').trim()===''){
                element.setAttribute('aria-hidden','true');
              }else if(element.getAttribute('aria-hidden')==='true'){
                element.removeAttribute('aria-hidden');
              }
            });
          }

          '''
              js = js.replace(insert_before, block + insert_before, 1)

              call_after = '      patchCaseStudy();\n'
              if call_after not in js:
                  raise SystemExit('Could not find apply() insertion point in site-enhancements.js')
              js = js.replace(call_after, call_after + '      patchEmptySemantics();\n', 1)

          js_path.write_text(js, encoding='utf-8')

          required = [Path('favicon.svg'), Path('robots.txt'), Path('sitemap.xml')]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit('Missing safe-improvement file(s): ' + ', '.join(missing))

      - name: Validate changes
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/site-enhancements.js
          ! grep -Fq 'https://images.unsplash.com/photo-1540747913346-19e32dc3e97e' index.html
          grep -Fq '<link rel="icon" type="image/svg+xml" href="favicon.svg">' index.html
          grep -Fq 'Sitemap: https://aling12007-cyber.github.io/sweetspot/sitemap.xml' robots.txt
          grep -Fq 'https://aling12007-cyber.github.io/sweetspot/' sitemap.xml
          git diff --check

      - name: Commit targeted changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/site-enhancements.js
          git commit -m 'chore: apply safe site improvements'
          git push origin HEAD:cleanup/safe-improvements-20260901
