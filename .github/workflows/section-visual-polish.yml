name: One-time section visual polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/section-visual-polish.yml'

permissions:
  contents: write

jobs:
  polish-sections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refine Company, Network and Case Study visual rhythm
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '</style>'
          note = '/* Premium consistency pass: Company / Network / Case Study */'
          css = r'''
/* Premium consistency pass: Company / Network / Case Study */
#company .section-title,
#network .section-title,
#capabilities .section-title{
  margin-bottom:36px;
}

/* Shared card surface and top alignment */
#company .company-intro-grid .feature-card,
#network .network-grid article,
#capabilities .capability-grid article{
  position:relative;
  overflow:hidden;
  box-sizing:border-box;
  background:linear-gradient(145deg,rgba(255,255,255,.032),rgba(255,255,255,.008));
  border-color:rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.018);
}

#company .company-intro-grid,
#network .network-grid,
#capabilities .capability-grid{
  align-items:stretch;
}

/* Company Introduction: same visual rhythm as Points of Difference */
#company .company-intro-grid .feature-card{
  min-height:220px!important;
  padding:28px 26px!important;
  align-content:start!important;
  align-items:start!important;
}
#company .company-intro-grid .feature-card .card-top{
  align-self:start!important;
}
#company .company-intro-grid .feature-card h3{
  align-self:start!important;
  margin-top:0!important;
  line-height:1.42!important;
}
#company .company-intro-grid .feature-card p{
  align-self:start!important;
  line-height:1.62!important;
}

/* Broad Influence and Access: equal-height cards, content starts on one baseline */
#network .network-grid article{
  min-height:190px!important;
  padding:28px!important;
  align-content:start!important;
  align-items:start!important;
}
#network .network-grid article>span{
  align-self:start!important;
}
#network .network-grid h3{
  margin-top:0!important;
  margin-bottom:10px!important;
  line-height:1.28!important;
}
#network .network-grid p{
  margin-top:0!important;
  line-height:1.62!important;
}

/* Case Study: Apple: consistent numbered-card height and top-aligned copy */
#capabilities .capability-grid article{
  min-height:184px!important;
  padding:26px 28px!important;
  align-content:start!important;
  align-items:start!important;
  row-gap:10px!important;
}
#capabilities .capability-grid article>span{
  align-self:start!important;
  line-height:1.45!important;
}
#capabilities .capability-grid h3{
  align-self:start!important;
  margin-top:0!important;
  margin-bottom:0!important;
  line-height:1.35!important;
}
#capabilities .capability-grid p{
  align-self:start!important;
  margin-top:0!important;
  line-height:1.58!important;
}

/* Subtle, consistent interaction without changing layout */
#company .company-intro-grid .feature-card,
#network .network-grid article,
#capabilities .capability-grid article{
  transition:transform .28s ease,background .28s ease,border-color .28s ease;
}
#company .company-intro-grid .feature-card:hover,
#network .network-grid article:hover,
#capabilities .capability-grid article:hover{
  transform:translateY(-3px);
  background:linear-gradient(145deg,rgba(215,169,54,.055),rgba(255,255,255,.01));
  border-color:rgba(215,169,54,.24);
}

@media(max-width:760px){
  #company .section-title,
  #network .section-title,
  #capabilities .section-title{margin-bottom:28px}

  #company .company-intro-grid .feature-card,
  #network .network-grid article,
  #capabilities .capability-grid article{
    min-height:0!important;
    padding:22px!important;
  }

  #company .company-intro-grid .feature-card h3,
  #network .network-grid h3,
  #capabilities .capability-grid h3{
    line-height:1.36!important;
  }
}
'''
          if note not in text:
              if marker not in text:
                  raise SystemExit('style closing tag not found')
              text = text.replace(marker, css + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
          else:
              raise SystemExit('Premium consistency CSS already present')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish section heights and text alignment"
          git push
