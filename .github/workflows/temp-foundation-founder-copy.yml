name: Temporary Foundation founder copy update

on:
  push:
    branches:
      - content/foundation-founder-copy-20260907

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: content/foundation-founder-copy-20260907
          fetch-depth: 0
      - name: Apply scoped Foundation copy update
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          js_path = Path('assets/site-enhancements.js')
          js = js_path.read_text()

          def replace_once(old, new, label):
              global js
              count = js.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              js = js.replace(old, new, 1)

          # Remove the separate founder-intro sentence from every language.
          intro_lines = [
              "        intro:'Founder Sam L. Pearson has built more than 15 years of experience across rights holders, agencies and brands in the APAC sports and entertainment industry.',\n",
              "        intro:'創業者 Sam L. Pearson は、APAC のスポーツ・エンターテインメント業界で、権利保有者、エージェンシー、ブランドの各立場を通じて15年以上の経験を積んできました。',\n",
              "        intro:'創辦人 Sam L. Pearson 在亞太地區的運動與娛樂產業累積超過 15 年經驗，歷練橫跨權利持有方、代理商與品牌端。',\n",
              "        intro:'创办人 Sam L. Pearson 在亚太地区的体育与娱乐产业积累超过 15 年经验，历练横跨权利持有方、代理机构与品牌端。',\n",
          ]
          for i, line in enumerate(intro_lines, 1):
              replace_once(line, '', f'intro line {i}')

          replace_once(
              "        first:'Sam’s experience across rights holders (WTA, FIFA), agencies (Octagon, CSM) and brands (AIG) has provided a comprehensive appreciation of the sports ecosystem and objectives and challenges across the various parties. In particular, the 8 years leading AIG’s sports marketing function ensured a focus on maximizing sponsorship benefits to achieve tangible business results.',",
              "        first:'Founder Sam’s experience across rights holders (WTA, FIFA), agencies (Octagon, CSM) and brands (AIG) has provided a comprehensive appreciation of the sports ecosystem and objectives and challenges across the various parties. In particular, the 8 years leading AIG’s sports marketing function ensured a focus on maximizing sponsorship benefits to achieve tangible business results.',",
              'English founder paragraph'
          )
          replace_once(
              "        first:'Samは、権利保有者（WTA、FIFA）、エージェンシー（Octagon、CSM）、ブランド（AIG）それぞれの立場で経験を積み、スポーツ業界全体のエコシステムと、各関係者が抱える目標や課題を幅広く理解してきました。特に、AIGで8年間スポーツマーケティング部門を率いた経験を通じ、スポンサーシップの価値を最大化し、具体的なビジネス成果につなげることに注力してきました。',",
              "        first:'創業者 Sam は、権利保有者（WTA、FIFA）、エージェンシー（Octagon、CSM）、ブランド（AIG）それぞれの立場で経験を積み、スポーツ業界全体のエコシステムと、各関係者が抱える目標や課題を幅広く理解してきました。特に、AIGで8年間スポーツマーケティング部門を率いた経験を通じ、スポンサーシップの価値を最大化し、具体的なビジネス成果につなげることに注力してきました。',",
              'Japanese founder paragraph'
          )
          replace_once(
              "        first:'Sam 曾在權利持有方（WTA、FIFA）、代理商（Octagon、CSM）以及品牌（AIG）累積經驗，使他得以全面理解體育產業生態，以及不同參與者各自的目標與面臨的挑戰。尤其是在 AIG 領導體育行銷業務的八年間，他始終專注於最大化贊助合作的效益，並將其轉化為具體的商業成果。',",
              "        first:'創辦人 Sam 曾在權利持有方（WTA、FIFA）、代理商（Octagon、CSM）以及品牌（AIG）累積經驗，使他得以全面理解體育產業生態，以及不同參與者各自的目標與面臨的挑戰。尤其是在 AIG 領導體育行銷業務的八年間，他始終專注於最大化贊助合作的效益，並將其轉化為具體的商業成果。',",
              'Traditional Chinese founder paragraph'
          )
          replace_once(
              "        first:'Sam 曾在权利持有方（WTA、FIFA）、代理机构（Octagon、CSM）以及品牌（AIG）积累经验，使他得以全面理解体育产业生态，以及不同参与方各自的目标与面临的挑战。尤其是在 AIG 领导体育营销业务的八年间，他始终专注于最大化赞助合作的效益，并将其转化为具体的商业成果。',",
              "        first:'创办人 Sam 曾在权利持有方（WTA、FIFA）、代理机构（Octagon、CSM）以及品牌（AIG）积累经验，使他得以全面理解体育产业生态，以及不同参与方各自的目标与面临的挑战。尤其是在 AIG 领导体育营销业务的八年间，他始终专注于最大化赞助合作的效益，并将其转化为具体的商业成果。',",
              'Simplified Chinese founder paragraph'
          )

          intro_render = """    var intro=appendStoryParagraph(foundation,copy.intro);\n    intro.className='company-story-intro';\n"""
          replace_once(intro_render, '', 'separate intro rendering')

          js_path.write_text(js)

          html_path = Path('index.html')
          html = html_path.read_text()
          old = 'assets/site-enhancements.js?v=introduction-subheads-20260907'
          new = 'assets/site-enhancements.js?v=foundation-founder-copy-20260907'
          if html.count(old) != 1:
              raise SystemExit(f'cache key: expected exactly one match, found {html.count(old)}')
          html = html.replace(old, new, 1)
          html_path.write_text(html)
          PY

          node --check assets/site-enhancements.js
          ! grep -Fq "Founder Sam L. Pearson has built more than 15 years" assets/site-enhancements.js
          grep -Fq "Founder Sam’s experience across rights holders (WTA, FIFA)" assets/site-enhancements.js
          grep -Fq "創辦人 Sam 曾在權利持有方" assets/site-enhancements.js
          git diff --check
      - name: Commit scoped site update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-foundation-founder-copy.yml
          git add assets/site-enhancements.js index.html
          git commit -m "content: refine Foundation founder copy"
          git push origin HEAD:content/foundation-founder-copy-20260907
