name: Temporary Foundation Story redesign

on:
  push:
    branches:
      - content/foundation-story-redesign-20260907

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Redesign Foundation Story block
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('assets/site-enhancements.js')
          js = js_path.read_text(encoding='utf-8')
          start = js.index('  function patchFoundationStory(){')
          end = js.index('\n\n  function patchEmptySemantics(){', start)
          new_function = Path('.github/temp/foundation-story-function.txt').read_text(encoding='utf-8').rstrip()
          js_path.write_text(js[:start] + new_function + js[end:], encoding='utf-8')

          css_path = Path('assets/case-study-split.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Company Foundation Story — full-text editorial block */'
          if marker not in css:
              raise SystemExit('Foundation Story CSS marker not found')
          new_css = Path('.github/temp/foundation-story-css.txt').read_text(encoding='utf-8').rstrip()
          css_path.write_text(css.split(marker, 1)[0].rstrip() + '\n\n' + new_css + '\n', encoding='utf-8')

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          old = 'assets/site-enhancements.js?v=foundation-i18n-20260907'
          new = 'assets/site-enhancements.js?v=foundation-story-design-20260907'
          if old not in html:
              raise SystemExit('Expected site enhancements version URL not found')
          if html.count(old) != 1:
              raise SystemExit('Expected exactly one site enhancements version URL')
          html_path.write_text(html.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate staged changes
        run: |
          node --check assets/site-enhancements.js
          grep -Fq "foundationHeading:'Foundation Story and Purpose'" assets/site-enhancements.js
          grep -Fq "originHeading:'The Origin of the “Sweet Spot” Name and Logo'" assets/site-enhancements.js
          grep -Fq "logo.src='assets/images/site-e8a84d6c8ba9.webp'" assets/site-enhancements.js
          grep -Fq "company-story-logo-stage" assets/case-study-split.css
          grep -Fq "foundation-story-design-20260907" index.html
          ! grep -Fq "heading:'Sweet Spot’s Foundation Story and Purpose'" assets/site-enhancements.js

      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-enhancements.js assets/case-study-split.css index.html
          git commit -m "content: redesign Foundation Story section"
          git push
