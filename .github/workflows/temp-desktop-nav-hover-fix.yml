name: Temporary desktop nav hover fix
on:
  push:
    branches:
      - fix/desktop-nav-hover-click-20260908
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/desktop-nav-hover-click-20260908
      - name: Apply desktop navigation hover and click fix
        run: python .github/scripts/temp_desktop_nav_hover_fix.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/case-study-split.css index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: keep desktop nav submenus hoverable and clickable"
          git push
