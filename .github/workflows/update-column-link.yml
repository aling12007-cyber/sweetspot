name: Update column link
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace column URL
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),p='index.html'; let s=fs.readFileSync(p,'utf8');
          const oldUrl='href:"https://jspin.mext.go.jp/",target:"_blank",rel:"noreferrer",children:[z(l,{en:"Read the Full Column"';
          const newUrl='href:"https://jspin.mext.go.jp/en/contents/s-p/",target:"_blank",rel:"noreferrer",children:[z(l,{en:"Read the Full Column"';
          if(!s.includes(newUrl)){
            if(!s.includes(oldUrl)) throw new Error('Column link not found');
            s=s.replace(oldUrl,newUrl);
          }
          fs.writeFileSync(p,s);
          NODE
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-column-link.yml
          git add index.html
          git commit -m "Update full column link"
          git push
