name: Temporary navigation heading hierarchy
on:
  push:
    branches:
      - content/navigation-heading-hierarchy-20260907
    paths:
      - .github/workflows/temp-navigation-heading-hierarchy.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: content/navigation-heading-hierarchy-20260907
      - name: Apply requested desktop and mobile heading hierarchy
        shell: bash
        run: |
          python .github/apply-navigation-heading-hierarchy.py
          git diff --check
          git status --short
          grep -F "label:'FUNDATION/PURPOSE'" assets/site-enhancements.js
          grep -F "label:'CASE'" assets/site-enhancements.js
          grep -F 'site-enhancements.js?v=navigation-heading-hierarchy-20260907' index.html
      - name: Commit site files only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site-enhancements.js index.html
          git commit -m 'content: update navigation heading hierarchy'
          git push origin HEAD:content/navigation-heading-hierarchy-20260907
