name: Fix Traditional Chinese localization
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-traditional-chinese.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install localization verifier
        run: python -m pip install --disable-pip-version-check -q opencc-python-reimplemented
      - name: Patch Traditional Chinese source
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('m','.github/scripts/fix_traditional_chinese_v4.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m);m.patch_index()
          PY
      - name: Verify Traditional and Simplified modes
        run: python .github/scripts/verify_chinese_modes.py
      - name: Validate diff
        run: git diff --check
      - name: Commit localization fix only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && { echo 'No index changes to commit'; exit 1; }
          git commit -m 'Fix Traditional Chinese localization'
          git push origin main
