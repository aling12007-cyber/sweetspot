name: Reorder welcome text

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reorder-welcome.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Welcome to above title
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          hero = text.index('className:"hero-copy",children:[')
          h1_start = text.index('(0,f.jsxs)("h1",', hero)
          h2_start = text.index('(0,f.jsx)("h2",', h1_start)
          p_start = text.index('(0,f.jsx)("p",{className:"hero-lede"', h2_start)

          h1 = text[h1_start:h2_start-1]
          h2 = text[h2_start:p_start-1]

          if 'children:"Welcome to"' not in h2:
              raise SystemExit('Expected Welcome to heading not found')

          updated = text[:h1_start] + h2 + ',' + h1 + ',' + text[p_start:]
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reorder-welcome.yml
          git add index.html
          git commit -m "Move Welcome to above Sweet Spot title"
          git push
