name: Validate heading integrity
on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/site-enhancements.js
      - .github/workflows/validate-heading-integrity.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check heading and navigation hierarchy source of truth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          s=Path('index.html').read_text(encoding='utf-8')
          j=Path('assets/site-enhancements.js').read_text(encoding='utf-8')

          start='<!-- SS SINGLE UNIFIED SECTION HEADING START -->'
          end='<!-- SS SINGLE UNIFIED SECTION HEADING END -->'
          assert s.count(start)==1 and s.count(end)==1, 'Unified heading block must exist exactly once'
          assert 'Reference major heading fallback START' not in s, 'Legacy heading fallback returned'
          assert 'var ssHeadingCopy={' not in s, 'Misplaced legacy heading copy returned'
          assert '<!-- Section hierarchy navigation -->' not in s, 'Legacy navigation hierarchy script returned'

          a=s.index(start); b=s.index(end,a); block=s[a:b]
          required_heading=[
            "company:['Company','Company Introduction','']",
            "company:['会社','会社紹介','']",
            "company:['公司','公司簡介','']",
            "points:['Difference','Points of Difference','']",
            "founder:['Founder','Sam L. Pearson','']",
            "founder:['創業者','Sam L. Pearson','']",
            "founder:['創辦人','Sam L. Pearson','']",
            "experience:['Career','Professional Journey','Built across APAC']",
            "network:['Network','Broad Influence and Access','Services rendered to:']",
            "capabilities:['Case','Case Study: Apple','Demonstrated high-level facilitation capability']",
            "capabilities:['案例','案例研究：Apple','展現高水準的協調促成能力']",
            "window.__ssRefreshUnifiedHeadings=run;"
          ]
          for x in required_heading:
              assert x in s, 'Required unified heading copy missing: '+x

          required_nav=[
            "version='20260907-heading-hierarchy-i18n-v3-'+lang",
            "var navCopies={",
            "en:{home:'HOME',introduction:'INTRODUCTION',foundation:'FOUNDATION / PURPOSE'",
            "ja:{home:'ホーム',introduction:'会社紹介',foundation:'創立 / 理念'",
            "zhtw:{home:'首頁',introduction:'公司簡介',foundation:'創立 / 理念'",
            "zhcn:{home:'首页',introduction:'公司简介',foundation:'创立 / 理念'",
            "{href:'#home',label:c.home,classes:'nav-home nav-level-1'}",
            "{href:'#company',label:c.introduction,classes:'nav-level-1 nav-parent',children:[",
            "{href:'#foundation-purpose',label:c.foundation}",
            "{href:'#name-logo',label:c.nameLogo}",
            "{href:'#what-we-stand-for',label:c.standFor}",
            "{href:'#difference',label:c.difference}",
            "{href:'#founder',label:c.founder,classes:'nav-level-1 nav-parent',children:[",
            "{href:'#experience',label:c.career}",
            "{href:'#network',label:c.network,classes:'nav-level-1 nav-parent',children:[",
            "{href:'#capabilities',label:c.caseStudy}",
            "{href:'#insights',label:c.insights,classes:'nav-level-1'}",
            "{href:'#contact',label:c.contact,classes:'nav-level-1 contact-mini'}",
            "foundation.id='foundation-purpose'",
            "origin.id='name-logo'",
            "focusHeading.id='what-we-stand-for'",
            "differenceHeading.id='difference'",
            "focusHeading.textContent=focusLabels[lang]||focusLabels.en;",
            "differenceHeading.textContent=differenceLabels[lang]||differenceLabels.en;",
            "閱讀更多創辦人的職涯",
            "創業者の経歴をもっと見る",
            "function patchFounderIdentity(){",
            "zhtw:{role:'創辦人',location:'東京，日本'}",
            "zhcn:{role:'创办人',location:'东京，日本'}"
          ]
          for x in required_nav:
              assert x in j, 'Required localized navigation/content token missing: '+x
          assert 'FUNDATION/PURPOSE' not in j, 'Misspelled Foundation label returned'

          m=re.search(r'<script id="ss-single-heading-script">(.*?)</script>',block,re.S)
          assert m, 'Unified heading script missing'
          t=Path('.heading-check.js')
          t.write_text(m.group(1),encoding='utf-8')
          subprocess.run(['node','--check',str(t)],check=True)
          t.unlink()
          print('Heading and localized navigation integrity check passed')
          PY
# Validates the current unified heading and localized navigation hierarchy source of truth.
