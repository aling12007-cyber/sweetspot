name: Debug Traditional Chinese runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-traditional-runtime.yml'
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace language translation function
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          call=s.find('z(l,{en:"Welcome to"')
          print('WELCOME CALL POS',call)
          if call>=0:
              print('CALL CONTEXT',s[call-1500:call+1800].replace('\n','\\n'))
              # Find nearby assignments/declarations of z before the call.
              for pat in [r'\bz\s*=\s*',r'function\s+z\s*\(',r'\bz\s*:\s*',r'\bz\s*=\s*\([^)]*\)\s*=>']:
                  hits=[m.start() for m in re.finditer(pat,s[:call])]
                  print('PATTERN',pat,'COUNT',len(hits),'LAST',hits[-10:])
                  for p in hits[-5:]:print('CTX',p,s[max(0,p-500):min(len(s),p+1200)].replace('\n','\\n'))
          # Print source around the current-language variable l declaration/assignments near the component.
          for pat in [r'\bl\s*=\s*',r'\[l,',r'const\s*\[l,',r'let\s*\[l,']:
              hits=[m.start() for m in re.finditer(pat,s[max(0,call-40000):call+1000])]
              print('LOCAL PATTERN',pat,'COUNT',len(hits))
              base=max(0,call-40000)
              for h in hits[-8:]:
                  p=base+h;print('LCTX',p,s[max(0,p-700):min(len(s),p+1000)].replace('\n','\\n'))
          PY
