name: One-time correct major heading Insights style
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-major-heading-insights-correctly.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply corrected major heading style
        run: echo '' | base64 -d | python
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-major-heading-insights-correctly.yml
          git add index.html
          git commit -m "Correct top-level heading Insights styling"
          git push
