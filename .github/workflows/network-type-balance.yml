name: One-time Broad Influence typography refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/network-type-balance.yml'

permissions:
  contents: write

jobs:
  refine-network-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Balance Broad Influence typography
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
            'font-size:15px!important;font-weight:900!important': 'font-size:13px!important;font-weight:900!important',
            'font-size:clamp(25px,2.15vw,32px)!important;font-weight:800!important;line-height:1.08!important': 'font-size:clamp(22px,1.8vw,28px)!important;font-weight:800!important;line-height:1.14!important',
            'font-size:15px!important;line-height:1.58!important': 'font-size:clamp(13.5px,1.05vw,15px)!important;line-height:1.62!important',
            '#network .network-grid h3{margin:26px 0 12px!important': '#network .network-grid h3{margin:22px 0 10px!important',
            'font-size:14px!important}\n  #network .network-grid h3{margin:28px 0 12px!important;max-width:58%!important;font-size:clamp(28px,7.2vw,32px)!important}': 'font-size:12px!important}\n  #network .network-grid h3{margin:23px 0 10px!important;max-width:60%!important;font-size:clamp(23px,6.1vw,27px)!important;line-height:1.16!important}',
            '#network .network-grid p{max-width:58%!important;font-size:16px!important;line-height:1.52!important}': '#network .network-grid p{max-width:60%!important;font-size:15px!important;line-height:1.58!important}'
          }

          changed = 0
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed += 1

          if changed < 6:
              raise SystemExit(f'Expected 6 typography replacements, made {changed}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit website update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/network-type-balance.yml
          git add index.html
          git commit -m "Balance Broad Influence typography"
          git push