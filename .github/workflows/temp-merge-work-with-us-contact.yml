name: Temporary Contact merge patch
on:
  push:
    branches:
      - fix/merge-work-with-us-contact-20260908
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/merge-work-with-us-contact-20260908
      - name: Apply Contact merge patch
        run: python .github/scripts/temp_merge_work_with_us_contact.py
      - name: Validate JavaScript
        run: node --check assets/site-enhancements.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/site-enhancements.js assets/case-study-split.css index.html .github/workflows/validate-heading-integrity.yml
          git commit -m "fix: merge Work With Us into Contact"
          git push
