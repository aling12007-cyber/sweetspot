name: Temporary navigation hierarchy fix
on:
  push:
    branches:
      - fix/nav-network-submenu-20260908
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/nav-network-submenu-20260908
      - name: Apply navigation hierarchy update
        run: python .github/scripts/temp_nav_hierarchy_fix.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/site-enhancements.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: simplify founder nav and add network access submenu"
          git push
