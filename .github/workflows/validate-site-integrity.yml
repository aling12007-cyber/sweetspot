name: Validate site integrity

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'favicon.svg'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/validate-site-integrity.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'favicon.svg'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/validate-site-integrity.yml'

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate enhancement JavaScript syntax
        run: node --check assets/site-enhancements.js

      - name: Validate required files and local asset references
        shell: python
        run: |
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          required = [
              Path('index.html'),
              Path('favicon.svg'),
              Path('robots.txt'),
              Path('sitemap.xml'),
              Path('assets/case-study-activity.webp'),
              Path('assets/case-study-split.css'),
              Path('assets/site-enhancements.js'),
              Path('assets/images/site-0bea4d652740.webp'),
              Path('assets/images/site-569ad95d8272.webp'),
              Path('assets/images/site-5fa8ee41a447.webp'),
              Path('assets/images/site-e8a84d6c8ba9.webp'),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit('Missing required files: ' + ', '.join(missing))

          forbidden = [Path('founder.jpg'), Path('logo.jpg'), Path('noop')]
          restored = [str(path) for path in forbidden if path.exists()]
          if restored:
              raise SystemExit('Deleted legacy files were restored: ' + ', '.join(restored))

          index = Path('index.html').read_text(encoding='utf-8')
          css = Path('assets/case-study-split.css').read_text(encoding='utf-8')
          enhancements = Path('assets/site-enhancements.js').read_text(encoding='utf-8')
          robots = Path('robots.txt').read_text(encoding='utf-8')

          site_url = 'https://aling12007-cyber.github.io/sweetspot/'
          hero = 'assets/images/site-5fa8ee41a447.webp'
          favicon_tag = '<link rel="icon" type="image/svg+xml" href="favicon.svg">'
          preload_tag = '<link rel="preload" as="image" href="' + hero + '" fetchpriority="high">'

          if hero not in index:
              raise SystemExit('Tokyo Tower hero image reference is missing from index.html')
          if preload_tag not in index:
              raise SystemExit('Static Tokyo Tower preload is missing from index.html')
          if favicon_tag not in index:
              raise SystemExit('Favicon link is missing from index.html')
          if '<link rel="canonical" href="' + site_url + '">' not in index:
              raise SystemExit('Canonical URL does not match the deployed site URL')

          old_hero_url = 'https://images.unsplash.com/photo-1540747913346-19e32dc3e97e'
          if old_hero_url in index:
              raise SystemExit('Retired Hero stadium URL was restored')

          # This background is intentionally preserved while visible-output parity is required.
          career_url = 'https://images.unsplash.com/photo-1574629810360-7efbb92f582c?auto=format&fit=crop&w=1800&q=72'
          if career_url not in index:
              raise SystemExit('Career Playbook background changed unexpectedly')

          stale_label = 'A stadium under lights'
          if stale_label in index:
              if "removeAttribute('aria-label')" not in enhancements or stale_label not in enhancements:
                  raise SystemExit('Stale hero accessibility label is not neutralized')

          if "cityImage.setAttribute('fetchpriority','high')" not in enhancements:
              raise SystemExit('Rendered Hero image priority safeguard is missing')

          sitemap_url = site_url + 'sitemap.xml'
          if 'Sitemap: ' + sitemap_url not in robots:
              raise SystemExit('robots.txt sitemap URL does not match the deployed site URL')

          root = ET.parse('sitemap.xml').getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs = [node.text for node in root.findall('.//sm:loc', ns)]
          if locs != [site_url]:
              raise SystemExit('sitemap.xml must contain exactly the canonical site URL')

          asset_pattern = re.compile(r'assets/[A-Za-z0-9._/-]+\.(?:webp|css|js|png|jpe?g|svg)')
          referenced = set(asset_pattern.findall(index + '\n' + css + '\n' + enhancements))
          dangling = sorted(ref for ref in referenced if not Path(ref).is_file())
          if dangling:
              raise SystemExit('Dangling local asset references: ' + ', '.join(dangling))

          print(f'Validated {len(referenced)} local asset reference(s).')
