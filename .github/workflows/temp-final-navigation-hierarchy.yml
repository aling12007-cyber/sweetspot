name: Temporary final navigation hierarchy
on:
  push:
    branches:
      - content/navigation-heading-hierarchy-20260907
    paths:
      - .github/workflows/temp-final-navigation-hierarchy.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: content/navigation-heading-hierarchy-20260907
      - name: Apply final desktop and mobile navigation hierarchy
        shell: bash
        run: |
          python .github/apply-final-navigation-hierarchy.py
          git diff --check
          grep -F "label:'FUNDATION/PURPOSE'" assets/site-enhancements.js
          grep -F "label:'CASE'" assets/site-enhancements.js
          grep -F 'Requested navigation heading hierarchy' assets/case-study-split.css
          grep -F 'Section hierarchy navigation is handled by assets/site-enhancements.js' index.html
      - name: Commit site files only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site-enhancements.js assets/case-study-split.css index.html
          git commit -m 'content: finalize navigation heading hierarchy'
          git push origin HEAD:content/navigation-heading-hierarchy-20260907
