name: One-time Company Introduction redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-intro-vertical-highlight.yml'

permissions:
  contents: write

jobs:
  redesign-company-intro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Redesign Company Introduction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start_marker = '(0,f.jsxs)("div",{className:"difference-grid company-intro-grid",children:['
          end_marker = ']}),(0,f.jsxs)("section",{id:"points"'
          if start_marker not in s or end_marker not in s:
              raise SystemExit('Company section markers not found')
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          new = '''(0,f.jsxs)("div",{className:"company-intro-list",children:[(0,f.jsx)("article",{className:"company-intro-item",children:(0,f.jsx)("p",{children:z(l,{en:"Created to facilitate innovation and growth opportunities within Japan’s sports & entertainment industry.",ja:"日本のスポーツ・エンターテインメント業界におけるイノベーションと成長機会の創出を促進するために設立されました。",zh:"致力於促進日本運動與娛樂產業的創新與成長機會。"})})}),(0,f.jsx)("article",{className:"company-intro-item",children:(0,f.jsx)("p",{children:z(l,{en:"Focused on raising the level of sports business connectivity and capability.",ja:"スポーツビジネスにおけるつながりと能力の水準向上に注力しています。",zh:"專注於提升運動商業的連結程度與專業能力。"})})}),(0,f.jsx)("article",{className:"company-intro-highlight",children:(0,f.jsx)("p",{children:z(l,{en:"Powered by a network of sports and entertainment professionals with a strong commitment and long-term connection to Japan.",ja:"日本との強いコミットメントと長期的なつながりを持つ、スポーツおよびエンターテインメントのプロフェッショナルネットワークによって支えられています。",zh:"由一群對日本具有高度投入並與日本保持長期連結的運動與娛樂專業人士所組成的網絡提供支持。"})})})]})'''
          s = s[:start] + new + s[end:]
          note = '/* Company Introduction vertical editorial layout */'
          if note not in s:
              css = '''
          /* Company Introduction vertical editorial layout */
          #company .company-intro-list{position:relative;z-index:2;width:min(100%,1060px);margin:0 auto;display:grid;grid-template-columns:1fr}
          #company .company-intro-item{display:grid;grid-template-columns:18px minmax(0,1fr);column-gap:22px;align-items:start;padding:27px 30px;border-top:1px solid rgba(255,255,255,.12);background:linear-gradient(90deg,rgba(255,255,255,.018),transparent 74%);transition:background .28s ease}
          #company .company-intro-item:nth-child(2){border-bottom:1px solid rgba(255,255,255,.12)}
          #company .company-intro-item:before{content:"";width:8px;height:8px;margin-top:.56em;border:2px solid var(--gold);border-radius:50%;box-shadow:0 0 0 5px rgba(215,169,54,.07),0 0 18px rgba(215,169,54,.16)}
          #company .company-intro-item p{margin:0;max-width:950px;color:#f5f3ed;font-size:clamp(21px,2.35vw,31px);font-weight:700;line-height:1.36;letter-spacing:-.028em}
          #company .company-intro-item:hover{background:linear-gradient(90deg,rgba(215,169,54,.045),transparent 74%)}
          #company .company-intro-highlight{position:relative;overflow:hidden;margin-top:20px;padding:36px 40px 38px 48px;border:1px solid rgba(215,169,54,.5);border-left:4px solid var(--gold);background:linear-gradient(112deg,rgba(215,169,54,.16),rgba(215,169,54,.045) 42%,rgba(10,102,194,.055) 100%),#0b0f15;box-shadow:0 18px 48px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,241,178,.05);transition:transform .28s ease,border-color .28s ease,background .28s ease}
          #company .company-intro-highlight:before{content:"";position:absolute;right:-65px;top:-72px;width:190px;height:190px;border:1px solid rgba(215,169,54,.19);border-radius:50%;box-shadow:0 0 0 24px rgba(215,169,54,.025),0 0 0 52px rgba(10,102,194,.022);pointer-events:none}
          #company .company-intro-highlight:after{content:"";position:absolute;left:21px;top:39px;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 18px rgba(215,169,54,.42)}
          #company .company-intro-highlight p{position:relative;z-index:1;margin:0;max-width:940px;color:#fff;font-size:clamp(25px,2.85vw,38px);font-weight:800;line-height:1.28;letter-spacing:-.038em;text-wrap:balance}
          #company .company-intro-highlight:hover{transform:translateY(-2px);border-color:rgba(240,207,103,.72);background:linear-gradient(112deg,rgba(215,169,54,.19),rgba(215,169,54,.055) 42%,rgba(10,102,194,.065) 100%),#0b0f15}
          @media(max-width:760px){#company .company-intro-list{width:100%}#company .company-intro-item{grid-template-columns:14px minmax(0,1fr);column-gap:14px;padding:21px 18px}#company .company-intro-item p{font-size:clamp(18px,5.25vw,23px);line-height:1.42}#company .company-intro-highlight{margin-top:14px;padding:27px 20px 29px 34px}#company .company-intro-highlight:after{left:15px;top:31px;width:8px;height:8px}#company .company-intro-highlight p{font-size:clamp(21px,6vw,28px);line-height:1.34;text-wrap:pretty}}
          '''
              s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit website update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/company-intro-vertical-highlight.yml
          git add index.html
          git commit -m "Redesign Company Introduction vertical highlight"
          git push
