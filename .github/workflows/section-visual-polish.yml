name: One-time section visual polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/section-visual-polish.yml'

permissions:
  contents: write

jobs:
  polish-sections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine section visual rhythm
        shell: bash
        env:
          CSS_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '</style>'
          note = '/* Premium consistency pass: Company / Network / Case Study */'
          if note in text:
              raise SystemExit('Premium consistency CSS already present')
          css = base64.b64decode(os.environ['CSS_B64']).decode('utf-8')
          if marker not in text:
              raise SystemExit('style closing tag not found')
          path.write_text(text.replace(marker, css + '\n' + marker, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish section heights and text alignment"
          git push
