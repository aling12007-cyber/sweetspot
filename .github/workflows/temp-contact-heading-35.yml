name: Temporary contact heading 35 percent
on:
  push:
    branches:
      - fix/contact-heading-135-20260908
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/contact-heading-135-20260908
      - name: Apply contact heading scale
        run: python .github/scripts/temp_contact_heading_35.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/case-study-split.css index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: enlarge Contact heading by 35 percent"
          git push
