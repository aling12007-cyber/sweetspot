name: Update remaining heading style
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-remaining-heading-style.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and verify rendered headings
        run: python .github/scripts/patch_remaining_headings.py
      - name: Commit verified website update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm --ignore-unmatch .github/workflows/update-remaining-heading-style.yml .github/scripts/patch_remaining_headings.py
          git commit -m 'Match remaining headings to Insights style'
          git push
