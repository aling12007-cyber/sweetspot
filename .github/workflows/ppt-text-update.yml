name: PPT text update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update website copy only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('Sweet Spot | Sports Business Strategy', 'Sweet Spot'),
            ('Connecting Japan with the global sports business through strategy, partnerships and market development.', 'Powered by a network of sports and entertainment professionals with a strong commitment and long-term connection to Japan.'),
            ('Sports business strategy, partnerships and market development connecting Japan with global markets.', 'Created to facilitate innovation and growth opportunities within Japan’s sports & entertainment industry.'),
            ('Sweet Spot sports business strategy', 'Sweet Spot'),
            ('Sports Business Strategy & Consulting', 'Welcome to Sweet Spot!'),
            ('Connecting Japan with the global sports business.', 'Powered by a network of sports and entertainment professionals with a strong commitment and long-term connection to Japan.'),
            ('Senior-level strategy, partnerships and market development built on deep sports industry experience and trusted relationships in Japan.', 'Created to facilitate innovation and growth opportunities within Japan’s sports & entertainment industry.'),
            ('Led by Sam Pearson — 15+ years across sports PR, sponsorship activation and partnership development in APAC.', 'Focused on raising the level of sports business connectivity and capability.'),
            ('Meet the Founder', 'Introducing the Founder'),
            ('Strategy. Access. Execution.', 'Authentic sports passion · Exciting and innovative unlocks · Win-win solution focus'),
            ('What Sets Us Apart', ''),
            ('Points of Difference', 'Points of Difference:'),
            ('Respect for technique and craft of high performance', 'Win-win solution focus'),
            ('Deep respect for the detail, discipline and craft that underpin sustained high performance.', ''),
            ('Sports-first thinking grounded in real passion, not surface-level positioning.', ''),
            ('Fresh ways to connect audiences, partners and properties around meaningful opportunities.', ''),
            ('Sam is fluent in Japanese (and Kiwi English!).', 'Sam is fluent in Japanese, Mandarin and (Kiwi!) English.'),
            ('Network & Influence', 'Broad Influence and Access'),
            ('Connected where it counts', 'Services rendered to:'),
            ('American Chamber of Commerce in Japan (ACCJ)', 'Government'),
            ('Sports & Entertainment Business Committee | Vice Chair', 'Japan Sports Agency, JSPIN Advisor.'),
            ('An active leadership role connecting business, sports and entertainment communities in Japan.', ''),
            ('JSPIN (Japan Sports Industry Network)', 'Rights holders'),
            ('A Japan Sports Agency initiative supporting international exchange and growth in the sports industry.', 'baseball, cricket, golf, football, Formula One, rugby, and tennis.'),
            ('Global Brands & Partners', 'Services rendered to:'),
            ('Japan Sports Agency', 'Brands'),
            ('National-level sports industry engagement and international market support.', 'finance, payment services, sportswear, tech & wearables.'),
            ('Teams & Federations', 'Elite athletes'),
            ('Across baseball, cricket, golf, football, Formula One, rugby and tennis.', 'active and retired.'),
            ('Demonstrated Capabilities', 'Case Study: Apple'),
            ('Proven Execution', 'Demonstrated high-level facilitation capability:'),
            ('Able to listen, problem solve, and deliver on brief in two hours.', 'Receive and delivered on urgent brief within two hours.'),
            ('Ensured authentic and scandal-free talent selection.', 'Ensured authentic and scandal-free talent selection with Hanshin Tigers Legend.'),
            ('Structured value-in-kind opportunities without cash dependency.', 'Clear communication with all parties.'),
            ('Kept all parties aligned with clear, reliable communication.', 'Created a viral PR moment for Global CEO Tim Cook’s visit to Osaka.'),
            ('Built to connect naturally across cultures and stakeholder groups.', ''),
          ]
          for old, new in replacements:
            if old in s:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit text changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ppt-text-update.yml
          git add index.html
          git commit -m "Update website text to match PPT" || exit 0
          git push
