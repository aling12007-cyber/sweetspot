name: Stabilize heading system
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stabilize-headings.yml'
permissions:
  contents: write
jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stabilize heading controller and verify runtime
        run: python .github/scripts/stabilize_headings.py
      - name: Commit stabilized index only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Stabilize heading source of truth'
          git push
