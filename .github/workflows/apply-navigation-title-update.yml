name: Apply navigation title update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update navigation titles
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='index.html';
          let s=fs.readFileSync(path,'utf8');
          const newNav=String.raw`let e=[["points",{en:"What Sets Us Apart",ja:"\u9078\u3070\u308C\u308B\u7406\u7531",zh:"\u4E0E\u4F17\u4E0D\u540C\u7684\u7279\u8D28"}],["founder",{en:"Sam L. Pearson",ja:"Sam L. Pearson",zh:"Sam L. Pearson"}],["experience",{en:"Built across APAC",ja:"APAC\u3067\u7BC9\u3044\u305F\u30AD\u30E3\u30EA\u30A2",zh:"\u6DF1\u8015\u4E9A\u592A\u7684\u804C\u4E1A\u751F\u6DAF"}],["network",{en:"Connected where it counts",ja:"\u4FA1\u5024\u3042\u308B\u3064\u306A\u304C\u308A",zh:"\u8FDE\u63A5\u5173\u952E\u8D44\u6E90"}],["offers",{en:"Sweet Spot Offers Customized Solutions",ja:"Sweet Spot\u304C\u63D0\u4F9B\u3059\u308B\u30AB\u30B9\u30BF\u30E0\u30BD\u30EA\u30E5\u30FC\u30B7\u30E7\u30F3",zh:"Sweet Spot \u63D0\u4F9B\u5BA2\u5236\u5316\u89E3\u51B3\u65B9\u6848"}]]`;
          if(!s.includes(newNav)){
            const pattern=/let e=\[\["points",\{en:"Difference"[\s\S]*?\]\];return/;
            if(!pattern.test(s)) throw new Error('Navigation data not found');
            s=s.replace(pattern,newNav+';return');
          }
          const oldCss='.site-header nav{display:flex;align-items:center;gap:27px}.site-header nav a{color:#c6ccd4;font-size:11px;font-weight:800;letter-spacing:.1em;';
          const newCss='.site-header nav{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px)}.site-header nav a{color:#c6ccd4;font-size:clamp(8px,.72vw,10px);font-weight:800;letter-spacing:.07em;white-space:nowrap;';
          if(!s.includes(newCss)){
            if(!s.includes(oldCss)) throw new Error('Navigation CSS not found');
            s=s.replace(oldCss,newCss);
          }
          fs.writeFileSync(path,s);
          NODE
      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-navigation-title-update.yml
          git add index.html
          git commit -m "Match navigation labels to section titles"
          git push
