name: Fix Case Study final
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-case-study-final.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild high quality activity image
        shell: bash
        run: |
          cat .github/tmp/case640_00.b64 .github/tmp/case640_01.b64 .github/tmp/case640_02.b64 .github/tmp/case640_03.b64 .github/tmp/case640_04.b64 .github/tmp/case640_05.b64 | base64 --decode > assets/case-study-activity.webp
          test "$(wc -c < assets/case-study-activity.webp)" -gt 40000
          file assets/case-study-activity.webp | grep -qi 'Web/P image'
      - name: Patch Case Study source of truth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ("capabilities:['Case','Case Study Apple','Demonstrated high-level facilitation capability']", "capabilities:['Case','Case Study: Apple','Demonstrated high-level facilitation capability']", 1),
            ("en:{company:'Company Introduction',points:'Points of Difference',founder:'Introducing the Founder',experience:'Professional Journey',network:'Broad Influence and Access',capabilities:'Case Study Apple'}", "en:{company:'Company Introduction',points:'Points of Difference',founder:'Introducing the Founder',experience:'Professional Journey',network:'Broad Influence and Access',capabilities:'Case Study: Apple'}", 1),
            ('Case Study: APPLE','Case Study: Apple',3),
            ('assets/case-study-activity.jpg','assets/case-study-activity.webp',1),
          ]
          for old,new,minimum in replacements:
              count=s.count(old)
              if count < minimum:
                  raise RuntimeError(f'Expected at least {minimum} occurrence(s) of {old!r}, found {count}')
              s=s.replace(old,new)
          if "capabilities:['Case','Case Study Apple','Demonstrated high-level facilitation capability']" in s:
              raise RuntimeError('Old unified Case Study title remains')
          if "capabilities:'Case Study Apple'" in s:
              raise RuntimeError('Old navigation Case Study title remains')
          if 'Case Study: APPLE' in s:
              raise RuntimeError('Uppercase runtime override remains')
          if 'assets/case-study-activity.jpg' in s:
              raise RuntimeError('Old low-quality activity image reference remains')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify runtime Case Study block
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/sweetspot-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8000/ >/tmp/sweetspot-dom.html
          python - <<'PY'
          from pathlib import Path
          d=Path('/tmp/sweetspot-dom.html').read_text(encoding='utf-8',errors='replace')
          assert 'Case Study: Apple' in d, 'Rendered Case Study title missing colon'
          assert 'data-case-study-activity="1"' in d, 'Activity image element missing'
          assert 'assets/case-study-activity.webp' in d, 'High-quality WebP is not rendered'
          print('Rendered Case Study verification passed')
          PY
      - name: Clean temporary files and commit
        shell: bash
        run: |
          rm -f assets/case-study-activity.jpg
          git rm -r .github/tmp
          git rm .github/workflows/fix-case-study-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html assets .github/workflows/validate-heading-integrity.yml
          git diff --cached --check
          git status --short
          git commit -m 'Fix Case Study title and photo quality'
          git push origin main
